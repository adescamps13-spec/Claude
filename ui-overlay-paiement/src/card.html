<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte paiement – overlay</title>
<style>
  :root {
    --w: 330px;          /* largeur finale de la carte */
    --radius: 22px;
  }
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Inter", "Inter Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.preview { background: #b98f73; }

  #stage {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: flex-end;      /* la carte grandit vers le haut, bord bas fixe */
    justify-content: center;
    padding-bottom: 40px;
    box-sizing: border-box;
  }

  #card {
    position: relative;
    box-sizing: border-box;
    width: var(--w);
    border-radius: var(--radius);
    overflow: hidden;
    transform-origin: 50% 100%;
    background:
      linear-gradient(165deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.14) 45%, rgba(255,255,255,0.20) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.42),
      inset 0 1.5px 0 rgba(255,255,255,0.65),
      inset 0 -12px 28px rgba(255,255,255,0.10),
      0 14px 34px rgba(40,20,10,0.16);
  }
  body.matte #card { background: #fff; box-shadow: none; }
  body.matte #content, body.matte #sheen { visibility: hidden; }

  #sheen {
    position: absolute; inset: -40% -60%;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,0.22) 49%, rgba(255,255,255,0.05) 53%, transparent 58%);
    pointer-events: none;
  }

  #content {
    position: relative;
    width: var(--w);
    box-sizing: border-box;
    padding: 20px 20px 18px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(60,30,15,0.18);
  }

  .row { overflow: hidden; }
  .row-inner { display: flex; align-items: flex-start; gap: 10px; }

  .k-title .row-inner { padding-bottom: 14px; }
  .k-title .label { font-size: 18.5px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .k-title .icon { width: 20px; height: 20px; margin-top: 2px; }

  .sep { height: 1px; background: rgba(255,255,255,0.28); margin: 0 0 12px; }

  .k-main .row-inner { padding: 5px 0; align-items: center; }
  .k-main .label { font-size: 15px; font-weight: 500; letter-spacing: -0.005em; }
  .k-main .icon { width: 18px; height: 18px; }

  .k-sub .row-inner { padding: 3.5px 0 3.5px 30px; align-items: center; gap: 9px; }
  .k-sub .label { font-size: 13px; font-weight: 450; opacity: 0.86; }
  .k-sub .icon { width: 12px; height: 12px; }

  .gap { height: 6px; }

  .icon { flex: none; position: relative; }
  .icon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .icon .spin circle { fill: none; stroke: #fff; stroke-linecap: round; }
  .icon .done circle { fill: none; stroke: #fff; }
  .icon path { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div id="sheen"></div>
    <div id="content"></div>
  </div>
</div>

<script>
// ─── Contenu ──────────────────────────────────────────────────────────────
// kind: title | main | sub | sep | gap ; at: instant d'apparition (s)
const ITEMS = [
  { kind: "title", text: "Paiement titre\u00a0restaurant / carte\u00a0wallet", at: 0.55 },
  { kind: "sep",   at: 0.95 },
  { kind: "main",  text: "Conformité",                     at: 1.10 },
  { kind: "sub",   text: "Établissement agréé",            at: 1.55 },
  { kind: "sub",   text: "Hors dimanches et jours fériés", at: 1.85 },
  { kind: "sub",   text: "Plafond quotidien",              at: 2.15 },
  { kind: "gap",   at: 2.55 },
  { kind: "main",  text: "Paiement accepté",               at: 2.55 },
  { kind: "sub",   text: "Solde mis à jour",               at: 3.00 },
  { kind: "gap",   at: 3.45 },
  { kind: "main",  text: "Cashback crédité",               at: 3.45 },
];
const SPIN = 0.45;        // durée du spinner avant la coche
const EXPAND = 0.38;      // durée d'ouverture d'une ligne
const HOLD_END = 5.6;     // début de la sortie
const DURATION = 7.0;

const params = new URLSearchParams(location.search);
if (params.has("matte")) document.body.classList.add("matte");
if (params.has("preview")) document.body.classList.add("preview");

// ─── Construction du DOM ─────────────────────────────────────────────────
const content = document.getElementById("content");
const card = document.getElementById("card");
const sheen = document.getElementById("sheen");

function iconSVG(kind) {
  if (kind === "sub") {
    return `<svg viewBox="0 0 12 12" class="done"><path d="M2 6.4 L4.8 9 L10 3.2" stroke-width="1.7"/></svg>
            <svg viewBox="0 0 12 12" class="spin"><circle cx="6" cy="6" r="4.6" stroke-width="1.4" stroke-dasharray="9 30"/></svg>`;
  }
  return `<svg viewBox="0 0 20 20" class="done"><circle cx="10" cy="10" r="8.6" stroke-width="1.5"/><path d="M6.2 10.3 L8.9 12.9 L13.9 7.4" stroke-width="1.6"/></svg>
          <svg viewBox="0 0 20 20" class="spin"><circle cx="10" cy="10" r="8.6" stroke-width="1.6" stroke-dasharray="16 60"/></svg>`;
}

const rows = ITEMS.map(it => {
  const row = document.createElement("div");
  row.className = "row k-" + it.kind;
  if (it.kind === "sep") row.innerHTML = `<div class="sep"></div>`;
  else if (it.kind === "gap") row.innerHTML = `<div class="gap"></div>`;
  else row.innerHTML = `<div class="row-inner"><div class="icon">${iconSVG(it.kind)}</div><div class="label">${it.text}</div></div>`;
  content.appendChild(row);
  const el = { it, row, inner: row.firstElementChild,
    spin: row.querySelector(".spin"), done: row.querySelector(".done"),
    check: row.querySelector(".done path"), ring: row.querySelector(".done circle") };
  el.h = row.scrollHeight;
  if (el.check) { el.len = el.check.getTotalLength(); el.check.style.strokeDasharray = el.len; }
  return el;
});

// ─── Easing ──────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const easeOutBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const lerp = (a, b, x) => a + (b - a) * x;

const W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--w"));

// ─── Rendu d'un instant t (s) ────────────────────────────────────────────
window.render = function (t) {
  // Rangées
  let contentH = 0;
  for (const r of rows) {
    const a = r.it.at;
    const pe = easeInOut(prog(t, a, EXPAND));
    r.row.style.height = (r.h * pe) + "px";
    contentH += r.h * pe;
    if (!r.inner) continue;
    const pf = easeOut(prog(t, a + 0.08, 0.35));
    r.inner.style.opacity = pf;
    r.inner.style.transform = `translateY(${(1 - pf) * 6}px)`;
    r.inner.style.filter = `blur(${(1 - pf) * 3}px)`;
    if (r.spin) {
      const ps = t - a;
      const isDone = ps >= SPIN;
      r.spin.style.opacity = isDone ? 0 : 1;
      r.spin.style.transform = `rotate(${ps * 520}deg)`;
      const pc = prog(t, a + SPIN, 0.3);
      r.done.style.opacity = isDone ? 1 : 0;
      r.done.style.transform = `scale(${lerp(0.7, 1, easeOutBack(pc))})`;
      r.check.style.strokeDashoffset = r.len * (1 - easeOut(prog(t, a + SPIN + 0.04, 0.26)));
      if (r.ring) r.ring.style.opacity = lerp(0.5, 1, easeOut(pc));
    }
  }

  // Géométrie de la carte : goutte → carte → (sortie) → goutte
  const padV = 38;
  const fullH = contentH + padV;
  const pIn = easeOut(prog(t, 0, 0.35));                 // apparition de la goutte
  const pMorph = easeInOut(prog(t, 0.28, 0.5));          // goutte → carte
  const pOut = easeInOut(prog(t, HOLD_END, 0.55));       // flou / soulèvement
  const pShrink = easeInOut(prog(t, HOLD_END + 0.45, 0.5)); // carte → goutte
  const pGone = easeOut(prog(t, HOLD_END + 0.85, 0.4));  // disparition

  let w = lerp(30, W, pMorph);
  let h = Math.max(lerp(44, 60, pMorph), fullH);
  w = lerp(w, 150, pShrink);
  h = lerp(h, 64, pShrink);
  const radius = lerp(15, 22, pMorph);

  card.style.width = w + "px";
  card.style.height = h + "px";
  card.style.borderRadius = radius + "px";
  card.style.opacity = pIn * (1 - pGone);
  const s = lerp(0.6, 1, easeOutBack(pIn)) * lerp(1, 1.04, pOut) * lerp(1, 0.9, pGone);
  card.style.transform = `translateY(${-14 * pOut + 14 * pShrink}px) scale(${s})`;

  content.style.marginLeft = ((w - W) / 2) + "px";
  content.style.opacity = 1 - pOut;
  content.style.filter = `blur(${pOut * 9}px)`;

  // Reflet lumineux qui traverse la carte
  const sweep = (t - 0.6) / 2.6;
  sheen.style.transform = `translateX(${lerp(-70, 70, clamp(sweep))}%)`;
  sheen.style.opacity = sweep > 0 && sweep < 1 ? Math.sin(Math.PI * sweep) : 0;
};
window.DURATION = DURATION;

// Prévisualisation en navigateur : ouvrir card.html?preview&play
if (params.has("play")) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % (DURATION + 0.6)); requestAnimationFrame(loop); })();
} else {
  render(params.has("t") ? parseFloat(params.get("t")) : 4.5);
}
</script>
</body>
</html>
