<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300;font-display:block;src:url('assets/fonts/DMSans-300-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:italic;font-weight:400;font-display:block;src:url('assets/fonts/DMSans-400-italic.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/DMSans-400-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/DMSans-500-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/DMSans-600-normal.woff2') format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;src:url('assets/fonts/InstrumentSerif-400-italic.woff2') format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/InstrumentSerif-400-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:300;font-display:block;src:url('assets/fonts/Unbounded-300-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/Unbounded-400-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/Unbounded-500-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/Unbounded-600-normal.woff2') format('woff2');}

#root{position:absolute;inset:0;overflow:hidden;background:#FFFFFF;color:#212C34;font-family:'DM Sans',sans-serif}
#root .wash{position:absolute;inset:-10%;background:
  radial-gradient(42% 46% at 14% 62%, rgba(86,160,170,.30) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(36% 40% at 84% 58%, rgba(171,162,86,.28) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(28% 30% at 50% 52%, rgba(105,85,170,.20) 0%, rgba(255,255,255,0) 100%)}
#root svg.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#root .t-title{font-family:Unbounded,sans-serif;font-weight:400;letter-spacing:-.01em}
#root .t-serif{font-family:'Instrument Serif',serif;font-weight:400}
#root .abs{position:absolute}
#root .rail{position:absolute;left:120px;top:78px;display:flex;gap:56px;font-size:22px;font-weight:600;color:#747779}
#root .rail .n{font-family:Unbounded,sans-serif;font-weight:500;margin-right:14px}
#root .rail .on{color:#212C34}
#root .rail .on .n{color:#6955AA}
#root .rail .done{color:#4F575D}
#root .rail-bar{position:absolute;left:120px;top:126px;height:3px;background:#6955AA;transform-origin:left center}

      </style>
      <div id="root" data-composition-id="s10-couture" data-width="1920" data-height="1080" data-duration="10.5">
<style>
  #s10-couture-band{position:absolute;left:0;top:0;width:1920px;height:560px;background:#D4CCEE;opacity:0}
  .s10-lab{position:absolute;font-family:Unbounded,sans-serif;font-weight:500;font-size:30px;color:#212C34}
  .s10-sub{position:absolute;font-size:30px;font-weight:300;color:#6B7278}
  .s10-line{position:absolute;left:0;right:0;text-align:center}
  #s10-couture-a{top:860px;font-size:46px;font-weight:300;color:#212C34}
  #s10-couture-b{top:850px;font-family:Unbounded,sans-serif;font-size:60px;color:#212C34}
  #s10-couture-c{top:950px;font-size:44px;font-weight:500;color:#6955AA}
</style>
<div class="wash"></div>
<div id="s10-couture-band"></div>
<svg class="stage" id="s10-couture-stage" viewBox="0 0 1920 1080"></svg>
<div class="s10-lab" id="s10-couture-l1" style="left:120px;top:70px">Côté Relax</div>
<div class="s10-sub" id="s10-couture-s1" style="right:120px;top:72px">beaucoup de mouvement</div>
<div class="s10-lab" id="s10-couture-l2" style="left:120px;top:610px">Côté client</div>
<div class="s10-sub" id="s10-couture-s2" style="right:120px;top:612px">un seul fil</div>
<div class="s10-line" id="s10-couture-a">On ne fait pas entrer un projet dans une agence.</div>
<div class="s10-line" id="s10-couture-b">On construit l'équipe autour du projet.</div>
<div class="s10-line" id="s10-couture-c">Aucune couture.</div>
<script>
  (function () {
    const ID = "s10-couture", D = 10.5, VO = {"start": 0.3, "agence": 2.2, "autour": 4.4, "relax": 5.6, "client": 7.2, "couture": 8.7};
    const { C, rng, el, defs, thread, jitter } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const r = rng(10);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);
    const CX = 960, CY = 300;

    // A — the agency box: rigid, square; the project: round, it doesn't fit
    const box = el("rect", { x: 560, y: 130, width: 340, height: 340, rx: 6, fill: "none", stroke: C.ink, "stroke-width": 4 }, svg);
    const boxLab = el("text", { x: 730, y: 112, "text-anchor": "middle", fill: C.ink2, "font-family": "DM Sans", "font-size": 24, "font-weight": 600, "letter-spacing": "3" }, svg);
    boxLab.textContent = "L'ORGANISATION D'UNE AGENCE";
    const blobG = el("g", { transform: "translate(1500 300)" }, svg);
    el("path", { d: "M 0 -120 C 80 -120, 140 -60, 128 10 C 118 90, 50 132, -20 124 C -100 114, -140 50, -126 -20 C -112 -90, -70 -120, 0 -120 Z", fill: C.lav }, blobG);
    const blobLab = el("text", { x: 0, y: 10, "text-anchor": "middle", fill: C.purple, "font-family": "Unbounded", "font-size": 30 }, blobG);
    blobLab.textContent = "le projet";
    tl.fromTo([box, boxLab], { opacity: 0 }, { opacity: 1, duration: 0.5 }, VO.start);
    tl.fromTo(blobG, { attr: { transform: "translate(1500 300)" }, opacity: 0 }, { attr: { transform: "translate(1060 300)" }, opacity: 1, duration: 1.1, ease: "power2.in" }, VO.start + 0.2);
    tl.to(blobG, { attr: { transform: "translate(1200 300)" }, duration: 0.7, ease: "back.out(2)" }, VO.start + 1.3);
    tl.fromTo($("a"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, VO.start);

    // B — the box dissolves; the team arranges itself around the project
    tl.to([box, boxLab], { opacity: 0, duration: 0.6, ease: "power1.in" }, VO.autour - 0.9);
    tl.to(blobG, { attr: { transform: `translate(${CX} ${CY})` }, duration: 1.0, ease: "power3.inOut" }, VO.autour - 0.8);
    tl.to($("a"), { opacity: 0, y: -16, duration: 0.4 }, VO.autour - 0.6);
    tl.fromTo($("b"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, VO.autour - 0.3);
    const COLS = [C.purple, C.cyan, C.red, C.purple, C.yellow, C.cyan, C.red];
    const team = COLS.map((col, i) => {
      const a = (i / 7) * Math.PI * 2 - Math.PI / 2, x = CX + Math.cos(a) * 215, y = CY + Math.sin(a) * 185;
      const g = el("g", { transform: `translate(${x} ${y})` }, svg);
      const inner = el("g", {}, g);
      el("circle", { r: 20, fill: col }, inner);
      tl.fromTo(inner, { x: (r() - 0.5) * 900, y: 300 + r() * 300, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, VO.autour - 0.4 + i * 0.06);
      return { g, inner };
    });

    // C — two tempos: above, constant movement; below, one calm thread
    tl.fromTo($("band"), { opacity: 0 }, { opacity: 0.45, duration: 0.8 }, VO.relax - 0.4);
    tl.fromTo([$("l1"), $("s1")], { opacity: 0 }, { opacity: 1, duration: 0.5 }, VO.relax - 0.2);
    // satellites of motion: many small strokes buzzing around the team
    const buzz = el("g", {}, svg);
    for (let i = 0; i < 46; i++) {
      const x = 160 + r() * 1600, y = 150 + r() * 360, a = r() * 6.28, L = 26 + r() * 50, col = COLS[i % 7];
      const g = el("g", { transform: `translate(${x} ${y})` }, buzz);
      const inner = el("g", {}, g);
      el("line", { x1: 0, y1: 0, x2: Math.cos(a) * L, y2: Math.sin(a) * L, stroke: col, "stroke-width": 3, opacity: 0.7 }, inner);
      el("circle", { r: 5, fill: col }, inner);
      tl.fromTo(inner, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, VO.relax - 0.2 + (i % 12) * 0.04);
      tl.to(inner, { rotation: (r() - 0.5) * 140, duration: 0.6 + r() * 0.5, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((D - VO.relax) / 0.8) - 1) }, VO.relax + 0.2);
    }
    team.forEach((t) => jitter(tl, t.g.firstChild, r, 14, 12, VO.relax + 0.3, D));
    tl.to($("b"), { opacity: 0, duration: 0.4 }, VO.client - 0.5);
    const th = thread(svg, ID, "M -20 780 L 1940 780", { w: 6, head: false });
    th.draw(tl, 0, 1, VO.client - 0.6, 1.6, "power2.inOut");
    tl.fromTo([$("l2"), $("s2")], { opacity: 0 }, { opacity: 1, duration: 0.5 }, VO.client - 0.2);

    // D — "Aucune couture."
    tl.fromTo($("c"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, VO.couture - 0.1);
    window.__timelines[ID] = tl;
  })();
</script>

      </div>
    </template>
  </body>
</html>
