<script>
  (function () {

    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const r = KIT.rng(5);
    const COLS = ["#CAC3E1", "#C3DDE1", "#E0DEC3", "#E1C3C3", "#A99CF0", "#8FD3DC", "#F4A3D2", "#D4CCEE"];
    const COLX = [340, 760, 1180], TARGET = ["#191853", "#5A80D9", "#4A5892"], ROWS = 8, RH = 505 / ROWS;

      for (let j = 0; j < ROWS; j++) {
        const t = document.createElement("div");

        $("tiles").appendChild(t);
        tiles.push({ el: t, c, j, x0: 120 + r() * 1400, y0: 230 + r() * 560, z0: -500 + r() * 700, rx: -60 + r() * 120, rz: -50 + r() * 100 });
      }
    const a = VO["3.0"], b = VO["3.1"];
    // the scattered group, in 3D, drifting
    tiles.forEach((o, i) => {
      tl.fromTo(o.el, { x: o.x0 + 400, y: o.y0, z: o.z0, rotationX: o.rx, rotationZ: o.rz, scaleX: 0.34, scaleY: 1.9, opacity: 0 },
        { x: o.x0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.02 * (i % 9));
      // "nous avons tout décliné": every piece finds its place in three readable families

    tl.fromTo("#c1-structure-title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, a - 0.1);
    // …and the families are the real ones, as they live on the new site
    tl.fromTo("#c1-structure-real", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, b + 1.5);
    tl.to("#c1-structure-tiles", { opacity: 0, duration: 0.25, ease: "none" }, b + 1.75);
    // the four decisions, as a tab bar; a focus frame walks the page with them
    const TABS = ["architecture", "catégories", "naming", "place des marques"], TW = [290, 260, 220, 474];
    let x = 8;
    const tx = TABS.map((s, i) => {
      const d = document.createElement("div");
      d.className = ID + "-tab";
      d.textContent = s;
      d.style.left = x + "px";
      d.style.width = TW[i] + "px";
      d.dataset.i = i;
      $("tabs").appendChild(d);
      const at = x;
      x += TW[i];
      return at;
    });
    const tabEls = [...$("tabs").querySelectorAll("." + ID + "-tab")];
    const AREAS = [[326, 266, 1268, 533], [330, 326, 1260, 92], [778, 326, 230, 92], [1200, 550, 320, 152]];
    const cues = [VO["3.2"], VO["3.3"], VO["3.4"], VO["3.5"]];

    tl.set("#c1-structure-focus", { x: AREAS[0][0], y: AREAS[0][1], width: AREAS[0][2], height: AREAS[0][3], opacity: 0 }, 0);
    tl.fromTo("#c1-structure-focus", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, cues[0] - 0.1);
    tl.set("#c1-structure-hi", { x: tx[0], width: TW[0] }, 0);
    tl.fromTo("#c1-structure-hi", { opacity: 0 }, { opacity: 1, duration: 0.2 }, cues[0] - 0.1);
    tabEls.forEach((t, i) => tl.to(t, { color: "#FFFFFF", duration: 0.2 }, cues[i] - 0.05));
    tabEls.forEach((t, i) => i < 3 && tl.to(t, { color: "#4F575D", duration: 0.2 }, cues[i + 1] - 0.05));
    for (let i = 1; i < 4; i++) {
      const [l, tp, w, h] = AREAS[i];
      tl.to("#c1-structure-hi", { x: tx[i], width: TW[i], duration: 0.4, ease: "expo.inOut" }, cues[i] - 0.12);
      tl.to("#c1-structure-focus", { x: l, y: tp, width: w, height: h, duration: 0.45, ease: "expo.inOut" }, cues[i] - 0.12);

  })();
