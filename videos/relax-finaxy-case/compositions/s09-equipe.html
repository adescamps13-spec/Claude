<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300;font-display:block;src:url('assets/fonts/DMSans-300-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:italic;font-weight:400;font-display:block;src:url('assets/fonts/DMSans-400-italic.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/DMSans-400-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/DMSans-500-normal.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/DMSans-600-normal.woff2') format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:block;src:url('assets/fonts/InstrumentSerif-400-italic.woff2') format('woff2');}
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/InstrumentSerif-400-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:300;font-display:block;src:url('assets/fonts/Unbounded-300-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/Unbounded-400-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/Unbounded-500-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/Unbounded-600-normal.woff2') format('woff2');}

#root{position:absolute;inset:0;overflow:hidden;background:#FFFFFF;color:#212C34;font-family:'DM Sans',sans-serif}
#root .wash{position:absolute;inset:-10%;background:
  radial-gradient(42% 46% at 14% 62%, rgba(86,160,170,.30) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(36% 40% at 84% 58%, rgba(171,162,86,.28) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(28% 30% at 50% 52%, rgba(105,85,170,.20) 0%, rgba(255,255,255,0) 100%)}
#root svg.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#root .t-title{font-family:Unbounded,sans-serif;font-weight:400;letter-spacing:-.01em}
#root .t-serif{font-family:'Instrument Serif',serif;font-weight:400}
#root .abs{position:absolute}
#root .rail{position:absolute;left:120px;top:78px;display:flex;gap:56px;font-size:22px;font-weight:600;color:#747779}
#root .rail .n{font-family:Unbounded,sans-serif;font-weight:500;margin-right:14px}
#root .rail .on{color:#212C34}
#root .rail .on .n{color:#6955AA}
#root .rail .done{color:#4F575D}
#root .rail-bar{position:absolute;left:120px;top:126px;height:3px;background:#6955AA;transform-origin:left center}

      </style>
      <div id="root" data-composition-id="s09-equipe" data-width="1920" data-height="1080" data-duration="16.5">
<style>
  .s09-pill{position:absolute;padding:14px 30px;border-radius:40px;color:#fff;font-size:30px;font-weight:500;white-space:nowrap;transform-origin:50% 50%;box-shadow:0 10px 26px rgba(31,20,67,.14)}
  #s09-equipe-h{position:absolute;left:0;right:0;top:840px;text-align:center;font-family:Unbounded,sans-serif;font-size:62px;color:#212C34}
  #s09-equipe-s{position:absolute;left:0;right:0;top:945px;text-align:center;font-size:40px;font-weight:300;color:#6B7278}
</style>
<div class="wash"></div>
<svg class="stage" id="s09-equipe-stage" viewBox="0 0 1920 1080"></svg>
<div id="s09-equipe-pills"></div>
<div id="s09-equipe-h">Pour chaque enjeu, la bonne équipe.</div>
<div id="s09-equipe-s">Et elle joue comme une seule.</div>
<script>
  (function () {
    const ID = "s09-equipe", D = 16.5, VO = {"start": 0.4, "d0": 0.67, "d1": 2.0, "d2": 3.53, "d3": 4.76, "d4": 6.02, "d5": 7.55, "d6": 8.89, "equipe": 11.48, "seule": 14.1};
    const { C, el, defs, thread } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);

    const DISC = [["Stratégie", C.purple, 250, 250], ["Architecture de marque", C.cyan, 560, 400], ["Naming", C.red, 900, 210],
      ["Design", C.purple, 1180, 400], ["Éditorial", C.yellow, 1440, 230], ["Production", C.cyan, 1680, 410], ["IA", C.red, 960, 540]];
    const host = $("pills");
    // links between neighbours, then every discipline down to the one line
    const links = el("g", {}, svg), feeds = el("g", {}, svg);
    DISC.forEach(([, , x, y], i) => {
      DISC.slice(i + 1, i + 3).forEach(([, , x2, y2]) => {
        const ln = el("line", { x1: x, y1: y, x2, y2, stroke: C.lav, "stroke-width": 3, opacity: 0 }, links);
        tl.fromTo(ln, { opacity: 0 }, { opacity: 1, duration: 0.5 }, VO["d" + Math.min(6, i + 1)] + 0.1);
      });
    });
    const feedPaths = DISC.map(([, , x, y]) => {
      const p = el("path", { d: `M ${x} ${y + 30} C ${x} 640, 960 620, 960 760`, fill: "none", stroke: C.purple, "stroke-width": 2.5, opacity: 0.5 }, feeds);
      const L = p.getTotalLength();
      p.style.strokeDasharray = `${L} ${L}`;
      return [p, L];
    });
    const pills = DISC.map(([name, col, x, y], i) => {
      const d = document.createElement("div");
      d.className = "s09-pill";
      d.textContent = name;
      d.style.background = col;
      if (col === C.yellow) d.style.color = "#2B2A14";
      d.style.left = x + "px";
      d.style.top = y + "px";
      host.appendChild(d);
      return d;
    });
    // pills spring in exactly on the word that names them
    pills.forEach((p, i) => tl.fromTo(p, { opacity: 0, scale: 0.3, xPercent: -50, yPercent: -50 }, { opacity: 1, scale: 1, xPercent: -50, yPercent: -50, duration: 0.45, ease: "back.out(2.4)" }, VO["d" + i] - 0.05));
    // the line under everything: one thread, centred
    const th = thread(svg, ID, "M -20 540 C 300 540, 420 760, 760 760 L 1940 760", { w: 6, head: false });
    th.draw(tl, 0, 0.42, 0, 1.0, "power2.out");
    feedPaths.forEach(([p, L], i) => tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, VO.equipe - 1.4 + i * 0.07));
    const dot = el("circle", { cx: 960, cy: 760, r: 13, fill: C.pink, opacity: 0 }, svg);
    tl.fromTo(dot, { opacity: 0, attr: { r: 4 } }, { opacity: 1, attr: { r: 13 }, duration: 0.4, ease: "back.out(3)" }, VO.equipe - 0.5);
    th.draw(tl, 0.42, 1, VO.equipe - 0.6, 1.6, "power2.inOut");

    tl.fromTo($("h"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, VO.equipe - 0.3);
    tl.fromTo($("s"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, VO.seule - 0.6);
    // "comme une seule": every discipline breathes in unison
    tl.to(pills, { scale: 1.06, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, VO.seule - 0.2);

    tl.to([$("h"), $("s")], { opacity: 0, duration: 0.5, ease: "power1.in" }, D - 0.5);
    window.__timelines[ID] = tl;
  })();
</script>

      </div>
    </template>
  </body>
</html>
