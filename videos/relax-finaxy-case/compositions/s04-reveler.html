  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>

@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:block;src:url('assets/fonts/InstrumentSerif-400-normal.woff2') format('woff2');}

@font-face{font-family:'Unbounded';font-style:normal;font-weight:500;font-display:block;src:url('assets/fonts/Unbounded-500-normal.woff2') format('woff2');}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:600;font-display:block;src:url('assets/fonts/Unbounded-600-normal.woff2') format('woff2');}

#root{position:absolute;inset:0;overflow:hidden;background:#FFFFFF;color:#212C34;font-family:'DM Sans',sans-serif}
#root .wash{position:absolute;inset:-10%;background:
  radial-gradient(42% 46% at 14% 62%, rgba(86,160,170,.30) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(36% 40% at 84% 58%, rgba(171,162,86,.28) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(28% 30% at 50% 52%, rgba(105,85,170,.20) 0%, rgba(255,255,255,0) 100%)}
#root svg.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#root .t-title{font-family:Unbounded,sans-serif;font-weight:400;letter-spacing:-.01em}
#root .t-serif{font-family:'Instrument Serif',serif;font-weight:400}
#root .abs{position:absolute}
#root .rail{position:absolute;left:120px;top:78px;display:flex;gap:56px;font-size:22px;font-weight:600;color:#747779}
#root .rail .n{font-family:Unbounded,sans-serif;font-weight:500;margin-right:14px}
#root .rail .on{color:#212C34}
#root .rail .on .n{color:#6955AA}
#root .rail .done{color:#4F575D}
#root .rail-bar{position:absolute;left:120px;top:126px;height:3px;background:#6955AA;transform-origin:left center}

      </style>
      <div id="root" data-composition-id="s04-reveler" data-width="1920" data-height="1080" data-duration="9">
<style>
  .s04-pole{position:absolute;top:880px;width:860px;text-align:center;font-family:'Instrument Serif',serif;font-size:72px;line-height:1.1}
  #s04-reveler-note{position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:30px;font-weight:300;color:#6B7278}
</style>
<div class="wash"></div>
<div id="s04-reveler-rail"><div class="rail"><div class="done"><span class="n">01</span>Comprendre</div><div class="on"><span class="n">02</span>Révéler</div><div class=""><span class="n">03</span>Organiser</div><div class=""><span class="n">04</span>Exprimer</div><div class=""><span class="n">05</span>Déployer</div></div><div class="rail-bar" style="width:484px"></div></div>
<svg class="stage" id="s04-reveler-stage" viewBox="0 0 1920 1080"></svg>
<div class="s04-pole" id="s04-reveler-g" style="left:50px;color:#191853">La force d'un groupe.</div>
<div class="s04-pole" id="s04-reveler-c" style="left:1010px;color:#9C0A3F;font-style:italic">L'esprit d'un cabinet.</div>
<div id="s04-reveler-note">Face à des risques multiples, aucune expertise isolée ne suffit.</div>
<script>
  (function () {
    const ID = "s04-reveler", D = 9, VO = {"start": 0.3, "groupe": 2.4, "cabinet": 3.6, "risques": 5.0, "suffit": 7.0};
    const { C, rng, el, defs, thread, progressNear } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const r = rng(4);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);

    // two meshes: the group (Finaxy blue) and the cabinets (Finaxy burgundy)
    const hubs = [[480, 560, C.fblue, VO.groupe], [1440, 560, C.burg, VO.cabinet]];
    const lines = el("g", {}, svg), dots = el("g", {}, svg);
    hubs.forEach(([hx, hy, col, cue], h) => {
      const pts = [];
      for (let i = 0; i < 13; i++) {
        const a = (i / 13) * Math.PI * 2 + r() * 0.4, rad = 110 + r() * 190;
        pts.push([hx + Math.cos(a) * rad * 1.15, hy + Math.sin(a) * rad * 0.85]);
      }
      pts.push([hx, hy]);
      // mesh edges: each point to two neighbours + the hub
      pts.forEach((p, i) => {
        [pts[(i + 1) % 13], pts[13]].forEach((q, k) => {
          if (i === 13) return;
          const ln = el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, "stroke-width": k ? 1.5 : 2, opacity: 0 }, lines);
          tl.fromTo(ln, { opacity: 0 }, { opacity: k ? 0.25 : 0.4, duration: 0.5, ease: "power1.out" }, cue - 0.6 + i * 0.03);
        });
      });
      // dots arrive from a grey scatter and take the colour
      pts.forEach(([x, y], i) => {
        const sx = 160 + r() * 1600, sy = 200 + r() * 600;
        const c = el("circle", { cx: 0, cy: 0, r: i === 13 ? 14 : 8, fill: C.grey, transform: `translate(${sx} ${sy})` }, dots);
        tl.fromTo(c, { attr: { transform: `translate(${sx} ${sy})` } }, { attr: { transform: `translate(${x} ${y})` }, duration: 1.3, ease: "power3.inOut" }, VO.start + 0.1 + h * 0.15 + i * 0.03);
        tl.to(c, { attr: { fill: col }, duration: 0.5 }, cue - 0.5 + i * 0.02);
      });
    });

    // the thread links the two poles — through both hubs — then leaves
    const th = thread(svg, ID, "M -20 540 C 200 540, 300 560, 480 560 C 760 380, 1160 740, 1440 560 C 1620 450, 1760 540, 1940 540", { w: 6 });
    th.set(0.02);
    const p1 = progressNear(th, 480, 560), p2 = progressNear(th, 1440, 560);
    th.draw(tl, 0.02, p1, VO.start, VO.groupe - VO.start, "sine.inOut");
    th.draw(tl, p1, p2, VO.groupe, VO.cabinet - VO.groupe + 0.2, "sine.inOut");

    tl.fromTo($("rail").querySelector(".rail-bar"), { scaleX: 0.55 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.2);
    tl.fromTo($("g"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, VO.groupe);
    tl.fromTo($("c"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, VO.cabinet);
    tl.fromTo($("note"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, VO.risques);

    th.draw(tl, p2, 1, D - 1.2, 1.2, "power2.in");
    tl.to([$("g"), $("c"), $("note")], { opacity: 0, duration: 0.5, ease: "power1.in" }, D - 0.5);
    window.__timelines[ID] = tl;
  })();
</script>

      </div>
    </template>
  </body>
