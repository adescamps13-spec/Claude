      <div id="root" style="background:transparent" data-composition-id="zz-trans" data-width="1920" data-height="1080" data-duration="115.09">
<style>
  #zz-trans-tr{position:absolute;inset:0;pointer-events:none}
  .zz-trans-blk{position:absolute;left:-200px;top:-100px;width:2320px;height:1280px;transform:skewX(-12deg) translateX(-2600px)}
  .zz-trans-blk i{position:absolute;top:0;bottom:0;width:60px;background:#FF0055}
  .zz-trans-cir{position:absolute;left:960px;top:540px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;border-radius:50%;transform:scale(0)}
</style>
<div id="zz-trans-tr"></div>
<script>
  (function () {
    const ID = "zz-trans", D = 115.09, SC = [["a1-rang", 0.0, 3.44], ["a2-croissance", 3.44, 1.79], ["a3-marque", 5.23, 8.23], ["a4-coherence", 13.46, 2.75], ["b1-ecouter", 16.21, 5.14], ["b2-deux-mondes", 21.35, 8.8], ["b3-reseau", 30.15, 7.44], ["b4-multiple", 37.59, 4.72], ["b5-isolee", 42.31, 3.18], ["c1-structure", 45.49, 7.16], ["c2-corps", 52.65, 7.12], ["c3-stature", 59.77, 5.86], ["d0-decliner", 65.63, 3.68], ["d1-supports", 69.31, 4.16], ["d2-site", 73.47, 2.67], ["d3-agent", 76.14, 7.31], ["e1-role", 83.45, 8.07], ["e2-organigramme", 91.52, 4.55], ["e3-autour", 96.07, 3.17], ["e4-cotes", 99.24, 5.8], ["e5-promesse", 105.04, 2.4], ["f-relax", 107.44, 7.65]];
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    // pastel colour blocks sweeping across (Stephan) and circular irises (twoclipping) hide the cuts;
    // continuous hand-offs (pill → dot, dive into the brochure, project → team, promise → sphere) keep no wipe
    const CONT = new Set(["a2-croissance", "a3-marque", "b5-isolee", "d1-supports", "e3-autour", "e4-cotes", "f-relax"]);
    const COLS = ["#CAC3E1", "#C3DDE1", "#E1C3C3", "#E0DEC3", "#D4CCEE"];
    let k = 0;
    SC.forEach(([id, start]) => {
      if (start === 0 || CONT.has(id)) return;
      const col = COLS[k % COLS.length], type = k % 2 ? "cir" : "blk";
      k++;
      const d = document.createElement("div");
      d.className = ID + "-" + type;
      d.style.background = col;
      if (type === "blk") d.innerHTML = `<i style="right:-60px"></i>`;
      $("tr").appendChild(d);
      if (type === "blk") {
        tl.fromTo(d, { x: -2600, skewX: -12 }, { x: 0, duration: 0.24, ease: "power3.in", immediateRender: false }, start - 0.24);
        tl.to(d, { x: 2600, duration: 0.3, ease: "power3.out" }, start + 0.02);
      } else {
        tl.fromTo(d, { scale: 0 }, { scale: 1, duration: 0.26, ease: "power3.in", immediateRender: false }, start - 0.26);
        tl.to(d, { yPercent: -110, duration: 0.32, ease: "power3.out" }, start + 0.02);
      }
    });
    tl.set({}, {}, D);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
