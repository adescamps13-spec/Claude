<script>
  (function () {
    const ID = "e3-promesse", D = 9.1, VO = {"1.0": -82.88, "1.1": -80.23, "1.2": -78.53, "1.3": -74.58, "1.4": -72.84, "1.5": -70.83, "2.0": -68.31, "2.1": -66.23, "2.2": -63.18, "2.3": -60.33, "2.4": -58.04, "2.5": -55.53, "3.0": -52.09, "3.1": -51.12, "3.2": -49.41, "3.3": -48.73, "3.4": -48.15, "3.5": -47.78, "3.6": -46.55, "3.7": -45.58, "3.8": -44.16, "3.9": -43.0, "3.10": -40.54, "3.11": -39.03, "3.12": -37.67, "3.13": -36.0, "4.0": -33.65, "4.1": -33.12, "4.2": -30.65, "4.3": -29.85, "4.4": -29.12, "4.5": -27.87, "4.6": -26.27, "4.7": -25.39, "4.8": -22.69, "4.9": -20.79, "4.10": -18.78, "5.0": -14.88, "5.1": -13.33, "5.2": -10.71, "5.3": -9.91, "5.4": -7.0, "5.5": -6.01, "5.6": -3.31, "5.7": 0.15, "5.8": 1.17, "5.9": 2.42, "5.10": 3.65, "5.11": 4.95, "5.12": 6.7, "5.13": 7.55, "breath": 9.4, "exhale": 11.15};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.7"], mv = VO["5.8"], cl = VO["5.9"], fil = VO["5.10"], cou = VO["5.11"], ca = VO["5.12"];
    // Relax side: the work never stops moving — nine tiles reshuffle in a 3x3 grid
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production", "Planning", "Achat d’art", "Contenus"];
    const COLS = ["#212C34", "#FF0055", "#56A0AA", "#ABA256", "#AA5655", "#3D2F7A", "#4B8A93", "#8C7BC8", "#16131F"];
    const tiles = TAL.map((t, i) => {
      const d = document.createElement("div");
      d.className = ID + "-tile";
      d.style.background = COLS[i];
      if (["#FF0055", "#56A0AA", "#ABA256", "#4B8A93", "#8C7BC8", "#AA5655"].includes(COLS[i])) d.style.color = "#16131F";
      d.textContent = t;
      $("grid").appendChild(d);
      return d;
    });
    const SX = (k) => 98 + (k % 3) * 256, SY = (k) => 420 + Math.floor(k / 3) * 172;
    const PERM = [[0, 1, 2, 3, 4, 5, 6, 7, 8], [1, 4, 0, 6, 2, 8, 3, 5, 7], [4, 2, 1, 5, 0, 7, 6, 8, 3], [2, 0, 4, 8, 1, 3, 5, 7, 6], [0, 5, 2, 7, 4, 6, 8, 3, 1], [5, 1, 7, 6, 3, 0, 4, 2, 8]];
    const sh = { t: 0 };
    const drawGrid = () => {
      const s = Math.floor(sh.t), f = sh.t - s, e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
      const A = PERM[s % PERM.length], B = PERM[(s + 1) % PERM.length];
      tiles.forEach((d, i) => {
        const x = SX(A[i]) + (SX(B[i]) - SX(A[i])) * e, y = SY(A[i]) + (SY(B[i]) - SY(A[i])) * e;
        const lift = Math.sin(f * Math.PI) * (A[i] !== B[i] ? 1 : 0);
        d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 - 0.08 * lift).toFixed(3)}) rotate(${(lift * (i % 2 ? 6 : -6)).toFixed(2)}deg)`;
      });
    };
    drawGrid();
    tl.fromTo(sh, { t: 0 }, { t: (D - a) / 0.55, duration: D - a, ease: "none", onUpdate: drawGrid }, a);
    tl.fromTo("#e3-promesse-grid", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, a);
    tl.fromTo("#e3-promesse-ll", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, a - 0.1);
    tl.fromTo("#e3-promesse-lh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, mv - 0.1);
    // the Relax side starts full frame, then the client side opens beside it, a seam between them
    tl.fromTo("#e3-promesse-left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 968px 0px 0px)", duration: 0.8, ease: "expo.inOut" }, cl - 0.35);
    tl.fromTo("#e3-promesse-rl", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, cl);
    tl.fromTo("#e3-promesse-rh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, fil - 0.1);
    tl.fromTo("#e3-promesse-pill", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, fil + 0.1);
    tl.to("#e3-promesse-pill", { scale: 1.03, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, fil + 0.7);
    // "zéro couture": the seam closes — all that movement now lives inside one seamless surface
    tl.to("#e3-promesse-left", { xPercent: -100, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.to(["#e3-promesse-rl", "#e3-promesse-rh"], { opacity: 0, duration: 0.3 }, cou - 0.3);
    tl.to("#e3-promesse-pill", { x: 960 - 1446, y: -40, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.fromTo("#e3-promesse-irid", { opacity: 0 }, { opacity: 1, duration: 0.6 }, cou);
    tl.fromTo("#e3-promesse-irid", { backgroundPosition: "0% 0%" }, { backgroundPosition: "100% 0%", duration: D - cou, ease: "none", immediateRender: false }, cou);
    tl.to("#e3-promesse-pill span", { color: "#212C34", duration: 0.4 }, cou + 0.1);
    tl.fromTo("#e3-promesse-zero", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cou + 0.1);
    // "C'est ça, notre promesse."
    tl.to("#e3-promesse-zero", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, ca - 0.3);
    tl.to("#e3-promesse-pill", { y: 140, scale: 0.6, duration: 0.6, ease: "expo.inOut" }, ca - 0.3);
    tl.fromTo("#e3-promesse-ptag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, ca - 0.05);
    tl.fromTo(["#e3-promesse-p1", "#e3-promesse-p2"], { y: 100 }, { y: 0, duration: 0.8, ease: "expo.out", stagger: 0.16 }, ca + 0.1);
    tl.to("#e3-promesse-pill", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.45);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
