<script>
  (function () {
    const ID = "d3-agent", D = 7.31, VO = {"1.0": -75.41, "1.1": -72.55, "1.2": -70.76, "1.3": -68.14, "1.4": -64.42, "1.5": -62.53, "2.0": -59.78, "2.1": -57.53, "2.2": -54.64, "2.3": -52.63, "2.4": -50.44, "2.5": -48.84, "2.6": -47.76, "2.7": -45.84, "2.8": -45.36, "2.9": -42.88, "2.10": -38.4, "2.11": -36.34, "2.12": -33.68, "3.0": -30.5, "3.1": -29.51, "3.2": -27.76, "3.3": -26.62, "3.4": -25.67, "3.5": -24.7, "3.6": -23.34, "3.7": -22.62, "3.8": -20.79, "3.9": -19.66, "3.10": -16.22, "3.11": -15.11, "3.12": -13.31, "4.0": -10.36, "4.1": -8.18, "4.2": -6.68, "4.3": -5.87, "4.4": -4.91, "4.5": -3.66, "4.6": -2.52, "4.7": 0.15, "4.8": 1.67, "4.9": 3.15, "5.0": 7.46, "5.1": 9.01, "5.2": 11.78, "5.3": 12.58, "5.4": 15.53, "5.5": 16.74, "5.6": 20.08, "5.7": 23.25, "5.8": 24.29, "5.9": 25.62, "5.10": 26.56, "5.11": 27.53, "5.12": 29.05, "5.13": 29.82, "breath": 31.6, "exhale": 33.35};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["4.7"], ag = VO["4.8"], ch = VO["4.9"], CUT = ag - 0.12;
    // ── the cake and its cherry, a small glossy 3D object ──
    const S = T3.stage($("gl"), { w: 1920, h: 1080, fov: 26, camZ: 14, camY: 3.2 });
    S.camera.lookAt(0, 0.9, 0);
    const cake = new THREE.Group();
    [[1.75, 0.8, 0xbdb0f2], [1.35, 0.7, 0xf6eee2], [0.95, 0.62, 0xf4b3dc]].reduce((y, [rad, h, c]) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, h, 64, 1), T3.clay(c, { roughness: 0.42 }));
      m.position.y = y + h / 2; cake.add(m);
      const lip = new THREE.Mesh(new THREE.TorusGeometry(rad, 0.07, 16, 80), T3.clay(0xffffff, { roughness: 0.35 }));
      lip.rotation.x = Math.PI / 2; lip.position.y = y + h; cake.add(lip);
      return y + h;
    }, 0);
    const shC = T3.shadow(2.6, 0.22); shC.position.y = 0.01; cake.add(shC);
    S.scene.add(cake);
    const cherry = new THREE.Group();
    const berry = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 48), T3.glossy(0xff1f66, { irid: 0.25, roughness: 0.12 }));
    cherry.add(berry);
    const stemCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(0.08, 0.7, 0), new THREE.Vector3(0.3, 0.95, 0)]);
    const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 24, 0.035, 8), T3.clay(0x6e8f5a));
    cherry.add(stem);
    S.scene.add(cherry);
    const TOP = 2.12 + 0.42;
    const draw = (t) => {
      const k = T3.ease.clamp((t - a - 0.35) / 0.55);
      // drop with a bounce, squash on landing
      const fall = k < 1 ? 6 * (1 - k * k) : 0, land = T3.ease.clamp((t - a - 0.9) / 0.35);
      cherry.position.set(0, TOP + fall + Math.sin(land * Math.PI) * 0.35 * (1 - land), 0);
      const sq = land > 0 && land < 1 ? 1 - 0.18 * Math.sin(land * Math.PI) : 1;
      berry.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      cake.rotation.y = -0.4 + t * 0.35;
      cherry.rotation.y = cake.rotation.y;
      S.camera.position.x = Math.sin(t * 0.4) * 1.2;
      S.camera.lookAt(0, 2.0, 0);
      S.render();
    };
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: CUT, duration: CUT, ease: "none", onUpdate: () => draw(p.t) }, 0);
    draw(0);
    tl.fromTo("#d3-agent-q", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, a - 0.05);
    tl.fromTo("#d3-agent-gl", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0);
    // ── cut: the cherry becomes the agent's avatar ──
    tl.set(["#d3-agent-gl", "#d3-agent-q"], { display: "none" }, CUT);
    tl.fromTo("#d3-agent-ui", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, CUT);
    tl.fromTo("#d3-agent-chat", { y: 120, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, CUT);
    tl.fromTo("#d3-agent-av", { scale: 3 }, { scale: 1, duration: 0.6, ease: "expo.out" }, CUT);
    // every resource the agent writes from (real Finaxy documents)
    const RES = [["charte-1.png", "Charte éditoriale", "assets/real/"], ["plateforme-01.png", "Plateforme de marque", "assets/real/"], ["site-long.jpg", "Site finaxy.com", "assets/cards/"], ["kakemono.jpg", "Supports & signature", "assets/real/"]];
    const res = RES.map(([f, l, dir], i) => {
      const d = document.createElement("div");
      d.className = ID + "-res";
      d.style.top = 210 + i * 162 + "px";
      d.innerHTML = `<div class="${ID}-th" style="background-image:url(${dir}${f})"></div><b>${l}</b><i>● connecté</i><div class="${ID}-glow"></div>`;
      $("ui").appendChild(d);
      tl.fromTo(d, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, CUT + 0.15 + i * 0.08);
      return d;
    });
    tl.fromTo("#d3-agent-rl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUT + 0.1);
    // a request, typed
    const ASK = "Rédige l’annonce de notre nouvelle identité.", ty = { n: 0 };
    tl.fromTo("#d3-agent-u", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, CUT + 0.35);
    tl.fromTo(ty, { n: 0 }, { n: ASK.length, duration: 0.8, ease: "none", immediateRender: false, onUpdate: () => ($("ut").textContent = ASK.slice(0, Math.round(ty.n))) }, CUT + 0.35);
    // the resources light up as it answers, in the Finaxy voice (first line of Finaxy's own announcement)
    res.forEach((d, i) => tl.to(d.querySelector("." + ID + "-glow"), { opacity: 1, duration: 0.2, yoyo: true, repeat: 1 }, CUT + 1.2 + i * 0.15));
    const ANS = "Dix-sept ans après sa création, Finaxy ouvre un nouveau chapitre de son histoire. Ensemble, protégeons ce qui compte.";
    $("b").innerHTML = ANS.split(" ").map((w) => `<span>${w} </span>`).join("");
    tl.fromTo("#d3-agent-b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, CUT + 1.25);
    tl.to("#d3-agent-b span", { opacity: 1, duration: 0.08, stagger: 0.07 }, CUT + 1.35);
    tl.fromTo("#d3-agent-src div", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.08 }, CUT + 1.35 + 18 * 0.07);
    // "pour que chacun puisse écrire comme Finaxy": every team, the same voice
    const WHO = [["Direction", "D", "#6955AA"], ["Commercial", "C", "#3E7C85"], ["Gestion", "G", "#8E3F3E"], ["Ressources humaines", "RH", "#6E6830"], ["Communication", "Co", "#6955AA"], ["Agences", "A", "#3E7C85"]];
    WHO.forEach(([l, ini, c], i) => {
      const d = document.createElement("div");
      d.className = ID + "-who";
      d.style.top = 214 + i * 96 + "px";
      d.innerHTML = `<u style="background:${c}">${ini}</u>${l}`;
      $("ui").appendChild(d);
      tl.fromTo(d, { x: 60, opacity: 0, scale: 0.8 }, { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, ch - 0.05 + i * 0.12);
    });
    tl.fromTo("#d3-agent-wl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, ch - 0.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
