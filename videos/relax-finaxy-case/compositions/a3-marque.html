<script>

    const $ = (s) => document.getElementById(ID + "-" + s);

    const cv = $("cv"), ctx = cv.getContext("2d"), img = $("src"), W = 900, H = 572, R = 46;

    // erosion: seeded bites that open from the edges and from a few cracks
    const bites = Array.from({ length: 260 }, (_, i) => {
      const edge = i % 3 !== 0;
      const x = edge ? (r() < 0.5 ? r() * 120 : W - r() * 120) : 120 + r() * (W - 240);
      const y = edge ? r() * H : (r() < 0.5 ? r() * 140 : H - r() * 140);
      return { x: edge && r() < 0.4 ? r() * W : x, y, rad: 4 + r() * 16, t: r() };
    });
    // a few denser clusters (where the mark crumbles first)
    for (let c = 0; c < 6; c++) { const cx = r() * W, cy = r() * H; for (let k = 0; k < 40; k++) bites.push({ x: cx + (r() - 0.5) * 160, y: cy + (r() - 0.5) * 110, rad: 3 + r() * 12, t: r() * 0.9 }); }
    const st = { decay: 0, glitch: 0, grey: 0, flick: 1 };
    const rr = (x, y, w, h, q) => { ctx.beginPath(); ctx.moveTo(x + q, y); ctx.arcTo(x + w, y, x + w, y + h, q); ctx.arcTo(x + w, y + h, x, y + h, q); ctx.arcTo(x, y + h, x, y, q); ctx.arcTo(x, y, x + w, y, q); ctx.closePath(); };
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      if (!img.complete || !img.naturalWidth) return;
      ctx.save();
      ctx.globalAlpha = st.flick;
      rr(0, 0, W, H, R);
      ctx.clip();
      // the mark slips in horizontal strips (it no longer holds together)
      const STR = 9;
      for (let k = 0; k < STR; k++) {
        const off = Math.sin(k * 2.1 + 0.7) * 90 * st.glitch + (k % 2 ? 1 : -1) * 16 * st.glitch;
        const sy = (k * 330) / STR, sh = 330 / STR + 1;
        ctx.drawImage(img, 0, sy, 520, sh, off, (k * H) / STR, W, H / STR + 1);
      }
      // colour drains away
      ctx.globalCompositeOperation = "saturation";
      ctx.fillStyle = `rgba(128,128,128,${st.grey})`;
      ctx.fillRect(0, 0, W, H);
      // and it erodes
      ctx.globalCompositeOperation = "destination-out";
      for (const b of bites) {
        const k = Math.max(0, Math.min(1, (st.decay - b.t * 0.85) / 0.15));
        if (k <= 0) continue;
        const q = b.rad * k * 2;
        ctx.fillRect(Math.round((b.x - q / 2) / 4) * 4, Math.round((b.y - q / 2) / 4) * 4, Math.ceil(q / 4) * 4, Math.ceil(q / 4) * 4);
      }
      ctx.restore();
    };
    img.addEventListener("load", draw);
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: draw }, 0);
    const a = VO["1.2"], b = VO["1.3"], c = VO["1.4"];
    // "une marque qui avait du mal à exister": it flickers, weak
    tl.fromTo("#a3-marque-cv", { opacity: 0, scale: 0.92, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo("#a3-marque-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
    tl.fromTo(st, { flick: 1 }, { flick: 0.35, duration: 0.09, repeat: 9, yoyo: true, ease: "steps(1)", onUpdate: draw }, a + 0.5);
    tl.to("#a3-marque-cv", { scale: 0.9, duration: b - 0.7, ease: "sine.inOut" }, 0.7);
    // "et qui surtout ne reflétait plus…": it deteriorates
    tl.fromTo(st, { decay: 0, grey: 0, glitch: 0 }, { decay: 0.62, grey: 0.85, glitch: 0.45, duration: c - b - 0.2, ease: "power1.in", onUpdate: draw, immediateRender: false }, b);
    tl.to(st, { glitch: 0.12, duration: 0.5, ease: "power2.out", onUpdate: draw }, c - 0.2);
    tl.to(["#a3-marque-cv", "#a3-marque-tag"], { y: -60, duration: 0.6, ease: "expo.inOut" }, c - 0.35);
    // "Pas juste un problème de logo :" typed under the old mark, "logo" struck through
    const A = "Pas juste un problème de ", L = "logo", Z = " :", ty = { n: 0 };
    const type = () => {
      const n = Math.round(ty.n);
      $("typed").textContent = A.slice(0, n);
      $("lw").textContent = L.slice(0, Math.max(0, n - A.length));
      $("tail").textContent = Z.slice(0, Math.max(0, n - A.length - L.length));
    };
    type();
    tl.fromTo(ty, { n: 0 }, { n: A.length + L.length + Z.length, duration: 1.1, ease: "none", onUpdate: type, immediateRender: false }, c - 0.05);

    window.__timelines = window.__timelines || {};
