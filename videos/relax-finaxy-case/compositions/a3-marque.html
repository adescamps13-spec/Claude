<style>

<script>
  (function () {
    const ID = "a3-marque", D = 8.23, VO = {"1.0": -4.5, "1.1": -1.64, "1.2": 0.15, "1.3": 2.77, "1.4": 6.49, "1.5": 8.38, "2.0": 11.13, "2.1": 13.38, "2.2": 16.27, "2.3": 18.28, "2.4": 20.47, "2.5": 22.07, "2.6": 23.15, "2.7": 25.07, "2.8": 25.55, "2.9": 28.03, "2.10": 32.51, "2.11": 34.57, "2.12": 37.23, "3.0": 40.41, "3.1": 41.4, "3.2": 43.15, "3.3": 44.29, "3.4": 45.24, "3.5": 46.21, "3.6": 47.57, "3.7": 48.29, "3.8": 50.12, "3.9": 51.25, "3.10": 54.69, "3.11": 55.8, "3.12": 57.6, "4.0": 60.55, "4.1": 62.73, "4.2": 64.23, "4.3": 65.04, "4.4": 66.0, "4.5": 67.25, "4.6": 68.39, "4.7": 71.06, "4.8": 72.58, "4.9": 74.06, "5.0": 78.37, "5.1": 79.92, "5.2": 82.69, "5.3": 83.49, "5.4": 86.44, "5.5": 87.65, "5.6": 90.99, "5.7": 94.16, "5.8": 95.2, "5.9": 96.53, "5.10": 97.47, "5.11": 98.44, "5.12": 99.96, "5.13": 100.73, "breath": 102.51, "exhale": 104.26};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["1.2"], b = VO["1.3"], c = VO["1.4"];
    // the old mark rebuilt as a halftone dot matrix, so it can fade out and come apart dot by dot
    const cv = $("cv"), g = cv.getContext("2d"), img = $("src"), r = KIT.rng(23);
    const CW = 780, CH = 495, X0 = 570, Y0 = 170, STEP = 9;
    let dots = null;
    const build = () => {
      if (dots || !img.complete || !img.naturalWidth) return;
      const off = document.createElement("canvas");
      off.width = 520; off.height = 330;
      const o = off.getContext("2d");
      o.drawImage(img, 0, 0, 520, 330);
      const px = o.getImageData(0, 0, 520, 330).data;
      dots = [];
      for (let y = 0; y < CH; y += STEP) for (let x = 0; x < CW; x += STEP) {
        const sx = Math.floor((x / CW) * 520), sy = Math.floor((y / CH) * 330), i = (sy * 520 + sx) * 4;
        const lum = (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11) / 255;
        const ink = px[i + 3] < 128 ? 0 : 1 - lum; // transparent corners are not ink
        dots.push({ x: X0 + x, y: Y0 + y, ink, col: `rgb(${px[i]},${px[i + 1]},${px[i + 2]})`, rnd: r(), ang: r() * Math.PI * 2, sp: 60 + r() * 260 });
      }
    };
    const st = { card: 0, half: 0, pres: 1, decay: 0 };
    const draw = () => {
      build();
      g.clearRect(0, 0, 1920, 1080);
      if (!dots) return;
      const k = st.card;
      if (k <= 0) return;
      // white card (fades with presence)
      g.save();
      g.globalAlpha = k * (0.25 + 0.75 * st.pres) * (1 - st.decay * 0.6);
      g.fillStyle = "#FFFFFF";
      g.shadowColor = "rgba(42,34,68,.16)"; g.shadowBlur = 50; g.shadowOffsetY = 26;
      const w = CW * (0.9 + 0.1 * st.pres), h = CH * (0.9 + 0.1 * st.pres), cx = X0 + CW / 2, cy = Y0 + CH / 2;
      g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, 46); g.fill();
      g.restore();
      // the logo itself: crisp image → halftone dots → dots drifting away
      if (st.half < 1) {
        g.globalAlpha = k * (1 - st.half) * (0.25 + 0.75 * st.pres);
        g.drawImage(img, X0, Y0, CW, CH);
      }
      if (st.half > 0) {
        for (const d of dots) {
          if (d.ink < 0.08) continue;
          const gone = Math.max(0, Math.min(1, (st.decay - d.rnd * 0.8) / 0.25));
          const rad = (STEP * 0.62) * Math.sqrt(d.ink) * (1 - gone) * (0.55 + 0.45 * st.pres);
          if (rad < 0.3) continue;
          const dx = Math.cos(d.ang) * d.sp * gone, dy = Math.sin(d.ang) * d.sp * gone - 40 * gone;
          g.globalAlpha = k * st.half * (1 - gone) * (0.35 + 0.65 * st.pres);
          g.fillStyle = gone > 0 ? "#A99CF0" : d.col;
          g.beginPath(); g.arc(d.x + dx, d.y + dy, rad, 0, Math.PI * 2); g.fill();
        }
      }
      g.globalAlpha = 1;
    };
    img.addEventListener("load", draw);
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: draw }, 0);
    const prox = (vars, at, dur, ease) => tl.to(st, { ...vars, duration: dur, ease: ease || "power2.inOut", onUpdate: draw }, at);
    tl.set(st, { card: 0, half: 0, pres: 1, decay: 0 }, 0);
    prox({ card: 1 }, 0, 0.5, "expo.out");
    // glass sliders: the cursor drags presence and coherence down
    const slider = (n, from, to, at, dur) => {
      const o = { v: from };
      const up = () => { $("f" + n).style.width = o.v + "%"; $("k" + n).style.left = o.v + "%"; $("v" + n).textContent = Math.round(o.v); };
      up();
      tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: "power2.inOut", onUpdate: up, immediateRender: false }, at);
    };
    tl.fromTo(["#a3-marque-c1", "#a3-marque-c2"], { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.08 }, a - 0.05);
    tl.fromTo("#a3-marque-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 0.2);
    // "une marque qui avait du mal à exister"
    const TRK = 800 - 250 - 150, K1 = 560 + 250, K2 = K1;
    tl.fromTo("#a3-marque-cur", { x: 1500, y: 1050 }, { x: K1 + TRK - 6, y: 728, duration: 0.6, ease: "power3.inOut" }, a + 0.2);
    tl.to("#a3-marque-cur", { x: K1 + TRK * 0.18 - 6, duration: 1.5, ease: "power2.inOut" }, a + 0.85);
    slider(1, 100, 18, a + 0.85, 1.5);
    prox({ pres: 0.18 }, a + 0.85, 1.5);
    // "et qui surtout ne reflétait plus ce que l'entreprise était devenue": it breaks into dots and comes apart
    prox({ half: 1 }, b - 0.2, 0.5);
    tl.to("#a3-marque-cur", { x: K2 + TRK - 6, y: 848, duration: 0.5, ease: "power3.inOut" }, b);
    tl.to("#a3-marque-cur", { x: K2 + TRK * 0.12 - 6, duration: 2.2, ease: "power2.inOut" }, b + 0.6);
    slider(2, 100, 12, b + 0.6, 2.2);
    prox({ decay: 0.55 }, b + 0.6, 2.4, "power1.in");
    // the controls step aside; "Pas juste un problème de logo :" is typed under the old mark
    tl.to(["#a3-marque-c1", "#a3-marque-c2", "#a3-marque-cur"], { y: 60, opacity: 0, duration: 0.45, ease: "power2.in" }, c - 0.45);
    const A = "Pas juste un problème de ", L = "logo", Z = " :", ty = { n: 0 };
    const type = () => {
      const n = Math.round(ty.n);
      $("typed").textContent = A.slice(0, n);
      $("lw").textContent = L.slice(0, Math.max(0, n - A.length));
      $("tail").textContent = Z.slice(0, Math.max(0, n - A.length - L.length));
    };
    type();
    tl.fromTo(ty, { n: 0 }, { n: A.length + L.length + Z.length, duration: 1.1, ease: "none", onUpdate: type, immediateRender: false }, c - 0.05);
    tl.fromTo("#a3-marque-caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, c - 0.1);
    tl.fromTo("#a3-marque-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, c + 1.25);
    tl.to("#a3-marque-caret", { opacity: 0, duration: 0.2, repeat: 3, yoyo: true, ease: "steps(1)" }, c + 1.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
