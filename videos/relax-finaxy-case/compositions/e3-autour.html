<script>

    const ID = "e3-autour", D = 3.17, VO = {"1.0": -95.34, "1.1": -92.48, "1.2": -90.69, "1.3": -88.07, "1.4": -84.35, "1.5": -82.46, "2.0": -79.71, "2.1": -77.46, "2.2": -74.57, "2.3": -72.56, "2.4": -70.37, "2.5": -68.77, "2.6": -67.69, "2.7": -65.77, "2.8": -65.29, "2.9": -62.81, "2.10": -58.33, "2.11": -56.27, "2.12": -53.61, "3.0": -50.43, "3.1": -49.44, "3.2": -47.69, "3.3": -46.55, "3.4": -45.6, "3.5": -44.63, "3.6": -43.27, "3.7": -42.55, "3.8": -40.72, "3.9": -39.59, "3.10": -36.15, "3.11": -35.04, "3.12": -33.24, "4.0": -30.29, "4.1": -28.11, "4.2": -26.61, "4.3": -25.8, "4.4": -24.84, "4.5": -23.59, "4.6": -22.45, "4.7": -19.78, "4.8": -18.26, "4.9": -16.78, "5.0": -12.47, "5.1": -10.92, "5.2": -8.15, "5.3": -7.35, "5.4": -4.4, "5.5": -3.19, "5.6": 0.15, "5.7": 3.32, "5.8": 4.36, "5.9": 5.69, "5.10": 6.63, "5.11": 7.6, "5.12": 9.12, "5.13": 9.89, "breath": 11.67, "exhale": 13.42};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const c = VO["5.6"];
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production"];
    const pills = TAL.map((s) => {
      const p = document.createElement("div");
      p.className = ID + "-pill";
      p.innerHTML = `<i></i>${s}`;
      p.style.width = 110 + s.length * 19 + "px";
      $("ring").appendChild(p);
      return { el: p, w: 110 + s.length * 19 };
    });
    // the talents orbit in depth, then settle around the project
    const orb = { t: 0 };
    const drawRing = () => {
      const k = orb.t, spin = (1 - Math.pow(1 - k, 3)) * Math.PI * 2, rx = 980 - 380 * k, ry = 470 - 210 * k;
      pills.forEach((p, i) => {
        const th = (i / 6) * Math.PI * 2 - Math.PI / 2 + spin - Math.PI * 2, depth = Math.sin(th);
        const sc = 0.8 + 0.2 * ((depth + 1) / 2) * (1 - k) + 0.2 * k;
        p.el.style.transform = `translate(${(960 + Math.cos(th) * rx - p.w / 2).toFixed(1)}px,${(540 + depth * ry - 42).toFixed(1)}px) scale(${sc.toFixed(3)})`;
        p.el.style.opacity = Math.min(1, k * 4).toFixed(3);
        p.el.style.zIndex = depth < 0 && k < 0.8 ? 0 : 3;
      });
    };
    drawRing();
    tl.fromTo(orb, { t: 0 }, { t: 1, duration: 2.0, ease: "none", onUpdate: drawRing }, c - 0.1);
    tl.fromTo("#e3-autour-proj", { scale: 1 }, { scale: 1.12, duration: 1.2, ease: "power2.out" }, c);
    tl.fromTo("#e3-autour-cap", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, c + 0.3);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
