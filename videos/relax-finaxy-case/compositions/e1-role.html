<script>
  (function () {
    const ID = "e1-role", D = 7.88, VO = {"1.0": -67.85, "1.1": -65.2, "1.2": -63.5, "1.3": -59.55, "1.4": -57.81, "1.5": -55.8, "2.0": -53.28, "2.1": -51.2, "2.2": -48.15, "2.3": -45.3, "2.4": -43.01, "2.5": -40.5, "3.0": -37.06, "3.1": -36.09, "3.2": -34.38, "3.3": -33.7, "3.4": -33.12, "3.5": -32.75, "3.6": -31.52, "3.7": -30.55, "3.8": -29.13, "3.9": -27.97, "3.10": -25.51, "3.11": -24.0, "3.12": -22.64, "3.13": -20.97, "4.0": -18.62, "4.1": -18.09, "4.2": -15.62, "4.3": -14.82, "4.4": -14.09, "4.5": -12.84, "4.6": -11.24, "4.7": -10.36, "4.8": -7.66, "4.9": -5.76, "4.10": -3.75, "5.0": 0.15, "5.1": 1.7, "5.2": 4.32, "5.3": 5.12, "5.4": 8.03, "5.5": 9.02, "5.6": 11.72, "5.7": 15.18, "5.8": 16.2, "5.9": 17.45, "5.10": 18.68, "5.11": 19.98, "5.12": 21.73, "5.13": 22.58, "breath": 24.43, "exhale": 26.18};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.0"], t = VO["5.1"], st = VO["5.2"], j = VO["5.3"], CUT = t - 0.1;
    const vis = { t: 0 };
    const cut = () => { $("purple").style.display = vis.t < CUT ? "block" : "none"; $("grey").style.display = vis.t < CUT ? "none" : "block"; };
    tl.fromTo(vis, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: cut }, 0);
    cut();
    // "Notre rôle là-dedans ?" — giant, the question mark lands last
    const ls = KIT.letters($("q"), "Notre rôle ?");
    ls[ls.length - 1].style.color = "#FF0055";
    tl.fromTo(ls, { y: 400 }, { y: 0, duration: 0.7, ease: "expo.out", stagger: 0.035 }, a - 0.1);
    tl.fromTo("#e1-role-q", { scale: 1 }, { scale: 1.08, duration: CUT, ease: "none" }, 0);
    // the right talents, one per step
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production"];
    const W = TAL.map((s) => 84 + s.length * 22), G = 24, TW = W.reduce((x, y) => x + y, 0) + G * (TAL.length - 1);
    let x0 = (1920 - TW) / 2;
    const pills = TAL.map((s, i) => {
      const p = document.createElement("div");
      p.className = ID + "-pill";
      p.textContent = s;
      p.style.width = W[i] + "px";
      p.style.left = x0 + "px";
      p.dataset.cx = x0 + W[i] / 2;
      x0 += W[i] + G;
      $("row").appendChild(p);
      return p;
    });
    tl.fromTo("#e1-role-lead", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUT + 0.1);
    pills.forEach((p, i) => tl.fromTo(p, { x: 260, opacity: 0, scale: 0.92 }, { x: 0, opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, CUT + 0.15 + i * 0.08));
    // "à chaque étape": the steps light up in turn
    tl.fromTo("#e1-role-cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, st - 0.1);
    pills.forEach((p, i) => {
      tl.to(p, { backgroundColor: "#FF0055", scale: 1.06, duration: 0.14, ease: "power2.out" }, st + i * 0.11);
      tl.to(p, { backgroundColor: "#212C34", scale: 1, duration: 0.25, ease: "power2.in" }, st + i * 0.11 + 0.16);
    });
    // "en les faisant jouer comme une seule équipe": they draw together and become one
    tl.to(["#e1-role-cap", "#e1-role-lead"], { opacity: 0, duration: 0.3 }, j + 0.4);
    pills.forEach((p, i) => tl.to(p, { x: 960 - +p.dataset.cx, scaleX: 0.25, opacity: 0, duration: 0.7, ease: "expo.inOut" }, j + 0.55 + Math.abs(i - 2.5) * 0.04));
    tl.fromTo("#e1-role-one", { scaleX: 0.15, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, j + 1.05);
    tl.fromTo("#e1-role-one span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, j + 1.45);
    tl.fromTo("#e1-role-one i", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, j + 1.35);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
