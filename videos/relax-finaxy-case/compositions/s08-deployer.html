<script>
  (function () {
    const ID = "s08-deployer", D = 12, VO = {"start": 0.3, "plaquettes": 1.9, "kakemonos": 2.6, "cartes": 3.3, "presentations": 4.0, "voeux": 4.6, "linkedin": 5.2, "site": 5.8, "agent": 7.4, "finaxy": 9.6};
    const { C, el, defs, thread } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);

    // the thread visits every support in the order the voice names them
    const P = [[-20, 540], [300, 440], [585, 490], [830, 300], [1170, 337], [830, 630], [1270, 558], [1270, 770], [1700, 540], [1940, 540]];
    const cr = (pts) => { // Catmull-Rom → cubic Bézier, smooth through every point
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        d += ` C ${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6}, ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6}, ${p2[0]} ${p2[1]}`;
      }
      return d;
    };
    const th = thread(svg, ID, cr(P), { w: 5 });
    const seg = (k) => k / (P.length - 1); // approx progress at point k (equal-weight)

    const CUES = [VO.plaquettes, VO.kakemonos, VO.cartes, VO.presentations, VO.voeux, VO.linkedin, VO.site, VO.site + 0.6];
    const SUPS = [["u0", "c0"], ["u1", "c1"], ["u2", "u3", "c2"], ["u4", "u6", "c4"], ["u5", "c5"], ["u7", "c7"], ["site", "c8"]];
    th.draw(tl, 0, seg(1), VO.start, VO.plaquettes - VO.start, "sine.inOut");
    SUPS.forEach((ids, i) => {
      const t = CUES[i];
      ids.forEach((s, j) => tl.fromTo($(s), { opacity: 0, scale: 0.86, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" }, t - 0.15 + j * 0.08));
      th.draw(tl, seg(i + 1), seg(i + 2), t, CUES[i + 1] - t, "sine.inOut");
    });

    // exponential: 1 → 2 → 4 → 8 → 16 → 32 → 48 tiles, the system reproducing itself
    const grid = $("grid"), COLS = [C.navy, C.cream, C.fblue, C.burg, C.slate, C.navy, C.cream];
    const tiles = [];
    for (let i = 0; i < 48; i++) {
      const tdiv = document.createElement("i");
      tdiv.style.left = (i % 4) * 52 + "px";
      tdiv.style.top = Math.floor(i / 4) * 58 + "px";
      tdiv.style.background = COLS[(i * 3) % COLS.length];
      if (COLS[(i * 3) % COLS.length] === C.cream) tdiv.style.outline = "1px solid #E6E1D8";
      grid.appendChild(tdiv);
      tiles.push(tdiv);
    }
    const t0 = VO.site + 0.2, gens = [1, 2, 4, 8, 16, 32, 48];
    const count = $("count");
    gens.forEach((n, g) => {
      const prev = g ? gens[g - 1] : 0, at = t0 + g * 0.28;
      tl.fromTo(tiles.slice(prev, n), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: Math.min(0.02, 0.25 / Math.max(1, n - prev)) }, at);
    });
    const cnt = { v: 0 };
    tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0);
    tl.fromTo(cnt, { v: 0 }, { v: gens.length - 1, duration: 0.28 * (gens.length - 1), ease: "none", immediateRender: false, onUpdate: () => (count.textContent = "×" + gens[Math.round(cnt.v)]) }, t0);

    // the AI agent writes in Finaxy's voice (a real line from the editorial charter)
    const LINE = "« On réunit les bonnes expertises pour construire une réponse adaptée à votre réalité. »";
    const type = $("type"), typ = { n: 0 };
    tl.fromTo($("agent"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, VO.agent - 0.3);
    tl.fromTo(typ, { n: 0 }, { n: LINE.length, duration: 2.6, ease: "none", onUpdate: () => (type.textContent = LINE.slice(0, Math.round(typ.n))) }, VO.agent + 0.1);
    tl.fromTo($("caret"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "steps(1)", yoyo: true, repeat: Math.max(0, Math.floor((D - VO.agent) / 0.4) - 1) }, VO.agent);
    tl.fromTo($("rail").querySelector(".rail-bar"), { scaleX: 0.8 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.2);

    // seam: a slow pull-back, the whole wall leaves to the left
    const all = ["u0", "u1", "u2", "u3", "u4", "u5", "u6", "u7", "site", "c0", "c1", "c2", "c4", "c5", "c7", "c8", "grid", "count", "agent"].map($);
    tl.to(all, { x: -70, opacity: 0, duration: 0.6, ease: "power2.in", stagger: 0.015 }, D - 0.8);
    th.draw(tl, seg(8), 1, D - 1.2, 1.2, "power2.in");
    window.__timelines[ID] = tl;
  })();
</script>
