      F.place(sc.v);

      bars.forEach((b, i) => (b.style.height = (10 + 110 * Math.abs(Math.sin(t * 5.2 + i * 0.37) * Math.cos(t * 1.7 + i * 0.13))).toFixed(1) + "px"));
