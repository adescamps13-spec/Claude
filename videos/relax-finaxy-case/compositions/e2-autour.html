      <div id="root" data-composition-id="e2-autour" data-width="1920" data-height="1080" data-duration="7.15">
<style>
  #e2-autour-bg{background:#E7E7EC}
  #e2-autour-one{position:absolute;z-index:4;left:560px;top:470px;width:800px;height:110px;border-radius:55px;background:#212C34;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:22px;font-family:Unbounded;font-weight:500;font-size:42px}
  #e2-autour-one .e2-autour-tx{position:relative;width:470px;height:60px}
  #e2-autour-one .e2-autour-tx span{position:absolute;left:0;right:0;top:0;line-height:60px;text-align:center;white-space:nowrap}
  #e2-autour-one i{display:block;width:30px;height:30px;border-radius:15px;background:#FF0055}
  #e2-autour-box{position:absolute;left:1150px;top:380px;width:500px;height:320px;border:4px solid #212C34;border-radius:26px}
  #e2-autour-box .e2-autour-slotc{position:absolute;width:136px;height:116px;border:3px dashed #A7AEB4;border-radius:14px}
  #e2-autour-boxlbl{position:absolute;left:1150px;top:330px;font-weight:600;font-size:20px;letter-spacing:.16em;color:#4F575D}
  #e2-autour-proj{position:absolute;z-index:2;left:230px;top:330px;width:600px;height:420px;border-radius:36px;overflow:hidden;

  #e2-autour-proj span{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:Unbounded;font-weight:500;font-size:52px;color:#212C34}
  #e2-autour-proj em{position:absolute;left:0;right:0;top:250px;text-align:center;font-style:normal;font-weight:600;font-size:18px;letter-spacing:.2em;color:#5D4F96}

  .e2-autour-pill i{display:inline-block;width:14px;height:14px;border-radius:7px;background:#FF0055;margin-right:14px;vertical-align:2px}

<div class="full" id="e2-autour-bg"></div>
<div id="e2-autour-boxlbl">UNE AGENCE</div>
<div id="e2-autour-box"></div>
<div id="e2-autour-ring"></div>
<div id="e2-autour-proj"><span>votre projet</span><em>TEL QU’IL EST</em></div>
<div id="e2-autour-one"><i></i><div class="e2-autour-tx"><span id="e2-autour-o1">une seule équipe</span><span id="e2-autour-o2">chez Relax</span></div></div>
<div id="e2-autour-cap">On construit l’équipe autour de votre projet.</div>
<div class="hud" style="left:70px;color:#62666B">RELAX × FINAXY</div><div class="hud" style="right:70px;color:#62666B">06 — NOTRE RÔLE</div>
<script>
  (function () {
    const ID = "e2-autour", D = 7.15, VO = {"1.0": -75.73, "1.1": -73.08, "1.2": -71.38, "1.3": -67.43, "1.4": -65.69, "1.5": -63.68, "2.0": -61.16, "2.1": -59.08, "2.2": -56.03, "2.3": -53.18, "2.4": -50.89, "2.5": -48.38, "3.0": -44.94, "3.1": -43.97, "3.2": -42.26, "3.3": -41.58, "3.4": -41.0, "3.5": -40.63, "3.6": -39.4, "3.7": -38.43, "3.8": -37.01, "3.9": -35.85, "3.10": -33.39, "3.11": -31.88, "3.12": -30.52, "3.13": -28.85, "4.0": -26.5, "4.1": -25.97, "4.2": -23.5, "4.3": -22.7, "4.4": -21.97, "4.5": -20.72, "4.6": -19.12, "4.7": -18.24, "4.8": -15.54, "4.9": -13.64, "4.10": -11.63, "5.0": -7.73, "5.1": -6.18, "5.2": -3.56, "5.3": -2.76, "5.4": 0.15, "5.5": 1.14, "5.6": 3.84, "5.7": 7.3, "5.8": 8.32, "5.9": 9.57, "5.10": 10.8, "5.11": 12.1, "5.12": 13.85, "5.13": 14.7, "breath": 16.55, "exhale": 18.3};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.4"], e = VO["5.5"], c = VO["5.6"];
    // the team pill from the previous shot becomes the speaker: "chez Relax"
    tl.fromTo("#e2-autour-o1", { y: 0, opacity: 1 }, { y: -40, opacity: 0, duration: 0.4, ease: "power2.in" }, a - 0.05);
    tl.fromTo("#e2-autour-o2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, a + 0.2);
    tl.to("#e2-autour-one", { y: -330, scale: 0.7, duration: 0.7, ease: "expo.inOut" }, e - 0.3);
    // a fixed agency box with predefined slots
    for (let i = 0; i < 6; i++) {
      const s = document.createElement("div");
      s.className = ID + "-slotc";
      s.style.left = 24 + (i % 3) * 152 + "px";
      s.style.top = 30 + Math.floor(i / 3) * 132 + "px";
      $("box").appendChild(s);
    }
    tl.fromTo(["#e2-autour-box", "#e2-autour-boxlbl"], { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, e - 0.1);
    tl.fromTo("#e2-autour-proj", { opacity: 0, x: -200, rotationY: 20 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.7, ease: "expo.out" }, e);
    // "on ne fait pas entrer un projet dans une agence": squeezed to fit, it pops back out
    tl.to("#e2-autour-proj", { x: 870, y: 40, scaleX: 0.52, scaleY: 0.6, duration: 0.7, ease: "power3.in" }, e + 0.72);
    tl.to("#e2-autour-box", { x: 18, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, e + 1.4);
    tl.to("#e2-autour-proj", { x: 260, y: 0, scaleX: 1, scaleY: 1, duration: 0.84, ease: "elastic.out(1,0.5)" }, e + 1.45);
    tl.to(["#e2-autour-box", "#e2-autour-boxlbl"], { opacity: 0, scale: 0.85, duration: 0.5, ease: "power2.in" }, c - 0.7);
    // "on construit l'équipe autour de votre projet": the project in the centre, the talents orbit and dock
    tl.to("#e2-autour-proj", { x: 430, y: -20, scale: 0.78, duration: 0.8, ease: "expo.inOut" }, c - 0.4);
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production"];
    const pills = TAL.map((s) => {
      const p = document.createElement("div");
      p.className = ID + "-pill";
      p.innerHTML = `<i></i>${s}`;
      p.style.width = 110 + s.length * 19 + "px";
      $("ring").appendChild(p);
      return { el: p, w: 110 + s.length * 19 };
    });
    const orb = { t: 0 };
    const drawRing = () => {
      const k = orb.t, spin = (1 - Math.pow(1 - k, 3)) * Math.PI * 2.2, rx = 900 - 330 * k, ry = 470 - 210 * k;
      pills.forEach((p, i) => {
        const th = (i / 6) * Math.PI * 2 - Math.PI / 2 + spin - Math.PI * 2.2, depth = Math.sin(th);
        const sc = 0.82 + 0.18 * (depth + 1) / 2 * (1 - k) + 0.18 * k;
        p.el.style.transform = `translate(${(960 + Math.cos(th) * rx - p.w / 2).toFixed(1)}px,${(545 + depth * ry - 42).toFixed(1)}px) scale(${sc.toFixed(3)})`;
        p.el.style.opacity = Math.min(1, k * 4).toFixed(3);
        p.el.style.zIndex = depth < 0 && k < 0.8 ? 0 : 3;
      });
    };
    drawRing();
    tl.fromTo(orb, { t: 0 }, { t: 1, duration: 2.2, ease: "none", onUpdate: drawRing }, c - 0.2);
    tl.fromTo("#e2-autour-cap", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, c + 0.5);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
