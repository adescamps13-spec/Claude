<script>
  (function () {
    const ID = "zz-hud", D = 115.09, SC = [["a1-rang", 0.0, 3.44], ["a2-croissance", 3.44, 1.79], ["a3-marque", 5.23, 8.23], ["a4-coherence", 13.46, 2.75], ["b1-ecouter", 16.21, 5.14], ["b2-deux-mondes", 21.35, 8.8], ["b3-reseau", 30.15, 7.44], ["b4-multiple", 37.59, 4.72], ["b5-isolee", 42.31, 3.18], ["c1-structure", 45.49, 7.16], ["c2-corps", 52.65, 7.12], ["c3-stature", 59.77, 5.86], ["d0-decliner", 65.63, 3.68], ["d1-supports", 69.31, 4.16], ["d2-site", 73.47, 2.67], ["d3-agent", 76.14, 7.31], ["e1-role", 83.45, 8.07], ["e2-organigramme", 91.52, 4.55], ["e3-autour", 96.07, 3.17], ["e4-cotes", 99.24, 5.8], ["e5-promesse", 105.04, 2.4], ["f-relax", 107.44, 7.65]];
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const CH = (id) => id.startsWith("a") ? "01 — LE CONSTAT" : id === "b1-ecouter" ? "02 — ÉCOUTER" : id.startsWith("b") ? "02 — RÉVÉLER"
      : id === "c1-structure" ? "03 — ORGANISER" : id.startsWith("c") ? "04 — EXPRIMER" : id.startsWith("d") ? "05 — DÉPLOYER" : id.startsWith("e") ? "06 — NOTRE RÔLE" : "07 — RELAX";
    $("ticks").innerHTML = SC.map((s) => `<i style="left:${((s[1] / D) * 100).toFixed(2)}%"></i>`).join("");
    const clock = { t: 0 };
    const draw = () => {
      const t = clock.t, f = Math.floor(t * 30);
      const pad = (n) => String(n).padStart(2, "0");
      $("tc").textContent = `00:${pad(Math.floor(t / 60))}:${pad(Math.floor(t) % 60)}:${pad(f % 30)}`;
      $("fill").style.transform = `scaleX(${(t / D).toFixed(4)})`;
      let cur = SC[0][0];
      for (const s of SC) if (t >= s[1]) cur = s[0];
      $("chap").textContent = CH(cur);
      $("rec").style.opacity = Math.floor(t * 1.6) % 2 ? 0.35 : 1;
    };
    tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: draw }, 0);
    draw();
    // the frame lets go on the final breath
    const last = SC[SC.length - 1][1];
    tl.fromTo("#zz-hud-hud", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power2.inOut", immediateRender: false }, last + 0.2);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
