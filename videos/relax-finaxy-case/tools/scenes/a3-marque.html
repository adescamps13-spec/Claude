</style>
<div class="full wash"></div>

  <div class="§big" id="§w1" data-layout-allow-overlap></div>

  <div class="§br" id="§b1" style="border-right:0;border-bottom:0"></div><div class="§br" id="§b2" style="border-left:0;border-bottom:0"></div>
  <div class="§br" id="§b3" style="border-right:0;border-top:0"></div><div class="§br" id="§b4" style="border-left:0;border-top:0"></div>
  <svg id="§ringv" viewBox="0 0 1920 1080"><rect id="§ring" x="644" y="454" width="632" height="172" rx="86" fill="none" stroke="#FF0055" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>

{{HUD:#62666B|01 — LE CONSTAT}}
{{THREE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["1.2"], b = VO["1.3"], c = VO["1.4"];
    const CUT2 = b - 0.25, CUT3 = c - 0.2;
    const vis = { t: 0 };
    const cut = () => { $("p1").style.display = vis.t < CUT2 ? "block" : "none"; $("split").style.display = vis.t >= CUT2 && vis.t < CUT3 ? "block" : "none"; $("p3").style.display = vis.t >= CUT3 ? "block" : "none"; };
    tl.fromTo(vis, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: cut }, 0);
    cut();
    // ── 1. "Mais une marque qui avait du mal à exister" ──
    const w1 = KIT.letters($("w1"), "du mal"), w2 = KIT.letters($("w2"), "à exister");
    tl.fromTo("#§pill", { width: 0, x: 300, opacity: 0 }, { width: 600, x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, a - 0.1);
    tl.fromTo(w1, { y: 300 }, { y: 0, duration: 0.6, ease: "expo.out", stagger: 0.04 }, a + 0.35);
    tl.fromTo(w2, { y: -300 }, { y: 0, duration: 0.6, ease: "expo.out", stagger: 0.04 }, a + 0.75);
    // brackets snap around "exister"
    const BR = [[290, 700], [1574, 700], [290, 905], [1574, 905]];
    ["#§b1", "#§b2", "#§b3", "#§b4"].forEach((s, i) => { tl.set(s, { x: BR[i][0], y: BR[i][1] }, 0); tl.fromTo(s, { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, a + 1.15 + i * 0.03); });
    // it tries to load… and never gets there
    const pv = { v: 0 }, upd = () => ($("pv").textContent = Math.round(pv.v));
    upd();
    tl.fromTo(pv, { v: 0 }, { v: 34, duration: 0.9, ease: "power2.out", onUpdate: upd, immediateRender: false }, a + 0.3);
    tl.to(pv, { v: 12, duration: 0.5, ease: "power2.in", onUpdate: upd }, a + 1.35);
    tl.fromTo("#§ring", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0.66 }, duration: 0.9, ease: "power2.out", immediateRender: false }, a + 0.3);
    tl.to("#§ring", { attr: { "stroke-dashoffset": 0.88 }, duration: 0.5, ease: "power2.in" }, a + 1.35);
    tl.fromTo("#§pct", { opacity: 0 }, { opacity: 1, duration: 0.3 }, a + 0.3);
    tl.to("#§pill", { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, a + 0.9);
    tl.to("#§pill", { scaleX: 1.08, scaleY: 0.82, duration: 0.12, yoyo: true, repeat: 1 }, a + 1.4);
    tl.to("#§pill", { opacity: 0.45, duration: 0.08, yoyo: true, repeat: 3, ease: "steps(1)" }, a + 1.7);
    tl.to([...w1, ...w2], { y: (i) => (i < w1.length ? -320 : 320), duration: 0.35, ease: "expo.in", stagger: 0.015 }, CUT2 - 0.35);
    tl.to("#§pill", { scale: 0.2, opacity: 0, duration: 0.3, ease: "expo.in" }, CUT2 - 0.3);
    // ── 2. "et qui surtout ne reflétait plus ce que l'entreprise était devenue": a mirror that lies ──
    const S = T3.stage($("gl"), { w: 960, h: 1080, fov: 30, camZ: 13 });
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7, 24), T3.glossy(0xb3a3f3, { irid: 0.9, roughness: 0.14 }));
    S.scene.add(body);
    const SAT = [0xff8fb8, 0x8fd3dc, 0xd8cf8a, 0xf4a3d2, 0x9fd3b5, 0xcac3e1].map((c, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.32 + (i % 3) * 0.08, 40, 28), T3.glossy(c, { irid: 0.5 })); S.scene.add(m); return m; });
    const pos = body.geometry.attributes.position, base = pos.array.slice();
    const draw3 = (t) => {
      // a living, wobbling body with satellites in orbit — the group as it really is
      for (let i = 0; i < pos.count; i++) {
        const x = base[i * 3], y = base[i * 3 + 1], z = base[i * 3 + 2];
        const n = 1 + 0.07 * Math.sin(x * 2.1 + t * 2.2) * Math.cos(y * 2.4 + t * 1.7) + 0.04 * Math.sin(z * 3 + t * 2.9);
        pos.array[i * 3] = x * n; pos.array[i * 3 + 1] = y * n; pos.array[i * 3 + 2] = z * n;
      }
      pos.needsUpdate = true;
      body.geometry.computeVertexNormals();
      body.rotation.set(t * 0.3, t * 0.5, 0);
      SAT.forEach((m, i) => { const an = t * (0.9 + i * 0.12) + i * 1.05, rr = 2.7 + (i % 2) * 0.5; m.position.set(Math.cos(an) * rr, Math.sin(an * 0.8 + i) * 1.3, Math.sin(an) * rr); });
      S.render();
    };
    const p3 = { t: 0 };
    tl.fromTo(p3, { t: 0 }, { t: 3, duration: CUT3 - CUT2, ease: "none", onUpdate: () => draw3(p3.t), immediateRender: false }, CUT2);
    tl.fromTo("#§gl", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, CUT2);
    tl.fromTo("#§rightp", { x: 960 }, { x: 0, duration: 0.6, ease: "expo.out" }, CUT2);
    tl.fromTo("#§glass", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, CUT2 + 0.15);
    tl.fromTo("#§mirror", { opacity: 0, scale: 0.6 }, { opacity: 0.75, scale: 1, duration: 0.6, ease: "expo.out" }, CUT2 + 0.35);
    tl.fromTo("#§l1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, CUT2 + 0.3);
    tl.fromTo("#§l2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, CUT2 + 0.6);
    tl.fromTo("#§neq", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, CUT2 + 1.3);
    tl.fromTo("#§refl", { opacity: 0, scaleX: 1.4 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "expo.out" }, CUT2 + 1.6);
    tl.to("#§mirror", { x: 6, duration: 0.06, yoyo: true, repeat: 7, ease: "none" }, CUT2 + 2.0);
    // ── 3. "Pas juste un problème de logo :" under the old mark ──
    tl.fromTo("#§card", { scale: 0.75, opacity: 0, rotationY: 180 }, { scale: 1, opacity: 1, rotationY: 0, duration: 0.6, ease: "expo.out" }, CUT3);
    const A = "Pas juste un problème de ", L = "logo", Z = " :", ty = { n: 0 };
    const type = () => {
      const n = Math.round(ty.n);
      $("typed").textContent = A.slice(0, n);
      $("lw").textContent = L.slice(0, Math.max(0, n - A.length));
      $("tail").textContent = Z.slice(0, Math.max(0, n - A.length - L.length));
    };
    type();
    tl.fromTo(ty, { n: 0 }, { n: A.length + L.length + Z.length, duration: 1.0, ease: "none", onUpdate: type, immediateRender: false }, c - 0.05);
    tl.fromTo("#§caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, c - 0.1);
    tl.fromTo("#§strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, c + 1.2);
    tl.to("#§caret", { opacity: 0, duration: 0.2, repeat: 3, yoyo: true, ease: "steps(1)" }, c + 1.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
