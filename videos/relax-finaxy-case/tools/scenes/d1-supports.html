<style>
  #§title{position:absolute;left:480px;top:140px;width:960px;height:110px}
  #§title .§br{position:absolute;top:0;font-weight:300;font-size:104px;line-height:104px;color:#898991}
  #§slot{position:absolute;left:70px;right:70px;top:6px;height:100px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)}
  #§words{position:absolute;left:0;top:0;white-space:nowrap;font-family:Unbounded;font-weight:500;font-size:60px;line-height:100px;letter-spacing:-.02em;color:#212C34}
  #§stage{position:absolute;left:0;top:320px;width:1920px;height:480px;perspective:1500px;perspective-origin:960px 240px}
  #§film{position:absolute;inset:0;transform-style:preserve-3d}
  #§mirror{position:absolute;left:0;top:812px;width:1920px;height:200px;filter:blur(18px);opacity:.3}
</style>
<div class="full studio"></div>
<div id="§title"><span class="§br" style="left:0">{</span><span class="§br" style="right:0">}</span><div id="§slot"><div id="§words"></div></div></div>
<div id="§mirror"></div>
<div id="§stage"><div id="§film"></div></div>
{{HUD:#62666B|05 — DÉPLOYER}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const NAMES = ["voeux", "enseigne", "affiches", "kakemono", "cartes", "reseaux"]; // real deliverables only (assets/real)
    const F = KIT.film({ el: $("film"), mirror: $("mirror"), imgs: NAMES.map((n) => `assets/cards/${n}.png`) });
    const W = 820;
    KIT.slot($("words"), ["exprimer", "cartes de vœux", "signalétique", "affiches", "kakemonos", "cartes de visite", "réseaux sociaux", ""], W);
    const S = F.STEP, scroll = { v: -1.4 * S };
    // the title word rides with the film: card k centred = word k+1 in the slot
    const draw = () => { F.place(scroll.v); $("words").style.transform = `translateX(${(-(scroll.v / S + 1) * W).toFixed(1)}px)`; };
    draw();
    const at = (k) => k * S;
    const glide = (from, to, t, dur, ease) => tl.fromTo(scroll, { v: from }, { v: to, duration: dur, ease, onUpdate: draw, immediateRender: false }, t);
    tl.fromTo(scroll, { v: -1.4 * S }, { v: -S, duration: 0.7, ease: "expo.out", onUpdate: draw }, 0);
    // "les supports pour exprimer tout ça": a long fast run — the deliverables keep coming
    glide(-S, at(1), VO["4.1"] - 0.1, 1.9, "expo.inOut");
    glide(at(1), at(2), VO["4.2"] - 0.32, 0.62, "expo.inOut");
    glide(at(2), at(3), VO["4.3"] - 0.32, 0.62, "expo.inOut");
    glide(at(3), at(4), VO["4.4"] - 0.32, 0.62, "expo.inOut");
    glide(at(4), at(5), VO["4.5"] - 0.32, 0.62, "expo.inOut");
    glide(at(5), at(6.4), D - 0.5, 0.5, "expo.in");
    tl.fromTo("#§title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
    tl.to("#§title", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
