<style>
  #§title{position:absolute;left:0;right:0;top:130px;text-align:center;font-family:Unbounded;font-weight:500;font-size:52px;letter-spacing:-.01em;color:#212C34}
  #§title em{font-style:normal;color:#6955AA}
  #§stage{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1700px;perspective-origin:960px 520px}
  #§tiles{position:absolute;inset:0;transform-style:preserve-3d}
  .§t{position:absolute;left:0;top:0;width:400px;height:57px;border-radius:10px}
  #§real{position:absolute;left:320px;top:260px;width:1280px;height:545px;background:url(assets/captures/finaxy-site-cartes.jpg) 0 0/1280px 545px;border-radius:6px}
  #§focus{position:absolute;left:0;top:0;border:4px solid #FF0055;border-radius:14px;box-shadow:0 0 0 3000px rgba(255,255,255,.62)}
  #§tabs{position:absolute;left:330px;top:870px;width:1260px;height:84px;border-radius:42px;background:#FFFFFF;box-shadow:0 18px 40px rgba(33,44,52,.12)}
  #§hi{position:absolute;top:8px;left:8px;height:68px;border-radius:34px;background:linear-gradient(90deg,#1F1F1F,#5D5D5D)}
  .§tab{position:absolute;top:0;height:84px;line-height:84px;text-align:center;font-weight:500;font-size:30px;color:#4F575D;white-space:nowrap}
</style>
<div class="full wash"></div>
<div id="§title">De cette promesse, <em>tout se structure.</em></div>
<div id="§real"></div>
<div id="§stage"><div id="§tiles"></div></div>
<div id="§focus"></div>
<div id="§tabs"><div id="§hi"></div></div>
{{HUD:#62666B|03 — ORGANISER}}
<div class="cursor" id="§cur"></div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const r = KIT.rng(5);
    const COLS = ["#CAC3E1", "#C3DDE1", "#E0DEC3", "#E1C3C3", "#A99CF0", "#8FD3DC", "#F4A3D2", "#D4CCEE"];
    const COLX = [340, 760, 1180], TARGET = ["#191853", "#5A80D9", "#4A5892"], ROWS = 8, RH = 505 / ROWS;
    const tiles = [];
    for (let c = 0; c < 3; c++)
      for (let j = 0; j < ROWS; j++) {
        const t = document.createElement("div");
        t.className = ID + "-t";
        t.style.background = COLS[Math.floor(r() * COLS.length)];
        $("tiles").appendChild(t);
        tiles.push({ el: t, c, j, x0: 120 + r() * 1400, y0: 230 + r() * 560, z0: -500 + r() * 700, rx: -60 + r() * 120, rz: -50 + r() * 100 });
      }
    const a = VO["3.0"], b = VO["3.1"];
    // the scattered group, in 3D, drifting
    tiles.forEach((o, i) => {
      tl.fromTo(o.el, { x: o.x0 + 400, y: o.y0, z: o.z0, rotationX: o.rx, rotationZ: o.rz, scaleX: 0.34, scaleY: 1.9, opacity: 0 },
        { x: o.x0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.02 * (i % 9));
      // "nous avons tout décliné": every piece finds its place in three readable families
      tl.to(o.el, { x: COLX[o.c], y: 280 + o.j * RH, z: 0, rotationX: 0, rotationZ: 0, scaleX: 1, scaleY: 1, height: RH - 6, duration: 1.0, ease: "expo.inOut" }, b - 0.25 + 0.025 * i);
      tl.to(o.el, { backgroundColor: TARGET[o.c], height: RH + 2, borderRadius: 0, duration: 0.45, ease: "power2.inOut" }, b + 1.05 + o.c * 0.06);
    });
    tl.fromTo("#§title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, a - 0.1);
    // …and the families are the real ones, as they live on the new site
    tl.fromTo("#§real", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, b + 1.5);
    tl.to("#§tiles", { opacity: 0, duration: 0.25, ease: "none" }, b + 1.75);
    // the four decisions, as a tab bar; a focus frame walks the page with them
    const TABS = ["architecture", "catégories", "naming", "place des marques"], TW = [290, 260, 220, 474];
    let x = 8;
    const tx = TABS.map((s, i) => {
      const d = document.createElement("div");
      d.className = ID + "-tab";
      d.textContent = s;
      d.style.left = x + "px";
      d.style.width = TW[i] + "px";
      d.dataset.i = i;
      $("tabs").appendChild(d);
      const at = x;
      x += TW[i];
      return at;
    });
    const tabEls = [...$("tabs").querySelectorAll("." + ID + "-tab")];
    const AREAS = [[326, 266, 1268, 533], [330, 326, 1260, 92], [778, 326, 230, 92], [1200, 550, 320, 152]];
    const cues = [VO["3.2"], VO["3.3"], VO["3.4"], VO["3.5"]];
    tl.fromTo("#§tabs", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, cues[0] - 0.55);
    tl.set("#§focus", { x: AREAS[0][0], y: AREAS[0][1], width: AREAS[0][2], height: AREAS[0][3], opacity: 0 }, 0);
    tl.fromTo("#§focus", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, cues[0] - 0.1);
    tl.set("#§hi", { x: tx[0], width: TW[0] }, 0);
    tl.fromTo("#§hi", { opacity: 0 }, { opacity: 1, duration: 0.2 }, cues[0] - 0.1);
    tabEls.forEach((t, i) => tl.to(t, { color: "#FFFFFF", duration: 0.2 }, cues[i] - 0.05));
    tabEls.forEach((t, i) => i < 3 && tl.to(t, { color: "#4F575D", duration: 0.2 }, cues[i + 1] - 0.05));
    for (let i = 1; i < 4; i++) {
      const [l, tp, w, h] = AREAS[i];
      tl.to("#§hi", { x: tx[i], width: TW[i], duration: 0.4, ease: "expo.inOut" }, cues[i] - 0.12);
      tl.to("#§focus", { x: l, y: tp, width: w, height: h, duration: 0.45, ease: "expo.inOut" }, cues[i] - 0.12);
    }
    // the Relax cursor clicks each decision in the tab bar
    tl.fromTo("#§cur", { x: 1500, y: 1060 }, { x: 330 + tx[0] + TW[0] / 2, y: 912, duration: 0.6, ease: "power3.out" }, cues[0] - 0.6);
    for (let i = 0; i < 4; i++) {
      if (i) tl.to("#§cur", { x: 330 + tx[i] + TW[i] / 2, duration: 0.4, ease: "expo.inOut" }, cues[i] - 0.14);
      tl.to("#§cur", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, cues[i] - 0.05);
    }
    tl.to(["#§title", "#§tabs"], { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    tl.to("#§focus", { opacity: 0, duration: 0.3 }, D - 0.35);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
