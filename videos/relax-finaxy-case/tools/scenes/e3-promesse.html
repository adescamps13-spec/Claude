<style>
  #§seam{background:#16131F}
  #§left{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#6955AA}
  #§right{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#FFFFFF}
  .§lbl{position:absolute;top:150px;height:64px;padding:0 30px;border-radius:32px;font-weight:600;font-size:26px;line-height:64px;white-space:nowrap}
  .§h{position:absolute;top:236px;font-family:Unbounded;font-weight:500;font-size:86px;letter-spacing:-.02em;white-space:nowrap}
  .§tile{position:absolute;left:0;top:0;width:236px;height:150px;border-radius:22px;color:#FFFFFF;font-weight:600;font-size:24px;padding:20px 22px}
  #§pill{position:absolute;left:1086px;top:600px;width:720px;height:120px;border-radius:60px;overflow:hidden;background:#212C34;box-shadow:0 30px 60px rgba(33,44,52,.18)}
  #§irid{position:absolute;inset:0;opacity:0;background:linear-gradient(90deg,#8EEBF7,#B9A8F0,#F0A9E2,#8FDDF6,#B9A8F0,#8EEBF7);background-size:300% 100%}
  #§pill span{position:absolute;left:0;right:0;top:0;line-height:120px;text-align:center;font-family:Unbounded;font-weight:500;font-size:40px;color:#FFFFFF}
  #§pill i{position:absolute;left:44px;top:46px;width:28px;height:28px;border-radius:14px;background:#FF0055}
  #§zero{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:Unbounded;font-weight:500;font-size:86px;letter-spacing:-.02em;color:#212C34}
  #§prom{position:absolute;left:0;right:0;top:380px;text-align:center}
  #§prom .§pl{display:block;overflow:hidden;height:92px}
  #§prom .§pl span{display:inline-block;font-family:Unbounded;font-weight:500;font-size:64px;line-height:92px;letter-spacing:-.02em;color:#212C34}
  #§ptag{position:absolute;left:810px;top:270px;width:300px;height:60px;border-radius:30px;background:#FF0055;color:#FFFFFF;font-weight:600;font-size:24px;line-height:60px;text-align:center}
</style>
<div class="full" id="§seam"></div>
<div id="§right">
  <div class="§lbl" id="§rl" style="left:1060px;background:#212C34;color:#FFFFFF">Côté client</div>
  <div class="§h" id="§rh" style="left:1060px;color:#212C34">un seul fil</div>
  <div id="§pill"><div id="§irid"></div><i></i><span>votre projet</span></div>
  <div id="§zero">un seul fil, zéro couture.</div>
  <div id="§ptag">Notre promesse</div>
  <div id="§prom"><span class="§pl"><span id="§p1">Les meilleurs experts pour votre projet,</span></span><span class="§pl"><span id="§p2">coordonnés par un partenaire de confiance.</span></span></div>
</div>
<div id="§left">
  <div class="§lbl" id="§ll" style="left:90px;background:#FFFFFF;color:#6955AA">Côté Relax</div>
  <div class="§h" id="§lh" style="left:90px;color:#FFFFFF">du mouvement</div>
  <div id="§grid"></div>
</div>
{{HUD:#62666B|06 — NOTRE RÔLE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.7"], mv = VO["5.8"], cl = VO["5.9"], fil = VO["5.10"], cou = VO["5.11"], ca = VO["5.12"];
    // Relax side: the work never stops moving — nine tiles reshuffle in a 3x3 grid
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production", "Planning", "Achat d’art", "Contenus"];
    const COLS = ["#212C34", "#FF0055", "#56A0AA", "#ABA256", "#AA5655", "#3D2F7A", "#4B8A93", "#8C7BC8", "#16131F"];
    const tiles = TAL.map((t, i) => {
      const d = document.createElement("div");
      d.className = ID + "-tile";
      d.style.background = COLS[i];
      if (["#FF0055", "#56A0AA", "#ABA256", "#4B8A93", "#8C7BC8", "#AA5655"].includes(COLS[i])) d.style.color = "#16131F";
      d.textContent = t;
      $("grid").appendChild(d);
      return d;
    });
    const SX = (k) => 98 + (k % 3) * 256, SY = (k) => 420 + Math.floor(k / 3) * 172;
    const PERM = [[0, 1, 2, 3, 4, 5, 6, 7, 8], [1, 4, 0, 6, 2, 8, 3, 5, 7], [4, 2, 1, 5, 0, 7, 6, 8, 3], [2, 0, 4, 8, 1, 3, 5, 7, 6], [0, 5, 2, 7, 4, 6, 8, 3, 1], [5, 1, 7, 6, 3, 0, 4, 2, 8]];
    const sh = { t: 0 };
    const drawGrid = () => {
      const s = Math.floor(sh.t), f = sh.t - s, e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
      const A = PERM[s % PERM.length], B = PERM[(s + 1) % PERM.length];
      tiles.forEach((d, i) => {
        const x = SX(A[i]) + (SX(B[i]) - SX(A[i])) * e, y = SY(A[i]) + (SY(B[i]) - SY(A[i])) * e;
        const lift = Math.sin(f * Math.PI) * (A[i] !== B[i] ? 1 : 0);
        d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 - 0.08 * lift).toFixed(3)}) rotate(${(lift * (i % 2 ? 6 : -6)).toFixed(2)}deg)`;
      });
    };
    drawGrid();
    tl.fromTo(sh, { t: 0 }, { t: (D - a) / 0.55, duration: D - a, ease: "none", onUpdate: drawGrid }, a);
    tl.fromTo("#§grid", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, a);
    tl.fromTo("#§ll", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, a - 0.1);
    tl.fromTo("#§lh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, mv - 0.1);
    // the Relax side starts full frame, then the client side opens beside it, a seam between them
    tl.fromTo("#§left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 968px 0px 0px)", duration: 0.8, ease: "expo.inOut" }, cl - 0.35);
    tl.fromTo("#§rl", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, cl);
    tl.fromTo("#§rh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, fil - 0.1);
    tl.fromTo("#§pill", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, fil + 0.1);
    tl.to("#§pill", { scale: 1.03, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, fil + 0.7);
    // "zéro couture": the seam closes — all that movement now lives inside one seamless surface
    tl.to("#§left", { xPercent: -100, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.to(["#§rl", "#§rh"], { opacity: 0, duration: 0.3 }, cou - 0.3);
    tl.to("#§pill", { x: 960 - 1446, y: -40, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.fromTo("#§irid", { opacity: 0 }, { opacity: 1, duration: 0.6 }, cou);
    tl.fromTo("#§irid", { backgroundPosition: "0% 0%" }, { backgroundPosition: "100% 0%", duration: D - cou, ease: "none", immediateRender: false }, cou);
    tl.to("#§pill span", { color: "#212C34", duration: 0.4 }, cou + 0.1);
    tl.fromTo("#§zero", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cou + 0.1);
    // "C'est ça, notre promesse."
    tl.to("#§zero", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, ca - 0.3);
    tl.to("#§pill", { y: 140, scale: 0.6, duration: 0.6, ease: "expo.inOut" }, ca - 0.3);
    tl.fromTo("#§ptag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, ca - 0.05);
    tl.fromTo(["#§p1", "#§p2"], { y: 100 }, { y: 0, duration: 0.8, ease: "expo.out", stagger: 0.16 }, ca + 0.1);
    tl.to("#§pill", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.45);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
