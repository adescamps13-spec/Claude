<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const tl = gsap.timeline({ paused: true });
    const a = VO["4.6"], s = VO["4.7"];
    tl.fromTo("#§word", { x: 700 }, { x: -260, duration: D, ease: "power1.out" }, 0);
    // the new site lands flat out of the floor, then scrolls
    tl.fromTo("#§win", { y: 620, rotationX: 62, rotationZ: -7, scale: 0.78 }, { y: 0, rotationX: 0, rotationZ: 0, scale: 1, duration: 1.25, ease: "expo.out" }, a - 0.2);
    tl.fromTo("#§sheen", { backgroundPosition: "140% 0%" }, { backgroundPosition: "-60% 0%", duration: 1.1, ease: "power2.inOut" }, s - 0.1);
    tl.fromTo("#§page", { y: 0 }, { y: -1560, duration: D - s - 0.1, ease: "power2.inOut" }, s + 0.1);
    tl.to("#§win", { scale: 1.04, duration: D - s - 0.25, ease: "none" }, s + 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
