<style>
  #§cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .§t{position:absolute;left:0;top:0;width:360px;height:206px;border-radius:14px;box-shadow:0 18px 40px rgba(42,34,68,.16);background:#FFFFFF}
  .§t .§im{position:absolute;inset:0;border-radius:14px;background-size:cover;background-position:center}
  .§lb{position:absolute;left:0;top:-30px;font-weight:500;font-size:17px;color:#6B7278;white-space:nowrap}
  #§sel{position:absolute;left:0;top:0;border:2px solid #6955AA;background:rgba(105,85,170,.08);border-radius:6px;opacity:0}
  #§title{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:Unbounded;font-weight:500;font-size:52px;color:#212C34}
  #§title em{font-style:normal;color:#6955AA}
</style>
<div class="full wash"></div>
<div id="§title">On a tout <em>décliné</em>.</div>
<div id="§cam"><div id="§grid"></div><div id="§sel"></div></div>
<div class="cursor" id="§cur"></div>
{{HUD:#62666B|05 — DÉPLOYER}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    // one identity becomes every real deliverable (artboards, like in a design file)
    const T = [["voeux", "Carte de vœux"], ["affiches", "Affiches"], ["enseigne", "Signalétique"], ["plaquette", "Plaquette"],
      ["kakemono", "Kakémono"], ["cartes", "Cartes de visite"], ["reseaux", "Page LinkedIn"], ["intel", "Plateforme de marque"]];
    const pos = (i) => ({ x: 960 + ((i % 4) - 1.5) * 400 - 180, y: 560 + (Math.floor(i / 4) - 0.5) * 270 - 103 });
    const tiles = T.map(([n, l], i) => {
      const d = document.createElement("div");
      d.className = ID + "-t";
      d.innerHTML = `<div class="${ID}-im" style="background-image:url(assets/cards/${n}.png)"></div><div class="${ID}-lb">${l}</div>`;
      $("grid").appendChild(d);
      return d;
    });
    const a = VO["4.0"], b = VO["4.1"];
    const C = { x: 960 - 180, y: 540 - 103 };
    tiles.forEach((d, i) => {
      const P = pos(i), parent = i === 0 ? 0 : i < 2 ? 0 : i < 4 ? i - 2 : i - 4;
      gsap.set(d, { x: C.x, y: C.y });
      tl.fromTo(d, { x: C.x, y: C.y, scale: 0.4, opacity: 0, rotation: (i % 2 ? 6 : -6) },
        { x: P.x, y: P.y, scale: 1, opacity: 1, rotation: 0, duration: 0.75, ease: "expo.out" }, a - 0.1 + i * 0.07); // straight to the real supports
      tl.fromTo(d.querySelector("." + ID + "-lb"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3 }, a + 0.6 + i * 0.04);
    });
    tl.fromTo("#§title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, a);
    // the cursor marquee-selects the whole set
    tl.set("#§sel", { x: 140, y: 290 }, 0);
    tl.fromTo("#§cur", { x: 1700, y: 1000 }, { x: 140, y: 290, duration: 0.5, ease: "power3.inOut" }, a + 1.1);
    tl.fromTo("#§sel", { width: 0, height: 0, opacity: 1 }, { width: 1640, height: 600, opacity: 1, duration: 0.5, ease: "power2.inOut", immediateRender: false }, a + 1.6);
    tl.to("#§cur", { x: 1780, y: 890, duration: 0.5, ease: "power2.inOut" }, a + 1.6);
    tl.to("#§sel", { opacity: 0, duration: 0.2 }, b - 0.05);
    tl.to("#§cur", { opacity: 0, duration: 0.2 }, b);
    // dive into the brochure: the next shot shows it full size
    const P3 = pos(3);
    tl.to("#§cam", { scale: 2.6, x: 960 - 2.6 * (P3.x + 180), y: 540 - 2.6 * (P3.y + 103), transformOrigin: "0px 0px", duration: D - b, ease: "expo.in" }, b);
    tl.to("#§title", { opacity: 0, duration: 0.3 }, b);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
