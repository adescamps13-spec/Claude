<style>
  #§glow{position:absolute;inset:-10%;background:
    radial-gradient(34% 38% at 30% 55%,rgba(142,235,247,.45) 0%,rgba(255,255,255,0) 100%),
    radial-gradient(34% 38% at 70% 45%,rgba(212,204,238,.7) 0%,rgba(255,255,255,0) 100%),
    radial-gradient(22% 24% at 52% 60%,rgba(240,169,226,.35) 0%,rgba(255,255,255,0) 100%)}
  #§prom{position:absolute;left:0;right:0;top:380px;text-align:center}
  #§prom .§pl{display:block;overflow:hidden;height:92px}
  #§prom .§pl span{display:inline-block;font-family:Unbounded;font-weight:500;font-size:64px;line-height:92px;letter-spacing:-.02em;color:#212C34}
  #§ptag{position:absolute;left:810px;top:270px;width:300px;height:60px;border-radius:30px;background:#FF0055;color:#FFFFFF;font-weight:600;font-size:24px;line-height:60px;text-align:center}
  #§stage{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1400px;perspective-origin:960px 520px}
  #§swirl{position:absolute;inset:0;transform-style:preserve-3d}
  .§th{position:absolute;left:0;top:0;width:210px;height:120px;border-radius:12px;background-size:210px 120px;box-shadow:0 14px 28px rgba(33,44,52,.16)}
  #§logo{position:absolute;left:660px;top:420px;width:600px}
  #§logo svg{width:600px;height:173.7px;display:block}
  #§logo path[fill="#FF0055"]{transform-box:fill-box;transform-origin:50% 50%}
  #§sig{position:absolute;left:0;right:0;top:660px;text-align:center;font-weight:300;font-size:44px;color:#4F575D}
</style>
<div class="full" style="background:#FFFFFF"></div>
<div id="§glow"></div>
<div id="§ptag">Notre promesse</div>
<div id="§prom"><span class="§pl"><span>Les meilleurs experts pour votre projet,</span></span><span class="§pl"><span>coordonnés par un partenaire de confiance.</span></span></div>
<div id="§stage"><div id="§swirl"></div></div>
<div id="§logo">{{RELAX}}</div>
<div id="§sig">Relax, on s’occupe de tout.</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const IN = VO.breath, EX = VO.exhale;
    // breathing light: it opens on the inhale and settles on the exhale
    tl.fromTo("#§glow", { scale: 1, opacity: 0.6 }, { scale: 1.22, opacity: 1, duration: EX - IN, ease: "sine.inOut" }, IN);
    tl.to("#§glow", { scale: 1.02, opacity: 0.75, duration: 3.2, ease: "sine.out" }, EX);
    // the promise stays a moment, then lets go with the inhale
    tl.to(["#§prom", "#§ptag"], { opacity: 0, y: -50, filter: "blur(8px)", duration: 1.1, ease: "power2.in" }, IN + 0.3);
    // inhale: everything the project produced gathers, spiralling slowly toward the centre
    const IMGS = ["ecouter", "comprendre", "intel", "voeux", "enseigne", "affiches", "kakemono", "cartes", "reseaux"];
    const r = KIT.rng(3), N = 18, th = [];
    for (let i = 0; i < N; i++) {
      const d = document.createElement("div");
      d.className = ID + "-th";
      d.style.backgroundImage = `url(assets/cards/${IMGS[i % IMGS.length]}.png)`;
      $("swirl").appendChild(d);
      th.push({ el: d, a0: (i / N) * Math.PI * 2 + r() * 0.3, r0: 820 + r() * 260, z0: -300 + r() * 500, tilt: -20 + r() * 40 });
    }
    const sw = { t: 0 };
    const draw = () => {
      const t = sw.t; // 0 → 1 inhale (gather), 1 → 2 exhale (release)
      th.forEach((o, i) => {
        const g = t <= 1 ? 1 - Math.pow(1 - t, 2) : 1, rel = t > 1 ? t - 1 : 0;
        const ang = o.a0 + t * 1.6, rad = o.r0 * (1 - 0.72 * g) * (1 + 1.6 * rel * rel);
        const x = 960 + Math.cos(ang) * rad * 1.15 - 105, y = 520 + Math.sin(ang) * rad * 0.55 - 60;
        o.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${(o.z0 * (1 - g)).toFixed(1)}px) rotateY(${(o.tilt + ang * 20).toFixed(1)}deg) scale(${(0.7 + 0.3 * g).toFixed(3)})`;
        o.el.style.opacity = (Math.min(1, t * 3) * (1 - Math.min(1, rel * 1.3))).toFixed(3);
        o.el.style.filter = `blur(${(rel * 10).toFixed(1)}px)`;
      });
    };
    draw();
    tl.fromTo(sw, { t: 0 }, { t: 1, duration: EX - IN, ease: "none", onUpdate: draw }, IN);
    tl.fromTo(sw, { t: 1 }, { t: 2, duration: 2.1, ease: "power1.out", onUpdate: draw, immediateRender: false }, EX);
    // exhale: released — relax• appears in the calm that follows
    tl.fromTo("#§logo", { opacity: 0, scale: 0.94, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.6, ease: "power2.out" }, EX + 0.25);
    tl.fromTo('#§logo path[fill="#FF0055"]', { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.7, ease: "back.out(2.4)" }, EX + 1.1);
    tl.fromTo("#§sig", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, EX + 1.5);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
