<style>
  #§glow{position:absolute;inset:-10%;background:
    radial-gradient(34% 38% at 30% 55%,rgba(142,235,247,.40) 0%,rgba(255,255,255,0) 100%),
    radial-gradient(34% 38% at 70% 45%,rgba(212,204,238,.65) 0%,rgba(255,255,255,0) 100%),
    radial-gradient(22% 24% at 52% 60%,rgba(240,169,226,.30) 0%,rgba(255,255,255,0) 100%)}
  #§frame{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px;clip-path:circle(1300px at 960px 540px)}
  #§tag{position:absolute;left:0;right:0;top:300px;text-align:center}
  #§tag span{display:inline-block;height:60px;padding:0 30px;border-radius:30px;background:#FF0055;color:#FFFFFF;font-weight:600;font-size:24px;line-height:60px}
  #§prom{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:Unbounded;font-weight:500;font-size:68px;line-height:100px;letter-spacing:-.02em;color:#212C34}
  #§prom b{font-weight:500;position:relative;z-index:1}
  #§prom u{text-decoration:none;position:relative;display:inline-block}
  #§prom u::before{content:"";position:absolute;left:-6px;right:-6px;bottom:14px;height:30px;border-radius:8px;background:linear-gradient(90deg,#D4CCEE,#F4C6E6);z-index:0}
  #§gloss{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;pointer-events:none;
    background:radial-gradient(circle at 900px 470px,rgba(255,255,255,.95) 0,rgba(255,255,255,.0) 60px),radial-gradient(circle at 960px 540px,rgba(169,156,240,0) 70px,rgba(105,85,170,.35) 108px,rgba(105,85,170,0) 112px)}
  #§pt{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #§ball{position:absolute;left:850px;top:430px;width:220px;height:220px;border-radius:50%;opacity:0;
    background:radial-gradient(circle at 34% 30%,#FFFFFF 0%,#F4C6E6 18%,#A99CF0 55%,#6955AA 100%);box-shadow:0 30px 60px rgba(105,85,170,.35)}
  #§ballp{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FF8FB4 0%,#FF0055 45%,#C2003F 100%);opacity:0}
  #§logo{position:absolute;left:660px;top:420px;width:600px}
  #§logo svg{width:600px;height:173.7px;display:block}
  #§logo path[fill="#FF0055"]{opacity:0}
  #§sig{position:absolute;left:0;right:0;top:660px;text-align:center;font-weight:400;font-size:44px;color:#4F575D}
</style>
<div class="full wash"></div>
<div id="§glow"></div>
<canvas id="§pt" width="1920" height="1080"></canvas>
<div id="§frame">
  <div id="§tag"><span>Notre promesse</span></div>
  <div id="§prom">Les <u><b>meilleurs</b></u> <u><b>experts</b></u> pour votre projet,<br>coordonnés par un <u><b>partenaire</b></u> <u><b>de</b></u> <u><b>confiance.</b></u></div>
</div>
<div id="§gloss"></div>
<div id="§ball"><div id="§ballp"></div></div>
<div id="§logo">{{RELAX}}</div>
<div id="§sig">Relax, on s’occupe de tout.</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const IN = VO.breath, EX = VO.exhale;
    $("prom").querySelectorAll("u").forEach((u) => u.setAttribute("data-layout-allow-overlap", ""));
    // breathing light
    tl.fromTo("#§glow", { scale: 1, opacity: 0.6 }, { scale: 1.22, opacity: 1, duration: EX - IN, ease: "sine.inOut" }, IN);
    tl.to("#§glow", { scale: 1.02, opacity: 0.75, duration: 3.2, ease: "sine.out" }, EX);
    // inhale: the whole image is drawn in and compressed into one sphere
    const CL = { r: 1300, s: 1 };
    const frame = $("frame");
    const comp = () => { frame.style.clipPath = `circle(${CL.r.toFixed(1)}px at 960px 540px)`; frame.style.transform = `scale(${CL.s.toFixed(4)})`; };
    comp();
    tl.fromTo(CL, { r: 1300, s: 1 }, { r: 560, s: 0.196, duration: EX - IN - 0.1, ease: "power2.inOut", onUpdate: comp }, IN);
    tl.fromTo("#§gloss", { opacity: 0 }, { opacity: 1, duration: 0.5 }, EX - 0.6);
    // particles spiral in with the breath (seeded)
    const cv = $("pt"), g = cv.getContext("2d"), r = KIT.rng(12);
    const PCOL = ["#A99CF0", "#F4A3D2", "#8FD3DC", "#D4CCEE", "#6955AA"];
    const P = Array.from({ length: 360 }, () => ({ a: r() * Math.PI * 2, d: 380 + r() * 760, s: 1.5 + r() * 3.5, c: PCOL[Math.floor(r() * 5)], w: 0.6 + r() * 0.8 }));
    const pk = { t: 0 };
    const drawP = () => {
      g.clearRect(0, 0, 1920, 1080);
      const k = pk.t, e = 1 - Math.pow(1 - Math.min(1, k), 2.2);
      if (k <= 0 || k >= 1.35) return;
      for (const p of P) {
        const ang = p.a + e * 2.6 * p.w, dist = p.d * (1 - e * 0.92) * (k > 1 ? 1 + (k - 1) * 1.6 : 1);
        const x = 960 + Math.cos(ang) * dist, y = 540 + Math.sin(ang) * dist * 0.62;
        g.globalAlpha = Math.min(1, k * 3) * (k > 1 ? Math.max(0, 1 - (k - 1) / 0.35) : 1);
        g.fillStyle = p.c;
        g.beginPath(); g.arc(x, y, p.s, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
    };
    tl.fromTo(pk, { t: 0 }, { t: 1.35, duration: EX - IN + 0.6, ease: "none", onUpdate: drawP }, IN);
    // the compressed image becomes a glossy ball…
    tl.set(["#§frame", "#§gloss"], { opacity: 0 }, EX);
    tl.fromTo("#§ball", { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, EX - 0.02);
    tl.to("#§ball", { scale: 1.08, duration: 0.25, ease: "sine.out", yoyo: true, repeat: 1 }, EX);
    // …exhale: it settles, turns pink and lands as the dot of relax•
    const DX = 1238.4 - 960, DY = 528.4 - 540, DS = 43.8 / 220;
    tl.to("#§ballp", { opacity: 1, duration: 0.6, ease: "power1.inOut" }, EX + 0.5);
    tl.to("#§ball", { x: DX, y: DY, scale: DS, duration: 1.3, ease: "power3.inOut" }, EX + 0.55);
    tl.fromTo("#§logo", { opacity: 0, filter: "blur(10px)", scale: 0.96 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 1.3, ease: "power2.out" }, EX + 0.7);
    tl.fromTo("#§sig", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, EX + 1.7);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
