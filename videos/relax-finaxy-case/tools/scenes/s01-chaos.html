<style>
  #s01-chaos-logo{position:absolute;left:780px;top:440px;width:360px;height:111px}
  #s01-chaos-logo svg{width:360px;height:111px;display:block}
  .s01-stat{position:absolute;top:836px;display:flex;align-items:flex-end;gap:22px}
  .s01-stat .big{font-family:Unbounded,sans-serif;font-weight:500;font-size:132px;line-height:1;color:#212C34;font-variant-numeric:tabular-nums}
  .s01-stat .lab{font-size:34px;font-weight:300;color:#6B7278;padding-bottom:14px;line-height:1.25}
  .s01-stat .sup{font-family:Unbounded,sans-serif;font-weight:500;font-size:46px;align-self:flex-start;margin-left:-14px;margin-top:6px}
</style>
<div class="wash" id="s01-chaos-wash"></div>
<svg class="stage" id="s01-chaos-stage" viewBox="0 0 1920 1080"></svg>
<div id="s01-chaos-logo">{{FINAXY_OLD}}</div>
<div class="s01-stat" id="s01-chaos-stat1" style="left:120px"><span class="big" id="s01-chaos-n1">0</span><span class="sup">e</span><span class="lab">courtier<br>français</span></div>
<div class="s01-stat" id="s01-chaos-stat2" style="left:760px"><span class="big" id="s01-chaos-n2">+ 0</span><span class="lab">entreprises<br>clientes</span></div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const { C, rng, el, jitter } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const r = rng(7);
    const tl = gsap.timeline({ paused: true });

    const LABELS = ["IARD", "Santé", "Prévoyance", "Cyber", "Flottes", "Construction", "RC Pro", "Crédit",
      "Voyage", "Collection", "Cabinet", "Cabinet", "Marque acquise", "Marque acquise", "Équin",
      "Plaisance", "Expertise", "Interlocuteur", "Interlocuteur", "Héritage", "Transport", "Agricole",
      "Forêts", "Marque acquise", "Cabinet", "Affinitaire"];
    // Keep clear of the centre logo and the stat band at the bottom.
    const pts = [];
    while (pts.length < LABELS.length) {
      const x = 130 + r() * 1620, y = 170 + r() * 600;
      if (x > 640 && x < 1330 && y > 360 && y < 640) continue;
      if (pts.some(([a, b]) => (a - x) ** 2 + (b - y) ** 2 < 150 ** 2)) continue;
      pts.push([x, y]);
    }
    const world = el("g", {}, svg);
    // tangled links: the complexity
    const links = [];
    for (let i = 0; i < 22; i++) {
      const a = pts[Math.floor(r() * pts.length)], b = pts[Math.floor(r() * pts.length)];
      const ln = el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.grey, "stroke-width": 1.5, opacity: 0 }, world);
      links.push(ln);
    }
    const nodes = pts.map(([x, y], i) => {
      const g = el("g", { transform: `translate(${x} ${y})` }, world);
      const inner = el("g", {}, g);
      const rad = [6, 8, 11][i % 3];
      el("circle", { r: rad, fill: C.grey }, inner);
      const t = el("text", { x: rad + 12, y: 8, fill: "#7A8288", "font-family": "DM Sans", "font-size": 24, "font-weight": 500 }, inner);
      t.textContent = LABELS[i];
      return inner;
    });

    // entrances — scattered pops, fast and uneven
    nodes.forEach((n, i) => {
      tl.fromTo(n, { scale: 0, opacity: 0, transformOrigin: "0px 0px" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, 0.05 + (i % 9) * 0.06 + Math.floor(i / 9) * 0.22);
      jitter(tl, n, r, 9, 7, 0.5, D);
    });
    links.forEach((ln, i) => {
      const t0 = 0.6 + r() * (D - 2.2);
      tl.fromTo(ln, { opacity: 0 }, { opacity: 0.45, duration: 0.25, ease: "power1.out" }, t0);
      tl.to(ln, { opacity: 0.08, duration: 0.6, ease: "power1.in" }, t0 + 0.6 + r() * 0.8);
    });
    tl.fromTo(world, { x: 0 }, { x: -40, duration: D, ease: "none" }, 0);

    // the old logo, adrift among the rest
    tl.fromTo("#" + ID + "-logo", { opacity: 0, y: 20, rotation: -1.6 }, { opacity: 0.9, y: 0, rotation: -1.6, duration: 0.6, ease: "power3.out" }, 0.3);
    tl.to("#" + ID + "-logo", { rotation: 1.6, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((D - 1) / 0.9) - 1) }, 1);

    // stats — count-up on the cue words
    const n1 = document.getElementById(ID + "-n1"), n2 = document.getElementById(ID + "-n2");
    const c1 = { v: 0 }, c2 = { v: 0 };
    tl.fromTo("#" + ID + "-stat1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, VO.courtier - 0.3);
    tl.fromTo(c1, { v: 0 }, { v: 11, duration: 0.9, ease: "power2.out", onUpdate: () => (n1.textContent = Math.round(c1.v)) }, VO.courtier - 0.3);
    tl.fromTo("#" + ID + "-stat2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, VO.clientes - 0.4);
    tl.fromTo(c2, { v: 0 }, { v: 12000, duration: 1.3, ease: "power2.out", immediateRender: false, onUpdate: () => (n2.textContent = "+ " + String(Math.round(c2.v / 10) * 10).replace(/\B(?=(\d{3})+(?!\d))/g, " ")) }, VO.clientes - 0.4);

    window.__timelines[ID] = tl;
  })();
</script>
