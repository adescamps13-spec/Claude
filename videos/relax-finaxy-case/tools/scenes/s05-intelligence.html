<style>
  #s05-intelligence-panel{position:absolute;left:160px;top:150px;width:1600px;height:660px;border-radius:28px;background:#191853;overflow:hidden;transform-origin:50% 50%}
  #s05-intelligence-panel svg{position:absolute;inset:0;width:1600px;height:660px}
  #s05-intelligence-q{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:'Instrument Serif',serif;color:#F4F1EB;font-size:140px;line-height:1.05}
  #s05-intelligence-q .l{display:block;overflow:hidden;padding-bottom:10px}
  #s05-intelligence-q .l > span{display:block}
  #s05-intelligence-bar{position:absolute;left:740px;top:560px;width:120px;height:6px;border-radius:3px;background:#9C0A3F;transform-origin:left center}
  #s05-intelligence-tag{position:absolute;left:160px;top:860px;font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B7278}
  #s05-intelligence-foot{position:absolute;left:160px;top:910px;font-size:36px;font-weight:300;color:#212C34}
</style>
<div class="wash"></div>
<svg class="stage" id="s05-intelligence-stage" viewBox="0 0 1920 1080"></svg>
<div id="s05-intelligence-panel">
  <svg id="s05-intelligence-mesh" viewBox="0 0 1600 660"></svg>
  <div id="s05-intelligence-q"><span class="l"><span id="s05-intelligence-q1">L'intelligence collective</span></span><span class="l"><span id="s05-intelligence-q2" style="font-style:italic">du risque.</span></span></div>
  <div id="s05-intelligence-bar"></div>
</div>
<div id="s05-intelligence-tag">Plateforme de marque Finaxy · big idea</div>
<div id="s05-intelligence-foot">Le principe qui organise tout le reste.</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const { C, rng, el, defs, thread } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const mesh = document.getElementById(ID + "-mesh");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const r = rng(5);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);

    // the network, now quiet, behind the line — cream on Finaxy navy
    const pts = Array.from({ length: 34 }, () => [40 + r() * 1520, 30 + r() * 600]);
    pts.forEach((p, i) => {
      pts.slice(i + 1, i + 3).forEach((q) => el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: C.cream, "stroke-width": 1.5, opacity: 0.13 }, mesh));
      el("circle", { cx: p[0], cy: p[1], r: 4, fill: C.cream, opacity: 0.3 }, mesh);
    });

    // the thread runs under the panel and stops: held frame
    const th = thread(svg, ID, "M -20 860 L 1940 860", { w: 6, head: false });
    th.draw(tl, 0, 1, 0, 1.2, "power3.out");

    tl.fromTo($("panel"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
    tl.fromTo($("q1"), { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, VO.intelligence - 0.5);
    tl.fromTo($("q2"), { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, VO.intelligence - 0.25);
    tl.fromTo($("bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, VO.intelligence + 0.4);
    tl.fromTo([$("tag"), $("foot")], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, VO.intelligence + 0.6);
    // after that: nothing moves — the line lands
    window.__timelines[ID] = tl;
  })();
</script>
