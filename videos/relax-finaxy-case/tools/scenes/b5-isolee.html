<style>
  #§rings{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #§rings text{font-family:Unbounded;font-weight:600;letter-spacing:.06em}
  #§dot{position:absolute;left:942px;top:482px;width:36px;height:36px;border-radius:18px;background:#FF0055;box-shadow:0 0 0 10px rgba(255,0,85,.12)}
  #§lbl{position:absolute;left:0;right:0;top:532px;text-align:center;font-weight:500;font-size:20px;color:#4F575D}
  #§cap{position:absolute;left:460px;width:1000px;top:950px;height:110px;font-family:Unbounded;font-size:40px;line-height:110px;box-shadow:0 30px 60px rgba(33,44,52,.25)}
  #§cap em{font-style:normal;color:#FF7AA5}
</style>
<div class="full wash"></div>
<svg id="§rings" viewBox="0 0 1920 1080" data-layout-allow-overlap></svg>
<div id="§dot"></div>
<div id="§lbl">une expertise</div>
<div class="btn" id="§cap">aucune expertise <em>isolée</em> ne suffit.</div>
{{HUD:#62666B|02 — RÉVÉLER}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["2.12"];
    // rings of every kind of risk circle a tiny point and close in on it (after the ajith reference)
    const NS = "http://www.w3.org/2000/svg", svg = $("rings");
    const RISKS = "CLIMATIQUE · HUMAIN · CYBER · RÉGLEMENTAIRE · GÉOPOLITIQUE · RÉPUTATIONNEL · ";
    const RINGS = [[395, 268, 42, "#212C34", 1], [295, 190, 33, "#7E6CC4", -1], [205, 122, 25, "#AA5655", 1], [132, 70, 18, "#4B8A93", -1]];
    const groups = RINGS.map(([r0, r1, fs, col, dir], i) => {
      const g = document.createElementNS(NS, "g");
      const path = document.createElementNS(NS, "path");
      const pid = `${ID}-rp${i}`;
      path.setAttribute("id", pid);
      path.setAttribute("d", `M 960 ${500 - r0} a ${r0} ${r0} 0 1 1 -0.01 0`);
      path.setAttribute("fill", "none");
      const txt = document.createElementNS(NS, "text");
      txt.setAttribute("font-size", fs);
      txt.setAttribute("fill", col);
      const tp = document.createElementNS(NS, "textPath");
      tp.setAttribute("href", "#" + pid);
      const n = Math.max(1, Math.round((2 * Math.PI * r0) / (fs * 0.78 * RISKS.length)));
      tp.textContent = RISKS.repeat(n);
      txt.appendChild(tp);
      g.appendChild(path);
      g.appendChild(txt);
      svg.appendChild(g);
      return { g, r0, r1, dir };
    });
    // rings tighten (scale about the centre) while turning
    groups.forEach((o, i) => {
      gsap.set(o.g, { svgOrigin: "960 500" });
      tl.fromTo(o.g, { scale: 1.5, opacity: 0, rotation: o.dir * -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, a - 0.1 + i * 0.07);
      tl.to(o.g, { scale: o.r1 / o.r0, rotation: o.dir * 70, duration: D - a - 0.6, ease: "power1.in" }, a + 0.6 + i * 0.07);
    });
    tl.fromTo("#§dot", { scale: 1 }, { scale: 0.62, duration: D - a, ease: "power1.in" }, a);
    tl.to("#§dot", { x: 3, duration: 0.05, yoyo: true, repeat: 11, ease: "none" }, a + 1.4);
    tl.fromTo("#§lbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, a + 0.3);
    tl.to("#§lbl", { opacity: 0, duration: 0.3 }, a + 1.6);
    tl.fromTo("#§cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, a + 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
