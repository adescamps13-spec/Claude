<style>
  #§q{position:absolute;left:0;right:0;top:150px;text-align:center;font-weight:300;font-size:54px;color:#212C34}
  #§stage{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1700px;perspective-origin:960px 300px}
  #§cake{position:absolute;left:560px;top:420px;width:800px;height:460px;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(-28deg)}
  .§slab{position:absolute;inset:0;border-radius:40px;transform-style:preserve-3d}
  .§slab b{position:absolute;left:56px;bottom:46px;font-family:Unbounded;font-weight:500;font-size:58px;color:#FFFFFF;letter-spacing:-.01em}
  .§side{position:absolute;inset:0;border-radius:40px}
  #§cherry{position:absolute;left:890px;top:0;width:140px;height:140px;border-radius:70px;background:radial-gradient(circle at 34% 30%,#FF8FB4 0%,#FF0055 38%,#C2003F 78%,#8E002E 100%);box-shadow:0 18px 30px rgba(140,0,46,.35)}
  #§ring{position:absolute;opacity:0;left:870px;top:340px;width:180px;height:180px;border-radius:90px;border:3px solid #FF0055}
  #§bub{position:absolute;left:1130px;top:250px;width:640px;height:230px;border-radius:32px;background:#FFFFFF;box-shadow:0 30px 70px rgba(33,44,52,.16);transform-origin:0% 60%}
  #§bub::before{content:"";position:absolute;left:-14px;top:150px;width:30px;height:30px;background:#FFFFFF;transform:rotate(45deg);border-radius:4px}
  #§lbl{position:absolute;left:40px;top:34px;font-weight:600;font-size:20px;letter-spacing:.16em;color:#62666B}
  #§lbl i{display:inline-block;width:14px;height:14px;border-radius:7px;background:#FF0055;margin-right:12px;vertical-align:1px}
  #§line{position:absolute;left:40px;top:92px;width:570px;font-family:Unbounded;font-weight:500;font-size:44px;line-height:1.2;color:#212C34;white-space:nowrap}
  #§caret{display:inline-block;width:4px;height:46px;margin-left:6px;vertical-align:-8px;background:#FF0055}
  .§who{position:absolute;height:58px;padding:0 26px 0 50px;border-radius:29px;background:#212C34;color:#FFFFFF;font-weight:500;font-size:24px;line-height:58px;white-space:nowrap}
  .§who::before{content:"";position:absolute;left:22px;top:21px;width:16px;height:16px;border-radius:8px;background:#FF0055}
</style>
<div class="full studio"></div>
<div id="§q">La cerise sur le gâteau ?</div>
<div id="§stage"><div id="§cake"></div></div>
<div id="§ring"></div>
<div id="§cherry"></div>
<div id="§bub"><div id="§lbl"><i></i>AGENT ÉDITORIAL IA</div><div id="§line"><span id="§typed"></span><span id="§caret"></span></div></div>
<div id="§who"></div>
{{HUD:#62666B|05 — DÉPLOYER}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["4.8"], ag = VO["4.9"], ch = VO["4.10"];
    // the cake: every layer of the project, stacked — platform, identity, supports, site
    const LAY = [["la plateforme", "#6955AA", "#4E3F86"], ["l’identité", "#56A0AA", "#3F7A82"], ["les supports", "#212C34", "#11181D"], ["le site", "#D4CCEE", "#A99FCF"]];
    LAY.forEach(([t, c, d], i) => {
      const s = document.createElement("div");
      s.className = ID + "-slab";
      s.innerHTML = `<div class="${ID}-side" style="background:${d};transform:translateZ(0px)"></div><div class="${ID}-side" style="background:${d};transform:translateZ(16px)"></div><div class="${ID}-side" style="background:${c};transform:translateZ(34px)"><b data-layout-allow-overlap style="color:${i === 3 ? "#3D2F7A" : "#FFFFFF"}">${t}</b></div>`;
      $("cake").appendChild(s);
      tl.fromTo(s, { z: 900 + i * 120, opacity: 0 }, { z: i * 70, opacity: 1, duration: 0.7, ease: "expo.out" }, Math.max(0, a - 0.3) + i * 0.12);
    });
    tl.fromTo("#§cake", { rotationZ: -36 }, { rotationZ: -24, duration: D, ease: "sine.inOut" }, 0);
    tl.fromTo("#§q", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, a);
    // the cherry drops on top
    tl.fromTo("#§cherry", { y: -260 }, { y: 360, duration: 0.75, ease: "bounce.out" }, a + 0.55);
    // "Un agent éditorial IA": the little extra on top — the cherry glows and speaks, in a small bubble beside it
    tl.to("#§q", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, ag - 0.3);
    tl.to(["#§stage", "#§cherry"], { x: -330, duration: 0.8, ease: "expo.inOut" }, ag - 0.3);
    tl.fromTo("#§ring", { x: -330, scale: 0.7, opacity: 0.85 }, { x: -330, scale: 1.6, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, ag + 0.3);
    tl.fromTo("#§bub", { x: -330, scale: 0.2, opacity: 0 }, { x: -330, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, ag + 0.35);
    // it writes in the brand's voice (an example line from the Finaxy editorial charter)
    const LINE = "On regarde ça ensemble.", typed = $("typed"), ty = { n: 0 };
    tl.fromTo(ty, { n: 0 }, { n: LINE.length, duration: 1.0, ease: "none", immediateRender: false, onUpdate: () => (typed.textContent = LINE.slice(0, Math.round(ty.n))) }, ag + 0.85);
    tl.fromTo("#§caret", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: Math.floor((D - ag) / 0.5), yoyo: true }, ag + 0.4);
    // "pour que chacun puisse écrire comme Finaxy": the teams gather round the same voice
    const WHO = [["Direction", 1010, 560], ["Commercial", 1290, 600], ["Gestion", 1560, 560], ["Ressources humaines", 1080, 680], ["Communication", 1440, 680]];
    WHO.forEach(([t, x, y], i) => {
      const d = document.createElement("div");
      d.className = ID + "-who";
      d.textContent = t;
      d.style.left = x + "px";
      d.style.top = y + "px";
      $("who").appendChild(d);
      tl.fromTo(d, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, ch - 0.1 + i * 0.12);
    });
    tl.to("#§who", { y: -10, duration: D - ch, ease: "sine.inOut" }, ch + 0.4);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
