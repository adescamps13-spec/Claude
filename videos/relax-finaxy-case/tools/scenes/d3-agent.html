<style>
  #§gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #§q{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:Unbounded;font-weight:500;font-size:60px;color:#212C34}
  #§ui{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #§chat{position:absolute;left:330px;top:170px;width:880px;height:720px;border-radius:32px;background:#FFFFFF;box-shadow:0 40px 90px rgba(42,34,68,.16);overflow:hidden}
  #§hd{position:absolute;left:0;right:0;top:0;height:96px;border-bottom:1px solid #EEEAF6}
  #§av{position:absolute;left:30px;top:22px;width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,#FFFFFF,#E3DCFA);box-shadow:inset 0 0 0 2px #D4CCEE}
  #§av::before{content:"";position:absolute;left:8px;top:14px;width:36px;height:22px;border-radius:8px;background:#2A2244}
  #§av::after{content:"";position:absolute;left:16px;top:21px;width:6px;height:8px;border-radius:3px;background:#FF3D80;box-shadow:14px 0 0 #FF3D80}
  #§nm{position:absolute;left:96px;top:24px;font-weight:600;font-size:24px;color:#212C34}
  #§st{position:absolute;left:96px;top:56px;font-size:16px;color:#2F6C74}
  #§hd .tag{position:absolute;right:30px;top:26px}
  #§u{position:absolute;right:34px;top:140px;max-width:620px;padding:20px 26px;border-radius:24px 24px 6px 24px;background:#E5E0F5;color:#2A2244;font-size:24px;line-height:1.35}
  #§b{position:absolute;left:34px;top:290px;width:700px;padding:24px 28px;border-radius:24px 24px 24px 6px;background:#F7F6FB;border:1px solid #EEEAF6;color:#191853;font-size:27px;line-height:1.42}
  #§b span{opacity:0}
  #§src{position:absolute;left:34px;top:540px;display:flex;gap:12px}
  #§src div{height:40px;padding:0 18px;border-radius:20px;background:#CCEAEE;color:#224044;font-weight:500;font-size:17px;line-height:40px}
  #§in{position:absolute;left:30px;right:30px;bottom:26px;height:68px;border-radius:34px;background:#F4F2FA;color:#8E899E;font-size:20px;line-height:68px;padding-left:30px;color:#5E5A72}
  #§wl{position:absolute;left:1340px;top:170px;font-weight:600;font-size:17px;letter-spacing:.16em;color:#6B7278}
  .§who{position:absolute;left:1340px;height:62px;padding:0 26px 0 66px;border-radius:31px;background:#FFFFFF;color:#212C34;font-weight:500;font-size:22px;line-height:62px;white-space:nowrap;box-shadow:0 12px 28px rgba(42,34,68,.10)}
  .§who u{position:absolute;left:12px;top:11px;width:40px;height:40px;border-radius:20px;color:#FFFFFF;font-weight:600;font-size:17px;line-height:40px;text-align:center;text-decoration:none}
</style>
<div class="full wash"></div>
<canvas id="§gl" width="1920" height="1080"></canvas>
<div id="§q">Cerise sur le gâteau ?</div>
<div id="§ui">
  <div id="§chat">
    <div id="§hd"><div id="§av"></div><div id="§nm">Agent éditorial Finaxy</div><div id="§st">nourri par la charte et la plateforme</div><span class="tag tag-p">IA</span></div>
    <div id="§u"><span id="§ut"></span></div>
    <div id="§b"></div>
    <div id="§in">Écrire un message…</div>
  </div>
  <div id="§wl">POUR CHACUN</div>
</div>
{{HUD:#62666B|05 — DÉPLOYER}}
{{THREE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["4.7"], ag = VO["4.8"], ch = VO["4.9"], CUT = ag - 0.12;
    // ── the cake and its cherry, a small glossy 3D object ──
    const S = T3.stage($("gl"), { w: 1920, h: 1080, fov: 26, camZ: 14, camY: 3.2 });
    S.camera.lookAt(0, 0.9, 0);
    const cake = new THREE.Group();
    [[1.75, 0.8, 0xbdb0f2], [1.35, 0.7, 0xf6eee2], [0.95, 0.62, 0xf4b3dc]].reduce((y, [rad, h, c]) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, h, 64, 1), T3.clay(c, { roughness: 0.42 }));
      m.position.y = y + h / 2; cake.add(m);
      const lip = new THREE.Mesh(new THREE.TorusGeometry(rad, 0.07, 16, 80), T3.clay(0xffffff, { roughness: 0.35 }));
      lip.rotation.x = Math.PI / 2; lip.position.y = y + h; cake.add(lip);
      return y + h;
    }, 0);
    const shC = T3.shadow(2.6, 0.22); shC.position.y = 0.01; cake.add(shC);
    S.scene.add(cake);
    // the robot head (the agent) that lands on top instead of a cherry
    const cherry = new THREE.Group();
    const shell = T3.glossy(0xece7fc, { irid: 0.8, roughness: 0.16 });
    const berry = new THREE.Mesh(T3.rbox(1.3, 1.0, 1.05, 0.3, 6), shell);
    cherry.add(berry);
    const visor = new THREE.Mesh(T3.rbox(1.02, 0.6, 0.1, 0.2, 4), new THREE.MeshPhysicalMaterial({ color: 0x2a2244, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 }));
    visor.position.set(0, 0.02, 0.5); cherry.add(visor);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3d80 });
    const eyes = [-0.24, 0.24].map((x) => { const e = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.12, 8, 16), eyeMat); e.position.set(x, 0.04, 0.57); cherry.add(e); return e; });
    [-0.7, 0.7].forEach((x) => { const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.16, 40), T3.glossy(0xf4a3d2, { irid: 0.4 })); ear.rotation.z = Math.PI / 2; ear.position.x = x; cherry.add(ear); });
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.42, 12), T3.clay(0x8e899e)); ant.position.y = 0.7; cherry.add(ant);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 32, 24), T3.glossy(0xff1f66, { irid: 0.3, roughness: 0.1 })); bulb.position.y = 0.95; cherry.add(bulb);
    S.scene.add(cherry);
    const TOP = 2.12 + 0.5;
    const draw = (t) => {
      const k = T3.ease.clamp((t - a - 0.35) / 0.55);
      // drop with a bounce, squash on landing
      const fall = k < 1 ? 6 * (1 - k * k) : 0, land = T3.ease.clamp((t - a - 0.9) / 0.35);
      cherry.position.set(0, TOP + fall + Math.sin(land * Math.PI) * 0.35 * (1 - land), 0);
      const sq = land > 0 && land < 1 ? 1 - 0.18 * Math.sin(land * Math.PI) : 1;
      cherry.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      const blink = Math.abs(Math.sin(t * 2.3)) > 0.97 ? 0.15 : 1;
      eyes.forEach((e) => e.scale.set(1, blink, 1));
      cake.rotation.y = -0.4 + t * 0.35;
      cherry.rotation.y = 0.35 + Math.sin(t * 1.2) * 0.25 * land;
      cherry.rotation.z = Math.sin(t * 0.9) * 0.06 * land;
      S.camera.position.x = Math.sin(t * 0.4) * 1.2;
      S.camera.lookAt(0, 2.0, 0);
      S.render();
    };
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: CUT, duration: CUT, ease: "none", onUpdate: () => draw(p.t) }, 0);
    draw(0);
    tl.fromTo("#§q", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, a - 0.05);
    tl.fromTo("#§gl", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 0);
    // ── cut: the robot becomes the agent's avatar ──
    tl.set(["#§gl", "#§q"], { display: "none" }, CUT);
    tl.fromTo("#§ui", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, CUT);
    tl.fromTo("#§chat", { y: 120, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, CUT);
    tl.fromTo("#§av", { scale: 3 }, { scale: 1, duration: 0.6, ease: "expo.out" }, CUT);
    // a request, typed
    const ASK = "Rédige l’annonce de notre nouvelle identité.", ty = { n: 0 };
    tl.fromTo("#§u", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, CUT + 0.35);
    tl.fromTo(ty, { n: 0 }, { n: ASK.length, duration: 0.8, ease: "none", immediateRender: false, onUpdate: () => ($("ut").textContent = ASK.slice(0, Math.round(ty.n))) }, CUT + 0.35);
    // it answers in the Finaxy voice (first line of Finaxy's own announcement)
    const ANS = "Dix-sept ans après sa création, Finaxy ouvre un nouveau chapitre de son histoire. Ensemble, protégeons ce qui compte.";
    $("b").innerHTML = ANS.split(" ").map((w) => `<span>${w} </span>`).join("");
    tl.fromTo("#§b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, CUT + 1.25);
    tl.to("#§b span", { opacity: 1, duration: 0.08, stagger: 0.07 }, CUT + 1.35);
    // "pour que chacun puisse écrire comme Finaxy": every team, the same voice
    const WHO = [["Direction", "D", "#6955AA"], ["Commercial", "C", "#3E7C85"], ["Gestion", "G", "#8E3F3E"], ["Ressources humaines", "RH", "#6E6830"], ["Communication", "Co", "#6955AA"], ["Agences", "A", "#3E7C85"]];
    WHO.forEach(([l, ini, c], i) => {
      const d = document.createElement("div");
      d.className = ID + "-who";
      d.style.top = 214 + i * 96 + "px";
      d.innerHTML = `<u style="background:${c}">${ini}</u>${l}`;
      $("ui").appendChild(d);
      tl.fromTo(d, { x: 60, opacity: 0, scale: 0.8 }, { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, ch - 0.05 + i * 0.12);
    });
    tl.fromTo("#§wl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, ch - 0.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
