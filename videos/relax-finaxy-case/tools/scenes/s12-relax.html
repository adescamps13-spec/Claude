<style>
  #s12-relax-logo{position:absolute;left:610px;top:420px;width:700px;clip-path:inset(0% 100% 0% 0%)}
  #s12-relax-logo svg{width:700px;height:202.6px;display:block}
  #s12-relax-logo path[fill="#FF0055"]{opacity:0}
  #s12-relax-sig{position:absolute;left:0;right:0;top:720px;text-align:center;font-size:40px;font-weight:300;color:#6B7278}
</style>
<div class="wash" id="s12-relax-wash"></div>
<svg class="stage" id="s12-relax-stage" viewBox="0 0 1920 1080"></svg>
<div id="s12-relax-logo">{{RELAX}}</div>
<div id="s12-relax-sig">Maintenant, relax, on s'occupe du reste.</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const { C, el } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    // where the logo's own dot sits on stage: viewBox 76×22 drawn 700 wide at (610,420)
    const K = 700 / 76, LX = 610 + 73.2568 * K, LY = 420 + 13.7358 * K, LR = 2.778 * K;
    const SX = 960, SY = 400;

    const rings = [0, 1, 2].map(() => el("circle", { cx: SX, cy: SY, r: 20, fill: "none", stroke: C.purple, "stroke-width": 2, opacity: 0 }, svg));
    const dot = el("circle", { cx: SX, cy: SY, r: 18, fill: C.pink }, svg);

    // inhale — slow, everything suspended, the dot fills with air
    tl.fromTo($("wash"), { opacity: 0.6 }, { opacity: 0.6, duration: 0.01 }, 0);
    tl.fromTo(dot, { attr: { r: 18, cx: SX, cy: SY } }, { attr: { r: 64 }, duration: VO.exhale - VO.inhale - 0.15, ease: "sine.inOut" }, VO.inhale);
    // exhale — released: the dot settles into its place in the logo, waves spread out
    tl.to(dot, { attr: { r: LR, cx: LX, cy: LY }, duration: 2.2, ease: "power2.inOut" }, VO.exhale);
    rings.forEach((rg, i) => tl.fromTo(rg, { attr: { r: 60 }, opacity: 0.35 }, { attr: { r: 900 }, opacity: 0, duration: 2.8, ease: "power2.out", immediateRender: false }, VO.exhale + i * 0.35));
    tl.to($("wash"), { opacity: 1, duration: 2.4, ease: "sine.out" }, VO.exhale);
    tl.fromTo($("logo"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.3, ease: "power2.out" }, VO.logo - 0.4);
    tl.fromTo($("sig"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, VO.signature);
    window.__timelines[ID] = tl;
  })();
</script>
