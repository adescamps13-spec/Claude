<style>
  #§gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .§cap{position:absolute;top:800px;width:640px;text-align:center}
  .§cap .h-uni{display:block;margin-top:16px;font-size:44px;color:#212C34}
  .§cap .h-uni s{text-decoration:none;position:relative}
  .§x{position:absolute;left:-6px;right:-6px;top:52%;height:6px;border-radius:3px;background:#FF0055;transform-origin:left center}
  #§both{position:absolute;left:0;right:0;top:820px;text-align:center;font-family:Unbounded;font-weight:500;font-size:78px;letter-spacing:-.01em;color:#212C34}
  #§both em{font-style:normal;background:linear-gradient(100deg,#6955AA,#F4A3D2,#56A0AA);-webkit-background-clip:text;background-clip:text;color:transparent}
  #§lead{position:absolute;left:0;right:0;top:150px;text-align:center;font-weight:400;font-size:40px;color:#6B7278}
</style>
<div class="full wash"></div>
<canvas id="§gl" width="1920" height="1080"></canvas>
<div id="§lead">Finaxy, vraiment ?</div>
<div class="§cap" id="§c1" style="left:180px"><span class="tag tag-c">pas un grand groupe</span><span class="h-uni">déshumanisé</span></div>
<div class="§cap" id="§c2" style="left:1100px"><span class="tag tag-r">pas un petit courtier</span><span class="h-uni">de proximité</span></div>
<div id="§both">la force <em>des deux.</em></div>
{{HUD:#62666B|02 — RÉVÉLER}}
{{THREE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const S = T3.stage($("gl"), { w: 1920, h: 1080, fov: 28, camZ: 25, camY: 2.6 });
    S.camera.lookAt(0, 1.4, 0);
    const tex = (draw, w = 256, h = 512) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
    // the cold corporate tower: tall, grey-blue, a grid of identical windows
    const winTex = tex((g, w, h) => { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); g.fillStyle = "#c9d2dc"; for (let y = 14; y < h; y += 30) for (let x = 16; x < w; x += 40) g.fillRect(x, y, 24, 16); });
    const towerMat = new THREE.MeshPhysicalMaterial({ color: 0xa7b3c2, map: winTex, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.1, iridescence: 0 });
    const tower = new THREE.Group();
    const t1 = new THREE.Mesh(T3.rbox(2.0, 5.2, 2.0, 0.16), towerMat); t1.position.y = 2.6; tower.add(t1);
    const t2 = new THREE.Mesh(T3.rbox(1.5, 1.4, 1.5, 0.14), towerMat); t2.position.y = 5.9; tower.add(t2);
    const t3 = new THREE.Mesh(T3.rbox(0.9, 0.7, 0.9, 0.12), towerMat); t3.position.y = 6.95; tower.add(t3);
    const shT = T3.shadow(2.2, 0.25); shT.position.y = 0.01; tower.add(shT);
    S.scene.add(tower);
    // the small local office: warm, friendly, a striped awning
    const awnTex = tex((g, w, h) => { for (let x = 0; x < w; x += 32) { g.fillStyle = (x / 32) % 2 ? "#ffffff" : "#ff8fb8"; g.fillRect(x, 0, 32, h); } }, 256, 64);
    const shop = new THREE.Group();
    const body = new THREE.Mesh(T3.rbox(1.6, 1.15, 1.2, 0.14), T3.clay(0xf6d3d3, { roughness: 0.45 })); body.position.y = 0.58; shop.add(body);
    const roof = new THREE.Mesh(T3.rbox(1.8, 0.22, 1.35, 0.08), T3.clay(0xe9a9bd)); roof.position.y = 1.25; shop.add(roof);
    const awn = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 0.42), new THREE.MeshStandardMaterial({ map: awnTex, roughness: 0.5 })); awn.position.set(0, 0.98, 0.78); awn.rotation.x = 0.45; shop.add(awn);
    const door = new THREE.Mesh(T3.rbox(0.36, 0.62, 0.06, 0.05), T3.clay(0x6955aa)); door.position.set(-0.35, 0.33, 0.61); shop.add(door);
    const win = new THREE.Mesh(T3.rbox(0.5, 0.36, 0.06, 0.06), T3.glossy(0xcceaee, { irid: 0.3 })); win.position.set(0.35, 0.6, 0.61); shop.add(win);
    const plant = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), T3.clay(0x9fd3b5)); plant.position.set(0.85, 0.22, 0.55); shop.add(plant);
    const shS = T3.shadow(1.5, 0.25); shS.position.y = 0.01; shop.add(shS);
    S.scene.add(shop);
    const COLD = new THREE.Color(0xa7b3c2), WARM = new THREE.Color(0xc9bdf5);
    // the fusion: both bodies melt into one glossy matter (metaballs)…
    const fuseMat = T3.glossy(0xffffff, { irid: 0.7, roughness: 0.18 });
    fuseMat.vertexColors = true;
    const mc = new THREE.MarchingCubes(64, fuseMat, false, true, 160000);
    const MS = 6, MY = 2.6;
    mc.scale.set(MS, MS, MS);
    mc.position.set(0, MY, 0);
    S.scene.add(mc);
    const nx = (x) => x / (2 * MS) + 0.5, ny = (y) => (y - MY) / (2 * MS) + 0.5;
    const CCOLD = new THREE.Color(0xa7b3c2), CPINK = new THREE.Color(0xf4b8c8), CFUSE = new THREE.Color(0xb3a3f3), tmp = new THREE.Color();
    // …out of which a new building rises: three glossy towers of different heights, warm windows, the awning at its foot
    const warmTex = tex((g, w, h) => { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); g.fillStyle = "#ffe3c4"; for (let y = 14; y < h; y += 30) for (let x = 16; x < w; x += 40) g.fillRect(x, y, 24, 16); });
    const edifice = new THREE.Group();
    [[1.6, 5.4, -0.9, -0.5, 0xc9bdf5], [1.35, 4.1, 0.75, 0.1, 0xf2c4e3], [1.2, 3.0, -0.05, 0.95, 0xbfe6ec]].forEach(([w, h, x, z, c]) => {
      const m = new THREE.Mesh(T3.rbox(w, h, w, 0.22), new THREE.MeshPhysicalMaterial({ color: c, map: warmTex, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08, iridescence: 0.6, iridescenceIOR: 1.3 }));
      m.position.set(x, h / 2, z);
      edifice.add(m);
    });
    const awn2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.5), new THREE.MeshStandardMaterial({ map: awnTex, roughness: 0.5 }));
    awn2.position.set(-0.05, 1.05, 1.75); awn2.rotation.x = 0.45; edifice.add(awn2);
    const shE = T3.shadow(3.2, 0.24); shE.position.y = 0.01; edifice.add(shE);
    S.scene.add(edifice);
    const st = { tower: 0, shop: 0, melt: 0, fuse: 0, rise: 0 };
    const a = VO["2.2"], b = VO["2.3"], c = VO["2.4"], d = VO["2.5"], e = VO["2.6"];
    const draw = (t) => {
      const E = T3.ease, m = E.inOut(st.melt), f = E.inOut(st.fuse), rz = E.out(st.rise);
      tower.scale.set(1, Math.max(0.001, E.out(st.tower) * (1 - m)), 1);
      tower.position.set(-3.1, 0, 0);
      tower.rotation.y = -0.5 + Math.sin(t * 0.5) * 0.05;
      const sp = E.out(st.shop), bounce = st.shop < 1 ? Math.sin(st.shop * Math.PI) * 0.35 : 0;
      shop.scale.setScalar(Math.max(0.001, sp * (1 - m)));
      shop.position.set(3.1, bounce, 0);
      shop.rotation.y = 0.45 + Math.sin(t * 0.6) * 0.05;
      tower.visible = m < 0.995; shop.visible = m < 0.995;
      mc.reset();
      const blob = Math.min(1, m * 1.6) * (1 - rz * 0.98);
      if (blob > 0.01) {
        const lerp = (x0, x1) => x0 + (x1 - x0) * f;
        tmp.copy(CCOLD).lerp(CFUSE, f);
        [1.4, 3.2, 5.0].forEach((y, k) => mc.addBall(nx(lerp(-3.1, -0.3 + k * 0.2)), ny(lerp(y, 2.0 + k * 0.4)), 0.5, 0.17 * blob, 12, tmp.clone()));
        tmp.copy(CPINK).lerp(CFUSE, f);
        mc.addBall(nx(lerp(3.1, 0.4)), ny(lerp(0.8, 1.8)), 0.5, 0.15 * blob, 12, tmp.clone());
        mc.addBall(nx(0), ny(2.2), 0.5, 0.2 * blob * f, 12, CFUSE);
      }
      mc.update();
      mc.visible = blob > 0.01;
      edifice.scale.set(Math.max(0.001, 0.6 + 0.4 * rz), Math.max(0.001, rz), Math.max(0.001, 0.6 + 0.4 * rz));
      edifice.visible = rz > 0.001;
      edifice.rotation.y = -0.35 + t * 0.12;
      S.camera.position.x = Math.sin(t * 0.25) * 0.6;
      S.camera.lookAt(0, 2.6, 0);
      S.render();
    };
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => draw(p.t) }, 0);
    const prox = (k, v, at, dur) => tl.fromTo(st, { [k]: st[k] }, { [k]: v, duration: dur, ease: "none", onUpdate: () => draw(p.t), immediateRender: false }, at);
    tl.set(st, { tower: 0, shop: 0, melt: 0, fuse: 0, rise: 0 }, 0);
    prox("tower", 1, a - 0.1, 1.0);
    prox("shop", 1, b - 0.1, 0.8);
    prox("melt", 1, c + 0.1, 0.9);   // "Finaxy cumulait": both melt
    prox("fuse", 1, c + 0.5, 1.4);   // and flow into one body
    prox("rise", 1, d + 0.2, 1.2);   // "par sa structure": a new building rises from it
    draw(0);
    tl.fromTo("#§lead", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
    tl.to("#§lead", { opacity: 0, duration: 0.3 }, a + 0.6);
    tl.fromTo("#§c1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, a + 0.2);
    tl.fromTo("#§c2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, b + 0.2);
    tl.to(["#§c1", "#§c2"], { opacity: 0, y: 30, duration: 0.4, ease: "power2.in" }, c);
    tl.fromTo("#§both", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, e - 0.15);
    tl.fromTo("#§both em", { backgroundPosition: "0% 0%" }, { backgroundPosition: "100% 0%", duration: 1.2, ease: "none" }, e);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
