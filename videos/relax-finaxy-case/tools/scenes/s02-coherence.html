<style>
  #s02-coherence-copy{position:absolute;left:120px;top:250px;width:1180px}
  #s02-coherence-copy .l{display:block;overflow:hidden}
  #s02-coherence-copy .l > span{display:block}
  #s02-coherence-copy .lead{font-size:54px;font-weight:300;color:#6B7278;line-height:1.3}
  #s02-coherence-copy .logo{font-family:Unbounded,sans-serif;font-size:92px;line-height:1.25;color:#212C34;position:relative}
  #s02-coherence-copy .lead2{font-size:54px;font-weight:300;color:#212C34;line-height:1.3;margin-top:46px}
  #s02-coherence-copy .coh{font-family:Unbounded,sans-serif;font-weight:500;font-size:150px;line-height:1.15;color:#212C34;letter-spacing:-.02em}
  #s02-coherence-strike{position:absolute;left:-8px;top:58px;width:1010px;height:7px;background:#FF0055;border-radius:4px;transform-origin:left center}
  #s02-coherence-defi{position:absolute;right:120px;bottom:96px;font-size:36px;font-weight:300;color:#6B7278;font-style:italic}
</style>
<div class="wash"></div>
<svg class="stage" id="s02-coherence-stage" viewBox="0 0 1920 1080"></svg>
<div id="s02-coherence-copy">
  <span class="l"><span class="lead" id="s02-coherence-a">Pas un simple</span></span>
  <span class="l" style="position:relative"><span class="logo" id="s02-coherence-b">problème de logo.</span><span id="s02-coherence-strike"></span></span>
  <span class="l"><span class="lead2" id="s02-coherence-c">Mais un sujet de</span></span>
  <span class="l"><span class="coh" id="s02-coherence-d">cohérence.</span></span>
</div>
<div id="s02-coherence-defi">simplifier, sans appauvrir</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const { C, rng, el, defs, thread, jitter, progressNear } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const r = rng(21);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);

    // the scattered nodes, right side — still trembling
    const P = [[1360, 270], [1560, 400], [1730, 250], [1450, 600], [1690, 660], [1520, 860], [1780, 900], [1300, 820]];
    const LAB = ["Cabinet", "Expertise", "Marque", "Interlocuteur", "Héritage", "Activité", "Marque", "Cabinet"];
    const nodes = P.map(([x, y], i) => {
      const g = el("g", { transform: `translate(${x} ${y})` }, svg);
      const inner = el("g", {}, g);
      const c = el("circle", { r: i === 0 ? 13 : 9, fill: C.grey }, inner);
      const t = el("text", { x: 22, y: 8, fill: "#7A8288", "font-family": "DM Sans", "font-size": 24, "font-weight": 500 }, inner);
      t.textContent = LAB[i];
      return { g, inner, c, x, y };
    });
    nodes.forEach((n, i) => {
      tl.fromTo(n.inner, { opacity: 0, scale: 0.4, transformOrigin: "0px 0px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.05 + i * 0.05);
      jitter(tl, n.g.firstChild === n.inner ? n.inner : n.inner, r, 8, 6, 0.4, i === 0 ? VO.coherence + 1.6 : VO.appauvrir);
    });

    // the thread is born: bottom-left, up to the first node, then out to the next scene at mid-height
    const th = thread(svg, ID, "M -20 1010 C 1250 1010, 1200 330, 1347 274 C 1520 210, 1660 540, 1940 540", { w: 6 });
    const pTouch = progressNear(th, 1360, 270);
    th.draw(tl, 0, pTouch, VO.coherence - 0.2, 1.8, "power2.inOut");
    const touch = VO.coherence + 1.6;
    // the touched node stops trembling and takes the thread's colour
    const ring = el("circle", { cx: 1360, cy: 270, r: 14, fill: "none", stroke: C.pink, "stroke-width": 3, opacity: 0 }, svg);
    tl.fromTo(ring, { attr: { r: 14 }, opacity: 0.9 }, { attr: { r: 60 }, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, touch);
    tl.to(nodes[0].c, { attr: { fill: C.purple }, duration: 0.3 }, touch);
    tl.to(nodes[0].inner.querySelector("text"), { attr: { fill: C.ink }, duration: 0.3 }, touch);

    // "simplifier, sans appauvrir": the others come closer, every name kept
    nodes.slice(1).forEach((n, i) => {
      tl.to(n.g, { attr: { transform: `translate(${1360 + (n.x - 1360) * 0.62} ${270 + (n.y - 270) * 0.7})` }, duration: 1.6, ease: "power2.inOut" }, VO.defi + i * 0.04);
    });
    tl.fromTo($("defi"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, VO.defi + 0.2);

    // copy — masked rises on the cue words
    tl.fromTo($("a"), { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, VO.start);
    tl.fromTo($("b"), { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, VO.start + 0.35);
    tl.fromTo($("strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, VO.logo + 0.2);
    tl.to([$("a"), $("b")], { color: C.grey, duration: 0.4 }, VO.logo + 0.4);
    tl.fromTo($("c"), { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, VO.coherence - 0.6);
    tl.fromTo($("d"), { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, VO.coherence - 0.1);

    // seam: the thread runs on to the right edge, the world slides left
    th.draw(tl, pTouch, 1, D - 1.1, 1.1, "power2.in");
    tl.to([$("copy"), $("defi")], { x: -60, opacity: 0, duration: 0.6, ease: "power2.in" }, D - 0.6);
    nodes.forEach((n) => tl.to(n.inner, { opacity: 0, duration: 0.5, ease: "power1.in" }, D - 0.5));

    window.__timelines[ID] = tl;
  })();
</script>
