<style>
  #s11-tourbillon-a{position:absolute;left:0;right:0;top:860px;text-align:center;font-family:Unbounded,sans-serif;font-size:58px;color:#212C34}
  #s11-tourbillon-b{position:absolute;left:0;right:0;top:955px;text-align:center;font-size:40px;font-weight:300;color:#6B7278}
</style>
<div class="wash"></div>
<svg class="stage" id="s11-tourbillon-stage" viewBox="0 0 1920 1080"></svg>
<div id="s11-tourbillon-a">Les meilleurs experts pour votre projet.</div>
<div id="s11-tourbillon-b">Coordonnés par un partenaire de confiance.</div>
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const { C, rng, el, defs, thread } = window.FIL;
    const svg = document.getElementById(ID + "-stage");
    const $ = (s) => document.getElementById(ID + "-" + s);
    const r = rng(11);
    const tl = gsap.timeline({ paused: true });
    defs(svg, ID);
    const CX = 960, CY = 400;
    const KT = Math.max(1, (D - 1.4) / 4.6); // vortex pacing scales with the voice line

    // the thread comes in from the left and coils toward the centre
    const pts = [];
    for (let k = 0; k <= 160; k++) {
      const u = k / 160, a = Math.PI + u * Math.PI * 5, rad = 1000 * Math.pow(1 - u, 1.5);
      pts.push(`${(CX + Math.cos(a) * rad).toFixed(1)} ${(CY + 140 * (1 - u) + Math.sin(a) * rad * 0.42).toFixed(1)}`);
    }
    const th = thread(svg, ID, "M " + pts.join(" L "), { w: 4 });

    // everything the film carried, now whirling in
    const ITEMS = [["IARD", C.ink2], ["Ancré", C.navy, 1], ["Kakemonos", C.burg, 1], ["cohérence", C.ink], ["Naming", C.red], ["Design", C.purple],
      ["dirigeants", C.ink2], ["Cartes de vœux", C.burg, 1], ["LinkedIn", C.fblue], ["Architecte", C.navy, 1], ["Agent IA", C.purple], ["Stratégie", C.purple],
      ["Pédagogue", C.navy, 1], ["marché", C.ink2], ["Plaquettes B2B", C.navy, 1], ["Éditorial", "#6E6828"], ["Team player", C.navy, 1], ["Cabinet", C.ink2],
      ["Production", "#3B7880"], ["verticales", C.ink2], ["Clientèle privée", C.slate, 1], ["IA", C.red], ["Marque acquise", C.ink2], ["Architecture de marque", "#3B7880"]];
    // items orbit on an ellipse and spiral in; text stays upright (position-only transforms)
    const vortex = el("g", { "data-layout-allow-overlap": "" }, svg);
    ITEMS.forEach(([w, col, serif], i) => {
      const a0 = (i * 137.5 * Math.PI) / 180, rad0 = 300 + (i % 6) * 62 + r() * 30;
      const item = el("g", { "data-layout-allow-overlap": "" }, vortex);
      const t = el("text", { "data-layout-allow-overlap": "", x: 0, y: 0, "text-anchor": "middle", fill: col, "font-family": serif ? "Instrument Serif" : "DM Sans", "font-size": serif ? 38 : 30, "font-weight": serif ? 400 : 500 }, item);
      t.textContent = w;
      const st = { a: a0, k: 1.6, s: 1, o: 0 };
      const put = () => {
        item.setAttribute("transform", `translate(${(CX + Math.cos(st.a) * rad0 * st.k).toFixed(1)} ${(CY + Math.sin(st.a) * rad0 * st.k * 0.52).toFixed(1)}) scale(${st.s.toFixed(3)})`);
        item.setAttribute("opacity", st.o.toFixed(3));
      };
      put();
      const t0 = (0.9 + (i % 8) * 0.22 + Math.floor(i / 8) * 0.12) * KT;
      tl.fromTo(st, { a: a0, k: 1.6, s: 1, o: 0 }, { a: a0 + 1.2, k: 1, o: 1, duration: 0.9, ease: "power2.out", onUpdate: put }, 0.05 + i * 0.03);
      tl.fromTo(st, { a: a0 + 1.2, k: 1, s: 1, o: 1 }, { a: a0 + 1.2 + 4.2, k: 0, s: 0, o: 1, duration: 2.8 * KT, ease: "power3.in", onUpdate: put, immediateRender: false }, t0);
    });
    th.draw(tl, 0, 1, 0, 4.6 * KT, "power2.inOut");

    const dot = el("circle", { cx: CX, cy: CY, r: 10, fill: C.pink }, svg);
    tl.fromTo(dot, { attr: { r: 6 }, opacity: 0 }, { attr: { r: 18 }, opacity: 1, duration: 3.6 * KT, ease: "power2.in" }, 0.8 * KT);
    tl.to(th.group, { opacity: 0, duration: 0.6 }, 4.6 * KT);

    tl.fromTo($("a"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, VO.experts);
    tl.fromTo($("b"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, VO.confiance);
    tl.to([$("a"), $("b")], { opacity: 0, duration: 0.6, ease: "power1.in" }, D - 0.6);
    window.__timelines[ID] = tl;
  })();
</script>
