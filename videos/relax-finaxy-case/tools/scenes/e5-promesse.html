<style>
  #§tag{position:absolute;left:0;right:0;top:300px;text-align:center}
  #§tag span{display:inline-block;height:60px;padding:0 30px;border-radius:30px;background:#FF0055;color:#FFFFFF;font-weight:600;font-size:24px;line-height:60px}
  #§prom{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:Unbounded;font-weight:500;font-size:68px;line-height:100px;letter-spacing:-.02em;color:#212C34}
  #§prom .§w{display:inline-block;position:relative}
  #§prom .§k{position:relative;z-index:1}
  #§prom .§mk{position:absolute;left:-6px;right:-6px;bottom:14px;height:30px;border-radius:8px;background:linear-gradient(90deg,#D4CCEE,#F4C6E6);z-index:0;transform-origin:left center}
</style>
<div class="full wash"></div>
<div id="§tag"><span>Notre promesse</span></div>
<div id="§prom"></div>
{{HUD:#62666B|06 — NOTRE RÔLE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.12"], b = VO["5.13"];
    // the promise, word by word; the key words get marked
    const L1 = "Les meilleurs experts pour votre projet,", L2 = "coordonnés par un partenaire de confiance.";
    const KEY = ["meilleurs", "experts", "partenaire", "de", "confiance."];
    const mk = (line, keyFrom) => line.split(" ").map((w, i) => {
      const key = keyFrom(w, i);
      return `<span class="${ID}-w"${key ? ' data-key="1"' : ""}>${key ? `<i class="${ID}-mk"></i>` : ""}<span class="${ID}-k">${w}</span></span>`;
    }).join(" ");
    $("prom").innerHTML = mk(L1, (w, i) => i === 1 || i === 2) + "<br>" + mk(L2, (w, i) => i >= 3);
    const words = [...$("prom").querySelectorAll("." + ID + "-w")];
    words.forEach((w) => w.setAttribute("data-layout-allow-overlap", ""));
    tl.fromTo("#§tag span", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, a - 0.05);
    tl.fromTo(words, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out", stagger: 0.045 }, a + 0.05);
    const marks = [...$("prom").querySelectorAll("." + ID + "-mk")];
    tl.fromTo(marks, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut", stagger: 0.08 }, b);
    tl.fromTo($("prom").querySelectorAll('[data-key="1"]'), { scale: 1 }, { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.06 }, b + 0.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
