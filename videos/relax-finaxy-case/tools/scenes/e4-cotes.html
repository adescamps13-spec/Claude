<style>
  #§seam{background:#D9D3EE}
  #§left{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
  #§lbg{position:absolute;inset:0;background:linear-gradient(180deg,#FFFFFF 0%,#F4F1FB 45%,#E5E0F5 100%)}
  #§world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
  #§proj{position:absolute;left:750px;top:415px;width:420px;height:250px;transform:scale(1.12);border-radius:32px;background:linear-gradient(135deg,#C9F1F6 0%,#D4CCEE 40%,#F4C6E6 75%,#CDEBFA 100%);box-shadow:0 40px 80px rgba(105,85,170,.28);z-index:2}
  #§proj span{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:Unbounded;font-weight:500;font-size:40px;color:#212C34}
  .§pill{position:absolute;left:0;top:0;height:84px;border-radius:42px;background:linear-gradient(90deg,#1F1F1F,#5D5D5D);color:#FFFFFF;font-weight:500;font-size:32px;line-height:84px;text-align:center;white-space:nowrap;z-index:3}
  .§pill i{display:inline-block;width:14px;height:14px;border-radius:7px;background:#FF0055;margin-right:14px;vertical-align:2px}
  .§cu{position:absolute;left:0;top:0;z-index:5}
  .§cu svg{display:block}
  .§cu b{position:absolute;left:30px;top:30px;padding:4px 14px;border-radius:14px;color:#FFFFFF;font-weight:600;font-size:18px;white-space:nowrap}
  .§art{position:absolute;left:0;top:0;width:180px;height:120px;border-radius:16px;z-index:1;box-shadow:0 14px 30px rgba(42,34,68,.12)}
  .§lbl{position:absolute;top:120px;height:72px;padding:0 34px;border-radius:36px;font-weight:600;font-size:30px;line-height:72px;white-space:nowrap;z-index:6}
  .§h{position:absolute;top:212px;font-family:Unbounded;font-weight:500;font-size:72px;letter-spacing:-.02em;white-space:nowrap;z-index:6}
  #§right{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#FFFFFF}
  #§rib{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #§one{position:absolute;left:1270px;top:560px;height:96px;padding:0 40px 0 76px;border-radius:48px;background:#FFFFFF;color:#212C34;font-family:Unbounded;font-weight:500;font-size:34px;line-height:96px;white-space:nowrap;box-shadow:0 24px 50px rgba(42,34,68,.16)}
  #§one i{position:absolute;left:30px;top:34px;width:28px;height:28px;border-radius:14px;background:#FF0055}
  #§zero{position:absolute;left:0;right:0;top:820px;text-align:center;font-family:Unbounded;font-weight:500;font-size:72px;letter-spacing:-.02em;color:#212C34}
  #§zero em{font-style:normal;color:#6955AA}
</style>
<div class="full" id="§seam"></div>
<div id="§right">
  <svg id="§rib" viewBox="0 0 1920 1080"><defs><linearGradient id="§g" x1="0" x2="1"><stop offset="0" stop-color="#A99CF0"/><stop offset=".5" stop-color="#F4A3D2"/><stop offset="1" stop-color="#8FD3DC"/></linearGradient></defs>
    <path id="§fil" d="M 980 610 C 1080 520, 1160 700, 1270 608" fill="none" stroke="url(#§g)" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
  <div class="§lbl" id="§rl" style="left:1050px;background:#212C34;color:#FFFFFF">Côté client</div>
  <div class="§h" id="§rh" style="left:1050px;color:#212C34">un seul fil</div>
  <div id="§one"><i></i>votre projet</div>
  <div id="§zero">un seul fil, <em>zéro couture.</em></div>
</div>
<div id="§left">
  <div id="§lbg"></div>
  <div id="§world"><div id="§arts"></div><div id="§proj"><span>votre projet</span></div><div id="§ring"></div><div id="§curs"></div></div>
  <div class="§lbl" id="§ll" style="left:90px;background:#6955AA;color:#FFFFFF">Côté Relax</div>
  <div class="§h" id="§lh" style="left:90px;color:#2A2244">du mouvement</div>
</div>
{{HUD:#62666B|06 — NOTRE RÔLE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const a = VO["5.7"], mv = VO["5.8"], cl = VO["5.9"], fil = VO["5.10"], cou = VO["5.11"];
    // Relax side, continuing the last shot: the team keeps working around the project
    const TAL = ["Stratégie", "Naming", "Design", "Édito", "Développement", "Production"];
    const pills = TAL.map((s) => { const p = document.createElement("div"); p.className = ID + "-pill"; p.innerHTML = `<i></i>${s}`; p.style.width = 110 + s.length * 19 + "px"; $("ring").appendChild(p); return { el: p, w: 110 + s.length * 19 }; });
    const ARTC = ["#CAC3E1", "#C3DDE1", "#E0DEC3", "#E1C3C3", "#D4CCEE", "#CCEAEE"];
    const arts = ARTC.map((c, i) => { const d = document.createElement("div"); d.className = ID + "-art"; d.style.background = c; $("arts").appendChild(d); return d; });
    const CU = [["Stratégie", "#6955AA"], ["Design", "#56A0AA"], ["Édito", "#AA5655"], ["Production", "#8C853F"]];
    const curs = CU.map(([n, c]) => { const d = document.createElement("div"); d.className = ID + "-cu"; d.innerHTML = `<svg width="30" height="30" viewBox="0 0 44 44"><path d="M4 3 L40 17 L23 22 L17 40 Z" fill="${c}" stroke="white" stroke-width="3" stroke-linejoin="round"/></svg><b style="background:${c}">${n}</b>`; $("curs").appendChild(d); return d; });
    const busy = { t: 0, k: 0 };
    const drawL = () => {
      const t = busy.t, k = busy.k; // k: 0 = calm docked ring (end of the previous shot) → 1 = busy
      pills.forEach((p, i) => {
        const th = (i / 6) * Math.PI * 2 - Math.PI / 2 + k * t * 0.9, rx = 600 + 60 * k * Math.sin(t * 2 + i), ry = 260 + 40 * k * Math.cos(t * 1.7 + i);
        p.el.style.transform = `translate(${(960 + Math.cos(th) * rx - p.w / 2).toFixed(1)}px,${(540 + Math.sin(th) * ry - 42).toFixed(1)}px) scale(1)`;
      });
      arts.forEach((d, i) => {
        const ph = (t * 0.8 + i / 6) % 1, ang = i * 1.05 + t * 0.3;
        d.style.transform = `translate(${(960 + Math.cos(ang) * 420 - 90).toFixed(1)}px,${(540 + Math.sin(ang) * 330 - 60).toFixed(1)}px) scale(${(0.6 + 0.5 * Math.sin(ph * Math.PI)).toFixed(3)}) rotate(${(Math.sin(t + i) * 8).toFixed(1)}deg)`;
        d.style.opacity = (k * Math.sin(ph * Math.PI)).toFixed(3);
      });
      curs.forEach((d, i) => {
        const x = 960 + Math.sin(t * (1.3 + i * 0.37) + i * 2) * 520, y = 540 + Math.cos(t * (1.1 + i * 0.29) + i) * 300;
        d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
        d.style.opacity = k.toFixed(3);
      });
    };
    drawL();
    tl.fromTo(busy, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: drawL }, 0);
    tl.fromTo(busy, { k: 0 }, { k: 1, duration: 0.8, ease: "power2.inOut", onUpdate: drawL, immediateRender: false }, a);
    tl.fromTo("#§ll", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, a - 0.05);
    tl.fromTo("#§lh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, mv - 0.1);
    // "Côté client": the frame splits, the Relax side shrinks into the left half
    tl.fromTo("#§left", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(0px 968px 0px 0px)", duration: 0.8, ease: "expo.inOut" }, cl - 0.35);
    tl.to("#§world", { scale: 0.55, x: -480, duration: 0.8, ease: "expo.inOut" }, cl - 0.35);
    tl.fromTo("#§rl", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, cl);
    // "un seul fil": one calm thread to one point of contact
    tl.fromTo("#§rh", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, fil - 0.1);
    tl.to("#§fil", { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, fil);
    tl.fromTo("#§one", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, fil + 0.35);
    // "zéro couture": the seam closes; all that movement lives behind one seamless surface
    tl.to("#§left", { xPercent: -100, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.to(["#§rl", "#§rh"], { opacity: 0, duration: 0.3 }, cou - 0.3);
    tl.to("#§fil", { attr: { d: "M 120 600 C 600 470, 1200 730, 1700 600" }, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.to("#§one", { x: 960 - 1270 - 170, y: -40, duration: 0.8, ease: "expo.inOut" }, cou - 0.3);
    tl.fromTo("#§zero", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cou + 0.1);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
