<style>
  #§lead{position:absolute;left:0;right:0;top:170px;text-align:center;color:#A9A3BC;font-weight:300;font-size:46px}
  #§logo{position:relative;color:#FFFFFF;font-weight:500}
  #§strike{position:absolute;left:-6px;right:-6px;top:54%;height:5px;background:#FF0055;transform-origin:left center}
  #§sub{position:absolute;left:0;right:0;top:262px;text-align:center;color:#FFFFFF;font-weight:400;font-size:46px}
  .§word{position:absolute;left:0;top:380px;height:420px;white-space:nowrap;font-family:Unbounded;font-weight:600;font-size:400px;line-height:420px;letter-spacing:-.03em;color:#F4F1F8}
  .§word span{display:inline-block}
  #§front{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 46%,transparent 46%);mask-image:linear-gradient(180deg,#000 0,#000 46%,transparent 46%)}
  #§wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1400px}
  #§card{position:absolute;left:700px;top:350px;width:520px;height:330px;border-radius:26px;background:url(assets/cards/oldlogo.png) 0 0/520px 330px;box-shadow:0 40px 80px rgba(0,0,0,.55)}
  #§sheen{position:absolute;inset:0;border-radius:26px;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 46%,transparent 60%);background-size:260% 100%}
</style>
<div class="full night"></div>
<div id="§lead">Pas juste un problème de <span id="§logo">logo<span id="§strike"></span></span> :</div>
<div id="§sub" data-layout-allow-overlap>un sujet de</div>
<div class="§word" id="§back"></div>
<div id="§wrap"><div id="§card"><div id="§sheen"></div></div></div>
<div class="§word" id="§front"></div>
{{HUD:#6F6A80|01 — LE CONSTAT}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const WORD = "COHÉRENCE";
    [...KIT.letters($("back"), WORD), ...KIT.letters($("front"), WORD)].forEach((s) => s.setAttribute("data-layout-allow-overlap", ""));
    const a = VO["1.4"], b = VO["1.5"];
    tl.fromTo("#§lead", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, a - 0.1);
    tl.fromTo("#§strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, a + 1.0);
    tl.fromTo("#§sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, b - 0.1);
    // the giant word slams in, cropped by the frame, and keeps sliding; the old mark flies through it
    tl.fromTo(".§word", { x: 160, scale: 1.25, opacity: 0, transformOrigin: "50% 50%" }, { x: -160, scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, b + 0.25);
    tl.to(".§word", { x: -620, duration: D - b - 0.8, ease: "none" }, b + 0.8);
    tl.fromTo("#§card", { x: 760, y: 520, rotationX: 58, rotationY: -38, rotationZ: 18, scale: 0.7, opacity: 0 },
      { x: -40, y: -20, rotationX: 14, rotationY: 22, rotationZ: -8, scale: 1.08, opacity: 1, duration: 1.3, ease: "power3.out" }, b + 0.4);
    tl.to("#§card", { x: -900, y: -120, rotationY: 50, rotationX: 8, duration: 0.62, ease: "power3.in" }, D - 0.64);
    tl.fromTo("#§sheen", { backgroundPosition: "130% 0%" }, { backgroundPosition: "-60% 0%", duration: 1.1, ease: "power2.inOut" }, b + 1.3);
    const ls = [...document.querySelectorAll("#§back span, #§front span")], disp = { t: 0 };
    tl.fromTo(disp, { t: 0 }, {
      t: 1, duration: 1.6, ease: "none",
      onUpdate: () => ls.forEach((l, i) => {
        const k = i % WORD.length, c = 4.6 - disp.t * 3.2, d = k - c, f = Math.exp(-d * d * 0.9) * Math.sin(disp.t * Math.PI);
        l.style.transform = `translate(${(d * 26 * f).toFixed(1)}px,${(-60 * f).toFixed(1)}px) skewX(${(-14 * f).toFixed(1)}deg)`;
      }),
    }, b + 0.8);
    tl.to(["#§lead", "#§sub"], { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.5);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
