<style>
  #§bg{background:#FFFFFF}
  #§stage{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1600px;perspective-origin:960px 540px}
  #§grid{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:960px 560px}
  .§c{position:absolute;left:0;top:0;border-radius:14px;overflow:hidden;display:none}
  .§c b{position:absolute;left:10%;top:12%;font-family:Unbounded;font-weight:500;white-space:nowrap}
  .§c i{position:absolute;left:10%;bottom:12%;font-style:normal;font-weight:600;letter-spacing:.12em;white-space:nowrap}
  .§tag{position:absolute;height:64px;padding:0 30px;border-radius:32px;background:#212C34;color:#FFFFFF;font-weight:500;font-size:30px;line-height:64px;white-space:nowrap}
  #§card{position:absolute;left:700px;top:375px;width:520px;height:330px;perspective:1400px}
  .§strip{position:absolute;left:0;width:520px;overflow:hidden}
  .§strip div{position:absolute;left:0;width:520px;height:330px;background:url(assets/cards/oldlogo.png) 0 0/520px 330px;border-radius:26px}
  #§shadow{position:absolute;left:720px;top:690px;width:480px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(33,44,52,.35),rgba(33,44,52,0))}
</style>
<div class="full" id="§bg"></div>
<div id="§stage"><div id="§grid"></div></div>
<div class="§tag" data-layout-allow-overlap id="§t1" style="left:250px;top:170px">cabinets</div>
<div class="§tag" data-layout-allow-overlap id="§t2" style="left:1380px;top:250px">entreprises</div>
<div class="§tag" data-layout-allow-overlap id="§t3" style="left:430px;top:880px">marques</div>
<div id="§shadow"></div>
<div id="§card"></div>
{{HUD:#62666B|01 — LE CONSTAT}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    const r = KIT.rng(11);
    const COLS = ["#6955AA", "#FF0055", "#56A0AA", "#ABA256", "#AA5655", "#212C34", "#8C7BC8", "#4B8A93"];
    const WORDS = ["cabinet", "entreprise", "marque"];
    const INK_ON = ["#FF0055", "#56A0AA", "#ABA256", "#8C7BC8", "#4B8A93", "#AA5655"];
    const N = 128, grid = $("grid"), cards = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement("div");
      c.className = ID + "-c";
      const col = COLS[Math.floor(r() * COLS.length)];
      c.style.background = col;
      c.style.color = INK_ON.includes(col) ? "#16131F" : "#FFFFFF";
      c.setAttribute("data-layout-ignore", "");
      c.innerHTML = `<b>${WORDS[i % 3]}</b><i>N° ${String(i + 1).padStart(3, "0")}</i>`;
      grid.appendChild(c);
      cards.push(c);
    }
    // grid layout at generation s (2^s cards), filling a 1640x820 field
    const lay = (s) => {
      const n = 2 ** s, cols = 2 ** Math.ceil(s / 2), rows = n / cols, g = Math.max(8, 30 - s * 3);
      const w = (1640 - g * (cols - 1)) / cols, h = (820 - g * (rows - 1)) / rows;
      return (i) => ({ x: 140 + (i % cols) * (w + g), y: 150 + Math.floor(i / cols) * (h + g), w, h });
    };
    const L = Array.from({ length: 8 }, (_, s) => lay(s));
    // each new card is born out of its parent (i - 2^(s-1)) — the group divides like cells
    const pos = (i, s) => (i < 2 ** s ? L[s](i) : pos(i - 2 ** (s - 1), s - 1));
    const gen = { v: 0 };
    const render = () => {
      const s0 = Math.floor(gen.v), f = gen.v - s0, s1 = Math.min(7, s0 + 1), e = 1 - Math.pow(1 - f, 4);
      cards.forEach((c, i) => {
        if (i >= 2 ** s1 || (f === 0 && i >= 2 ** s0)) { c.style.display = "none"; return; }
        const A = pos(i, s0), B = pos(i, s1), k = s1 === s0 ? 0 : e;
        const x = A.x + (B.x - A.x) * k, y = A.y + (B.y - A.y) * k, w = A.w + (B.w - A.w) * k, h = A.h + (B.h - A.h) * k;
        c.style.display = "block";
        c.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
        c.style.width = w.toFixed(1) + "px";
        c.style.height = h.toFixed(1) + "px";
        c.style.borderRadius = Math.max(4, Math.min(22, w * 0.06)).toFixed(1) + "px";
        c.firstChild.style.fontSize = Math.max(6, w * 0.075).toFixed(1) + "px";
        c.lastChild.style.fontSize = Math.max(4, w * 0.04).toFixed(1) + "px";
      });
    };
    render();
    // accelerating divisions on "Un groupe qui a grandi vite."
    const g0 = VO["1.1"];
    const steps = [0, 0.3, 0.55, 0.76, 0.94, 1.1, 1.24, 1.36];
    for (let s = 1; s < 8; s++)
      tl.fromTo(gen, { v: s - 1 }, { v: s, duration: steps[s] - steps[s - 1], ease: "none", onUpdate: render, immediateRender: s === 1 }, g0 + steps[s - 1]);
    ["#§t1", "#§t2", "#§t3"].forEach((t, i) =>
      tl.fromTo(t, { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.2)" }, g0 + 0.2 + i * 0.28));
    tl.to(["#§t1", "#§t2", "#§t3"], { opacity: 0, y: -20, duration: 0.3, ease: "power2.in", stagger: 0.05 }, VO["1.2"] - 0.1);

    // "Et une marque…": the group tilts away and keeps growing, out of focus; the old logo comes to the front, too small for it
    const m = VO["1.2"];
    tl.fromTo("#§grid", { rotationX: 0, rotationZ: 0, scale: 1, z: 0 }, { rotationX: 52, rotationZ: -18, scale: 1.7, z: -200, duration: 2.2, ease: "expo.inOut" }, m - 0.1);
    tl.to("#§grid", { scale: 2.6, rotationZ: -26, duration: D - m - 2.1, ease: "none" }, m + 2.1);
    tl.fromTo("#§stage", { filter: "blur(0px)" }, { filter: "blur(7px)", duration: 1.2, ease: "power2.inOut" }, m + 0.4);
    tl.fromTo("#§bg", { backgroundColor: "#FFFFFF" }, { backgroundColor: "#ECEBF1", duration: 1.2, ease: "none" }, m);

    // the old card is cut in horizontal strips so it can lose its story
    const card = $("card"), STR = 7, strips = [];
    for (let k = 0; k < STR; k++) {
      const s = document.createElement("div");
      s.className = ID + "-strip";
      s.style.top = (k * 330 / STR) + "px";
      s.style.height = (330 / STR + 1) + "px";
      s.innerHTML = `<div style="top:${-k * 330 / STR}px"></div>`;
      card.appendChild(s);
      strips.push(s);
    }
    tl.fromTo("#§card", { y: 320, rotationX: 60, opacity: 0, scale: 0.8 }, { y: 0, rotationX: 0, opacity: 1, scale: 1, duration: 1.1, ease: "expo.out" }, m + 0.3);
    tl.fromTo("#§shadow", { opacity: 0 }, { opacity: 1, duration: 0.8 }, m + 0.6);
    tl.to("#§card", { scale: 0.86, duration: 2.6, ease: "sine.inOut" }, m + 1.4);
    // "Qui n'arrivait plus à le raconter." — strips slip, the mark comes apart and fades
    const q = VO["1.3"], slip = { t: 0 };
    tl.fromTo(slip, { t: 0 }, {
      t: 1, duration: D - q, ease: "power2.in", immediateRender: false,
      onUpdate: () => strips.forEach((s, k) => {
        const d = Math.sin(k * 2.3 + 1) * 140 * slip.t + (k % 2 ? 1 : -1) * 30 * slip.t;
        s.style.transform = `translateX(${d.toFixed(1)}px)`;
        s.style.opacity = (1 - slip.t * (0.4 + 0.5 * ((k * 37) % 7) / 7)).toFixed(3);
      }),
    }, q);
    tl.to("#§card", { filter: "blur(3px) grayscale(1)", duration: D - q, ease: "power2.in" }, q);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
