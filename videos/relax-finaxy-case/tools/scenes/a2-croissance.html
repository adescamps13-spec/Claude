<style>
  #§gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .§pill{position:absolute;left:0;top:0;transform-origin:50% 50%}
  #§cap{position:absolute;left:0;right:0;top:860px;text-align:center;font-family:Unbounded;font-weight:500;font-size:64px;letter-spacing:-.01em;color:#212C34}
  #§cap em{font-style:normal;color:#6955AA;display:inline-block}
</style>
<div class="full wash"></div>
<canvas id="§gl" width="1920" height="1080"></canvas>
<div id="§pills"></div>
<div id="§cap">un groupe qui a grandi <em id="§vite">vite.</em></div>
{{HUD:#62666B|01 — LE CONSTAT}}
{{THREE}}
<script>
  (function () {
    const ID = "{{ID}}", D = {{D}}, VO = {{VO}};
    const $ = (s) => document.getElementById(ID + "-" + s);
    const tl = gsap.timeline({ paused: true });
    // one glossy body that absorbs the cabinets, companies and brands drifting toward it (metaballs)
    const S = T3.stage($("gl"), { w: 1920, h: 1080, fov: 30, camZ: 15 });
    const mat = T3.glossy(0xffffff, { irid: 0.6, roughness: 0.2 });
    mat.vertexColors = true;
    const mc = new THREE.MarchingCubes(60, mat, false, true, 140000);
    mc.scale.set(4.2, 4.2, 4.2);
    mc.position.y = 0.35;
    S.scene.add(mc);
    const sh = T3.shadow(2.6, 0.22);
    sh.position.y = -2.7;
    S.scene.add(sh);
    const r = KIT.rng(4);
    const COL = [new THREE.Color(0xff8fb8), new THREE.Color(0x8fd3dc), new THREE.Color(0xb6a6f5), new THREE.Color(0xd8cf8a)];
    const BODY = new THREE.Color(0x9c88f0);
    const N = 7, LABELS = ["cabinet", "marque", "entreprise", "cabinet", "marque", "entreprise", "cabinet"], TAGS = ["tag-p", "tag-c", "tag-r", "tag-y"];
    const balls = Array.from({ length: N }, (_, i) => {
      const a = (i / N) * Math.PI * 2 + 0.5, rad = 0.34 + r() * 0.06;
      return { x: 0.5 + Math.cos(a) * rad, y: 0.5 + Math.sin(a) * rad * 0.62, z: 0.5 + (r() - 0.5) * 0.1, t0: 0.12 + i * 0.16, c: COL[i % COL.length] };
    });
    const pills = balls.map((b, i) => {
      const d = document.createElement("div");
      d.className = ID + "-pill tag " + TAGS[i % 4];
      d.textContent = LABELS[i];
      $("pills").appendChild(d);
      return d;
    });
    const g = { t: 0 }, A = VO["1.1"];
    const world = (b) => {
      // marching-cube space (0..1) → screen px, for the HTML labels
      const v = new THREE.Vector3((b.x - 0.5) * 2 * 4.2, (b.y - 0.5) * 2 * 4.2 + 0.35, (b.z - 0.5) * 2 * 4.2).project(S.camera);
      return [(v.x + 1) * 960, (1 - v.y) * 540];
    };
    const draw = () => {
      const t = g.t;
      mc.reset();
      let eaten = 0;
      balls.forEach((b, i) => {
        const k = T3.ease.clamp((t - A - b.t0) / 0.55), e = T3.ease.inOut(k);
        if (k >= 1) eaten++;
        const x = b.x + (0.5 - b.x) * e, y = b.y + (0.5 - b.y) * e, z = b.z + (0.5 - b.z) * e;
        if (k < 1) mc.addBall(x, y, z, 0.26 * (1 - 0.6 * e), 12, b.c);
        const [sx, sy] = world({ x, y: y + 0.075, z });
        pills[i].style.transform = `translate(${(sx - 70).toFixed(1)}px,${(sy - 22).toFixed(1)}px) scale(${(1 - e).toFixed(3)})`;
        pills[i].style.opacity = (T3.ease.clamp((t - A - b.t0 + 0.5) / 0.2) * (1 - e)).toFixed(3);
      });
      const grow = 0.42 + 0.16 * eaten + 0.04 * Math.sin(t * 3);
      mc.addBall(0.5, 0.5, 0.5, grow, 12, BODY);
      mc.update();
      mc.rotation.y = t * 0.4;
      S.camera.position.z = 15 - 2.2 * T3.ease.inOut(T3.ease.clamp(t / D));
      sh.scale.setScalar(0.7 + eaten * 0.06);
      S.render();
    };
    tl.fromTo(g, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: draw }, 0);
    draw();
    tl.fromTo("#§cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, A - 0.05);
    tl.fromTo("#§vite", { scale: 0.4, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, A + 0.75);
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
