    <style>
      :root {
        --color-teal: #0e8585;
        --color-mint: #45f5b9;
        --color-pale: #e8fffc;
        --color-navy: #0f2a3a;
        --color-white: #ffffff;
        --font-display: "Outfit";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-teal);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
      }
      /* the question a proof scene answers, struck through */
      .kick {
        position: absolute;
        left: 88px;
        top: 186px;
        font-size: 50px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .kick .kq {
        display: inline-block;
        position: relative;
      }
      .kick .kline {
        position: absolute;
        left: -8px;
        right: -8px;
        top: 52%;
        height: 7px;
        border-radius: 4px;
        display: block;
      }
      .kick-light {
        color: var(--color-navy);
      }
      .kick-light .kline {
        background: var(--color-teal);
      }
      .kick-dark {
        color: var(--color-white);
      }
      .kick-dark .kline {
        background: var(--color-mint);
      }
      /* titles slam in from scale: anchor them on their left edge */
      h1 .w,
      h1 .l {
        transform-origin: 0% 70%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--color-teal);
      }
    </style>
  </head>
