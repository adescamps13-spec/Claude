        --color-white: #ffffff;
        --font-display: "Outfit";

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,

        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-teal);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
      }
      #bg {

        inset: 0;
        background: var(--color-teal);
