<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-teal);
      font-family: var(--font-display);
    }
    #route-world {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }
    #route-title {
      position: absolute;
      left: 84px;
      top: 200px;
      font-size: 132px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--color-white);
    }
    #route-title .w {
      display: inline-block;
    }
    #route-l2 {
      color: var(--color-mint);
    }
    #route-sub {
      position: absolute;
      left: 88px;
      top: 490px;
      width: 900px;
      font-size: 46px;
      font-weight: 500;
      line-height: 1.22;
      color: var(--color-white);
    }
  </style>
  <div id="root" data-composition-id="route" data-width="1080" data-height="1920">
    <svg id="route-world" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
    <h1 id="route-title" class="clip" data-start="0" data-duration="3.8">
      <span class="w" id="route-l1">La voiture,</span><br />
      <span class="w" id="route-l2">c'est la liberté</span>
    </h1>
    <p id="route-sub" class="clip" data-start="0" data-duration="3.8">Aller où l'on veut, quand on veut.</p>
  </div>
  <script>
    (function () {
      const I = window.ISO;
      const DUR = 3.8;
      const svg = document.getElementById("route-world");
      const NAVY = "#0F2A3A";
      const ORANGE = "#FF8A3D";

      function render(t) {
        // the camera cruises with the car; at the end the car speeds off down the road
        const yc = 6.5 * t;
        const c = I.camAt(0, yc, 0, 540, 1330, 92);
        const D = [];
        window.ROAD.drawRoad(c, D, yc);
        const boost = I.ease("power3.in", I.seg(t, 3.25, 3.8)) * 12;
        const cy = yc + boost;
        D.push({ k: cy + 0.5, s: I.disc(c, 0, cy + 1.1, 0.004, 1.05, "#0B4F50", { opacity: 0.16 }) });
        D.push({ k: cy + 0.6, s: I.car(c, { x: -0.55, y: cy, dir: "y" }) });
        // the battery starts to matter: a low-charge chip rides above the car
        const chip = I.spring(I.seg(t, 2.0, 2.45), 0.55) * (1 - I.seg(t, 3.2, 3.35));
        if (chip > 0) {
          const q = I.p(c, 0, cy + 1.1, 1.55);
          D.push({
            k: 900,
            s:
              '<g transform="translate(' + q[0].toFixed(1) + "," + (q[1] - 40).toFixed(1) + ") scale(" + chip.toFixed(3) + ')">' +
              '<rect x="-108" y="-34" width="216" height="64" rx="32" fill="#fff" stroke="' + NAVY + '" stroke-width="4"/>' +
              '<rect x="-80" y="-12" width="44" height="22" rx="5" fill="none" stroke="' + NAVY + '" stroke-width="4"/>' +
              '<rect x="-34" y="-5" width="5" height="8" fill="' + NAVY + '"/>' +
              '<rect x="-76" y="-8" width="9" height="14" fill="' + ORANGE + '"/>' +
              '<text x="-14" y="10" font-family="Outfit" font-weight="600" font-size="32" fill="' + NAVY + '">18 %</text></g>',
          });
        }
        // camera energy: slow push, a bump when the battery shows, a rolling whip as the car leaves
        const whip = I.ease("power3.in", I.seg(t, 3.25, 3.8));
        const k = 1.04 + I.push(t, 0, 3.2, 0.1, "sine.inOut") + I.bump(t, 2.0, 0.05) + whip * 0.25;
        const sp = I.p(c, 0, cy + 1.1, 0.5);
        svg.innerHTML =
          I.camFx(I.paint(D), { k, cx: sp[0], cy: sp[1], dx: -whip * 220, dy: whip * 120, rot: -whip * 6 }) +
          '<defs><clipPath id="route-sclip"><rect x="0" y="760" width="1080" height="1160"/></clipPath></defs><g clip-path="url(#route-sclip)">' +
          I.streaks(t, 7, 1600 + whip * 3000, 5, "#FFFFFF", 0.35 + whip * 0.3) + "</g>";
      }

      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      tl.fromTo("#route-l1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#route-l2", { opacity: 0, scale: 1.3, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 0.75);
      tl.fromTo("#route-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.95);
      tl.to(["#route-l1", "#route-l2", "#route-sub"], { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.04 }, 3.35);

      render(0);
      window.__timelines["route"] = tl;
    })();
  </script>
</template>
