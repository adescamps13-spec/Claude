  </style>
  <div id="root" data-composition-id="direct" data-width="1080" data-height="1920">
    <div id="direct-kick" class="clip kick kick-light" data-start="0" data-duration="3.7"><span class="kq" id="direct-kq">Combien d'attente ?<i class="kline" id="direct-kl"></i></span></div>
    <svg id="direct-world" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
    <h1 id="direct-title" class="clip" data-start="0" data-duration="3.7">
      <span class="w" id="direct-w1">Tout</span> <span class="w" id="direct-w2">en direct</span>
    </h1>
    <p id="direct-sub" class="clip" data-start="0" data-duration="3.7">Puissance, disponibilité et tarif de chaque borne&nbsp;: zéro surprise</p>
    <div id="direct-cardclip" class="clip" data-start="0" data-duration="3.7" style="position: absolute; inset: 0" data-layout-allow-overflow>
      <div id="direct-cardwrap">
        <div id="direct-card">
          <div class="dc-top">
            <span class="dc-badge"><svg id="direct-badge" width="72" height="15"></svg></span>
            <span class="dc-name">Hôtel B&amp;B - Rue de l'Université</span>
          </div>
          <div class="dc-price">0,49 €/kWh</div>
          <div class="dc-box">
            <div class="dc-row">
              <div><div class="dc-k">CCS</div><div class="dc-s">Rapide • 300 kW</div></div>
              <div class="dc-v">
                <i></i><span class="dc-roll"><span id="direct-n"><span>4 / 4</span><span>3 / 4</span></span></span> disponibles
              </div>
            </div>
            <div class="dc-row">
              <div><div class="dc-k">Fiabilité</div><div class="dc-s">Charges réussies</div></div>
              <div class="dc-v">Très fiable (99%)</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const I = window.ISO;
      const L = window.ELECTRA_LOGO;
      const DUR = 3.8;
      const svg = document.getElementById("direct-world");
      const TEAL = "#0E8585";
      const NAVY = "#0F2A3A";
      const MINT = "#45F5B9";
      const ORANGE = "#FF8A3D";
      const PARK = 1.35;

      document.getElementById("direct-badge").innerHTML =
        '<g transform="scale(' + (72 / L.word.w).toFixed(5) + ')"><path d="' + L.word.d + '" fill="#fff"/></g>';

      function render(t) {
        const c = I.camAt(3.4, 1.6, 0, 540, 850, 66);
        const D = [];
        const g = I.lerp(0.4, 1, I.ease("expo.out", I.seg(t, 0, 0.55)));
        // station slab with four bays
        D.push({ k: -300, s: I.box(c, { x: I.lerp(3.4, -1.2, g), y: I.lerp(1.6, -1.6, g), z: -0.3, w: 9.2 * g, d: 6.4 * g, h: 0.3, top: "#D2EEEA", left: "#A8D6CF", right: "#8CC6BE" }) });
        for (let i = 0; i < 4; i++) {
          const x = i * 1.9;
          const k = I.spring(I.seg(t, 0.1 + i * 0.07, 0.6 + i * 0.07), 0.55);
          if (k <= 0) continue;
          D.push({ k: -290, s: I.tile(c, x - 0.15, -0.2, 0.002, 0.07, 4.2 * k, "#FFFFFF") });
          // charger
          D.push({ k: x - 1.2, s: I.box(c, { x: x + 0.45, y: -1.2, z: 0, w: 0.8, d: 0.6, h: 1.9 * k, color: TEAL, left: "#139797", right: "#0C7474", top: "#1FB0AD" }) });
          // status light: mint free, orange taken
          const busy = i === 1 ? I.seg(t, PARK, PARK + 0.12) : 0;
          const col = I.mix(MINT, ORANGE, busy);
          D.push({ k: x - 1.1, s: I.box(c, { x: x + 0.5, y: -1.15, z: 1.9 * k, w: 0.7, d: 0.5, h: 0.12 * k, color: col, left: col, right: I.shade(col, -0.18), top: I.shade(col, 0.35) }) });
        }
        // the 3D world reads live power on the busy charger
        const busyK = I.seg(t, PARK + 0.1, PARK + 0.25);
        if (busyK > 0) {
          const q = I.p(c, 2.75, -0.9, 2.4);
          const kw = Math.round(300 * I.ease("power2.out", I.seg(t, PARK + 0.1, 2.6)));
          D.push({
            k: 400,
            s:
              '<g opacity="' + busyK.toFixed(3) + '"><rect x="' + (q[0] - 84).toFixed(1) + '" y="' + (q[1] - 60).toFixed(1) + '" width="168" height="58" rx="29" fill="' + NAVY + '"/>' +
              '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] - 20).toFixed(1) + '" text-anchor="middle" font-family="Outfit" font-weight="600" font-size="32" fill="' + MINT + '">⚡ ' + kw + " kW</text></g>",
          });
        }
        // a car reverses into bay 2
        const park = I.ease("power3.out", I.seg(t, 0.45, PARK));
        const cy = I.lerp(4.8, -0.35, park);
        const ca = I.seg(t, 0.4, 0.55);
        if (ca > 0) D.push({ k: 2.2 + cy, s: '<g opacity="' + ca.toFixed(3) + '">' + I.car(c, { x: 2.2, y: cy, dir: "y", body: "#173847" }) + "</g>" });
        // hand-off: teal flood from the card
        const fl = I.ease("power2.inOut", I.seg(t, 3.3, 3.78));
        if (fl > 0) D.push({ k: 999, s: '<circle cx="540" cy="1140" r="' + (fl * 1400).toFixed(1) + '" fill="' + TEAL + '"/>' });
        // camera energy
        const k = 1 + I.push(t, 0.3, 1.2, 0.06) + I.bump(t, PARK, 0.05);
        const sh = I.shake(t, [PARK], 9);
        svg.innerHTML = I.camFx(I.paint(D), { k: 1 + (k - 1) * (1 - I.seg(t, 3.2, 3.5)), cx: 540, cy: 800, dx: sh[0], dy: sh[1] });
      }

      const tl = gsap.timeline();
      const state = { t: 0 };
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);

      tl.fromTo("#direct-w1", { opacity: 0, scale: 1.3, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 0.38);
      tl.fromTo("#direct-w2", { opacity: 0, scale: 1.3, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 0.5);
      tl.fromTo("#direct-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.7);
      // the station card morphs in from a narrow strip
      tl.fromTo("#direct-card", { scaleX: 0.12, scaleY: 0.5, opacity: 0, filter: "blur(12px)" }, { scaleX: 1, scaleY: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.55);
      // availability rolls from 4/4 to 3/4 when the car plugs in
      tl.fromTo("#direct-n", { y: 0 }, { y: -40, duration: 0.25, ease: "power3.inOut" }, PARK + 0.05);
      tl.to("#direct-card", { opacity: 0, filter: "blur(10px)", scale: 0.96, duration: 0.22, ease: "power2.in" }, 3.3);
      tl.to(["#direct-kick", "#direct-w1", "#direct-w2", "#direct-sub"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.04 }, 3.3);

      // the question it answers, struck through
      tl.fromTo("#direct-kq", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, 0.0);
      tl.fromTo("#direct-kl", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.inOut", transformOrigin: "0% 50%" }, 0.3);
      tl.to("#direct-kq", { opacity: 0.55, duration: 0.2, ease: "power2.out" }, 0.5);

      render(0);
      // designed at 3.8 s, played at 3.7 s to keep pace with the voiceover
      const scene = gsap.timeline({ paused: true });
      scene.add(tl.timeScale(DUR / 3.7), 0);
      window.__timelines["direct"] = scene;
    })();
  </script>
</template>
